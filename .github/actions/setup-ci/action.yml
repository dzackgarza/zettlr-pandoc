name: Set up the CI toolchain
description: >-
  The tools, the export toolchain and the packages that each job of
  check.yml needs. The job checks the repository out first.
inputs:
  node-version:
    description: The version of NodeJS
    required: true
runs:
  using: composite
  steps:
    - name: Setup Bun 1.3.11
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.11
    - name: Setup NodeJS ${{ inputs.node-version }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ inputs.node-version }}
    - name: Setup just
      uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
    # `just setup-ci` installs Flowmark from its main branch as a uv tool.
    - name: Setup uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
    - name: Key the CI toolchain cache by the week
      id: toolchain-week
      shell: bash
      run: echo "week=$(date --utc +%G-W%V)" >> "$GITHUB_OUTPUT"
    - name: Restore the CI toolchain
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/texlive
          ~/ci-downloads
        key: ci-toolchain-${{ steps.toolchain-week.outputs.week }}-${{ hashFiles('scripts/setup-ci-toolchain.sh', 'scripts/pandoc-reference.json') }}
      id: toolchain-cache
    - name: Provision real export toolchain
      shell: bash
      run: just setup-ci
    # The jobs of one run save the same key; the first save wins, and each
    # other save ends with a warning.
    - name: Save the CI toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/texlive
          ~/ci-downloads
        key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
    - name: Install packages
      shell: bash
      run: bun ci
    # The electron package downloads its distribution at the first require.
    - name: Configure Electron SUID sandbox
      shell: bash
      run: |
        node -e "require('electron')"
        bash scripts/configure-electron-sandbox-ci.sh node_modules/electron/dist
