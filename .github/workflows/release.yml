name: Release
# `just release` pushes an annotated tag v<version>. This workflow builds the
# AppImage from that tag and publishes it with SHA256SUMS.txt as the GitHub
# release the in-app updater reads.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  NODE_VERSION: '22'
jobs:
  release:
    name: Build and publish the AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref }}
          submodules: true
      - name: Fetch the annotated tag
        run: git fetch --force origin "${{ github.ref }}:${{ github.ref }}"
      - name: Setup Bun 1.3.11
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Install trash-cli
        run: sudo apt-get update && sudo apt-get install -y trash-cli
      - name: Install packages
        run: bun ci
      # The electron package has no postinstall script; install.js downloads
      # the runtime that verify-build.py packages.
      - name: Download the Electron runtime
        run: node node_modules/electron/install.js
      - name: Build the AppImage and SHA256SUMS.txt
        run: just release-assets
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="$(git tag -l --format='%(contents:subject)' "$tag")"
          gh release create "$tag" --verify-tag --title "$title" --generate-notes release/*
