name: PR QC and Slop Review
on:
  pull_request: {}
jobs:
  qc-ci:
    uses: dzackgarza/ai-review-ci/.github/workflows/_qc.yml@main
    permissions:
      contents: read
      issues: read
    with:
      tier: test-ci
      profile: 'bun'
      setup_recipe: 'setup-ci'
      infra_ref: 'main'
      setup_cache_paths: |
        ~/texlive
        ~/ci-downloads
      setup_cache_key_files: |
        scripts/setup-ci-toolchain.sh
        scripts/pandoc-reference.json
  deterministic-diff:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    with:
      gate: deterministic-diff
      profile: 'bun'
  delegation-conformance:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    with:
      gate: delegation-conformance
      profile: 'bun'
  qc-doctor:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      actions: read
      # Label-alignment check reads live labels via `gh label list`
      # (GET /repos/{owner}/{repo}/labels), which requires Issues (read).
      issues: read
      pull-requests: read
    with:
      gate: qc-doctor
      profile: 'bun'
  pr-description-checklist:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: read
    with:
      gate: pr-description-checklist
      profile: 'bun'
