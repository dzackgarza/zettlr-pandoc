name: PR55 remediation build

on:
  push:
    branches:
      - automation/pr55-stage

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: automation/pr55-stage
          fetch-depth: 0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@d1f9f8c0bff78ae8f7cb28d06b2a30bcf400e9a3
        with:
          node-version: 22
      - name: Apply remediation source changes
        run: python3 scripts/pr55-remediate.py
      - name: Resolve dependencies and generate API types
        run: |
          bun install
          bun run generate:agent-api-types
      - name: Commit generated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor: complete PR55 remediation"
            git push origin HEAD:automation/pr55-stage
          fi
      - name: Typecheck
        run: bun run typecheck
      - name: Focused review tests
        run: |
          bun run test -- --grep "Agent HTTP API|ReviewDiffStore|ReviewSidecarStore|review-diff|reference rename"
