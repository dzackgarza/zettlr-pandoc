name: Audit
on:
  workflow_dispatch: {}
  push:
    paths:
      - bun.lock
  pull_request:
    paths:
      - bun.lock
permissions:
  contents: read
env:
  NODE_VERSION: '22'
concurrency:
  group: 'audit'
  cancel-in-progress: true
jobs:
  audit:
    name: Run audit
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DISCORD_AUDIT_WEBHOOK }}
    steps:
      # Setup
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref }}
      - name: Setup Bun 1.3.11
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install packages
        run: bun ci
      # Run the actual audit
      - name: Audit
        run: |-
          audit_status=0
          bun audit --audit-level moderate --json > audit_result.raw || audit_status=$?
          if [[ $(od -An -tx1 -N2 audit_result.raw | tr -d ' ') == 1f8b ]]; then
            gzip -dc audit_result.raw > audit_result.json || true
          else
            mv audit_result.raw audit_result.json
          fi
          jq -e '
            type == "object"
            and all(
              to_entries[];
              (.value | type == "array")
              and all(
                .value[];
                (.title | type == "string")
                and (.severity | type == "string")
                and (.vulnerable_versions | type == "string")
                and (.url | type == "string")
              )
            )
          ' audit_result.json > /dev/null
          test "${audit_status}" -eq 0 || test "${audit_status}" -eq 1
      - name: Format results
        run: ./scripts/audit-report.sh format
      - name: Report to Discord
        if: env.WEBHOOK != ''
        env:
          RUN_URL: https://github.com/Zettlr/Zettlr/actions/runs/${{ github.run_id }}
        run: ./scripts/audit-report.sh discord
      - name: Report results in summary
        run: ./scripts/audit-report.sh summary
