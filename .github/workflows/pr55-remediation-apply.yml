name: Apply recovered PR55 remediation

on:
  pull_request:
    branches: [develop]
    types: [synchronize, opened, reopened]

permissions:
  contents: write

concurrency:
  group: apply-recovered-pr55-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/outstanding-issue-sweep'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out PR #55's branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/outstanding-issue-sweep
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and apply the implementation patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/pr55-direct-remediation
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import lzma
          import subprocess
          from pathlib import Path

          ref = "origin/automation/pr55-direct-remediation"
          parts: list[str] = []
          for index in range(7):
              raw = subprocess.check_output(
                  ["git", "show", f"{ref}:.github/pr55-remediation/part-{index:02d}.b64"],
                  text=True,
              )
              parts.append("".join(raw.split()))

          def decode(encoded: str) -> bytes:
              return base64.b64decode(encoded, altchars=b"-_", validate=True)

          compressed_prefix = b"".join(decode(part) for part in parts[:5])
          expected_prefix = b"diff --git a/package.json b/package.json\n"

          valid_part5: list[tuple[int, bytes]] = []
          encoded5 = parts[5]
          for position in range(len(encoded5)):
              repaired = encoded5[:position] + encoded5[position + 1:]
              try:
                  decoded5 = decode(repaired)
                  decompressor = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
                  output = decompressor.decompress(compressed_prefix + decoded5)
              except (ValueError, lzma.LZMAError):
                  continue
              if output.startswith(expected_prefix) and not decompressor.eof:
                  valid_part5.append((position, decoded5))
              if position > 0 and position % 5000 == 0:
                  print(f"Checked {position}/{len(encoded5)} part-05 positions")

          if not valid_part5:
              raise SystemExit("No single-character repair made part 05 a valid XZ prefix")
          print(f"Part 05 has {len(valid_part5)} valid repair position(s): {[p for p, _ in valid_part5]}")

          encoded6 = parts[6]
          for position5, decoded5 in valid_part5:
              prefix5 = compressed_prefix + decoded5
              for position6 in range(len(encoded6)):
                  repaired6 = encoded6[:position6] + encoded6[position6 + 1:]
                  try:
                      patch = lzma.decompress(prefix5 + decode(repaired6), format=lzma.FORMAT_XZ)
                  except (ValueError, lzma.LZMAError):
                      continue
                  if not patch.startswith(expected_prefix):
                      continue
                  Path("/tmp/pr55-remediation.patch").write_bytes(patch)
                  print(
                      f"Recovered {len(patch)} patch bytes after dropping "
                      f"part-05[{position5}] and part-06[{position6}]"
                  )
                  break
              else:
                  continue
              break
          else:
              raise SystemExit("No single-character repair of part 06 completed the XZ stream")
          PY
          changed_paths="$(git apply --numstat /tmp/pr55-remediation.patch | awk '{print $3}')"
          if printf '%s\n' "$changed_paths" | grep -Eq '^(\.github/|AGENTS\.md$|scripts/pr55-)'; then
            echo "Recovered patch contains staging or administrative files" >&2
            printf '%s\n' "$changed_paths" >&2
            exit 1
          fi
          git apply --check --binary /tmp/pr55-remediation.patch
          git apply --binary /tmp/pr55-remediation.patch

      - name: Install dependencies and generate API types
        run: |
          bun install
          bun run generate:agent-api-types

      - name: Typecheck
        run: bun run typecheck

      - name: Run focused behavioral suites
        run: |
          bun run test -- \
            test/agent-http-api.spec.ts \
            test/review-diff-store.spec.ts \
            test/review-sidecar-store.spec.ts \
            test/editor-authority-sync-guard.spec.ts \
            test/reference-rename-atomicity.spec.ts

      - name: Run complete unit suite
        run: bun run test

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install --yes just

      - name: Provision the repository's real CI toolchain
        run: bash scripts/setup-ci-toolchain.sh

      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run assembled application E2E
        run: bun run test:e2e

      - name: Commit the implementation directly to PR #55
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr55-remediation-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "Recovered implementation produced no changes" >&2
            exit 1
          fi
          git commit -m "refactor(review): complete PR 55 remediation"
          git push origin HEAD:feat/outstanding-issue-sweep
