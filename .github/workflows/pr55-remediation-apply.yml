name: Export recovered PR55 payload

on:
  pull_request:
    branches: [develop]
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'feat/outstanding-issue-sweep'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR #55's branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/outstanding-issue-sweep
          fetch-depth: 0

      - name: Copy the exact stored payload blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/pr55-direct-remediation
          mkdir -p /tmp/pr55-payload
          for part in 00 01 02 03 04 05 06; do
            git show "origin/automation/pr55-direct-remediation:.github/pr55-remediation/part-${part}.b64" \
              > "/tmp/pr55-payload/part-${part}.b64"
          done
          sha256sum /tmp/pr55-payload/* > /tmp/pr55-payload/SHA256SUMS
          wc -c /tmp/pr55-payload/*

      - name: Upload the exact payload
        uses: actions/upload-artifact@v4
        with:
          name: pr55-raw-remediation-payload
          path: /tmp/pr55-payload
          if-no-files-found: error
          retention-days: 1
