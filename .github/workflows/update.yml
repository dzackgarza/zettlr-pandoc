name: Update static assets
on:
  push:
    paths:
      - '.github/workflows/update.yml'
  workflow_dispatch: {} # Used to manually trigger a nightly build.
  schedule:
    # Run on 1st and 15th of each month
    - cron: '1 2 1,15 * *'
permissions:
  contents: write
env:
  NODE_VERSION: '22'
jobs:
  update:
    name: Update static assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # A workflow-change push validates the pushed revision. Scheduled and
          # manual update runs continue to own the develop branch.
          ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}
      - name: Setup Bun 1.3.11
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Provision real export toolchain
        run: just setup-ci
      # The scripts require some modules that we need to install.
      - name: Install dependencies
        run: bun ci
      - name: Config git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      # Update CSL files
      - name: Update CSL files
        run: |
          bun run update:csl
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore(citeproc): Update CSL files"
      # Update the CITATION.cff file if applicable
      - name: Update CITATION.cff
        run: |
          bun run update:citation
          git add -A
          git diff-index --quiet HEAD || git commit -m "Update CITATION.cff"
      # Test to make sure we don't break anything
      - name: Test build
        run: bun run test
      - name: Push changes
        if: github.event_name != 'push'
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: develop
