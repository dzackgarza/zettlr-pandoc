name: PR55 direct cleanup trigger

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/outstanding-issue-sweep
          fetch-depth: 0

      - name: Run the cleanup transformation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr55-direct-cleanup.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          for number, line in enumerate(script.splitlines(), 1):
              if 255 <= number <= 275:
                  print(f"{number:04d}: {line}")
          exec(compile(script, 'pr55-direct-cleanup.py', 'exec'))
          PY

          git diff --check
          git status --short

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove proxy tests and application authentication"
          git push origin HEAD:feat/outstanding-issue-sweep
