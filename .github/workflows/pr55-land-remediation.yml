name: Land staged PR55 remediation

on:
  push:
    branches:
      - feat/outstanding-issue-sweep
    paths:
      - .github/workflows/pr55-land-remediation.yml

permissions:
  contents: write
  actions: read

jobs:
  land:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the final branch tree without retaining this runner commit
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git fetch origin automation/pr55-direct-remediation automation/pr55-stage feat/outstanding-issue-sweep
          BASE_SHA="$(git rev-parse "${TRIGGER_SHA}^")"
          git checkout -B pr55-final "${BASE_SHA}"

          DIRECT_BASE="$(git merge-base "${BASE_SHA}" origin/automation/pr55-direct-remediation)"
          git diff --binary "${DIRECT_BASE}"..origin/automation/pr55-direct-remediation | git apply --3way

          if git cat-file -e origin/automation/pr55-stage:scripts/pr55-remediate.py 2>/dev/null; then
            git show origin/automation/pr55-stage:scripts/pr55-remediate.py > /tmp/pr55-remediate.py
            python3 /tmp/pr55-remediate.py
          fi

          rm -f .github/workflows/pr55-land-remediation.yml
          git add -A
          git commit -m "refactor(review): land remediation architecture"
      - name: Install and generate
        run: |
          set -euo pipefail
          bun install
          if bun run 2>/dev/null | grep -q 'generate:agent-api-types'; then
            bun run generate:agent-api-types
            git add package.json bun.lock source/types/generated/agent-api.ts
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi
      - name: Typecheck
        run: bun run typecheck
      - name: Focused behavior tests
        run: bun run test -- --grep "Agent HTTP API|ReviewDiffStore|ReviewSidecarStore|review-diff|reference rename"
      - name: Push the verified tree directly to PR 55
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git push --force-with-lease=refs/heads/feat/outstanding-issue-sweep:${TRIGGER_SHA} origin HEAD:refs/heads/feat/outstanding-issue-sweep
