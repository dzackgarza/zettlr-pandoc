name: PR55 prune deleted test references

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/outstanding-issue-sweep
          fetch-depth: 0

      - name: Remove deleted suites from focused recipe
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('justfile')
          text = path.read_text(encoding='utf-8')
          for suite in (
              ' "test/reference-rename-undo-route.spec.ts"',
              ' "test/pandoc-quick-help-references.spec.ts"',
          ):
              if text.count(suite) != 1:
                  raise SystemExit(f'expected exactly one reference to {suite!r}')
              text = text.replace(suite, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add justfile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: remove deleted suites from focused recipe"
          git push origin HEAD:feat/outstanding-issue-sweep
