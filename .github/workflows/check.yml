name: Unit Tests / Lint
# A push to develop or master, each pull request, and a call of another workflow.
# A branch of a pull request gets one run for each head: the pull_request run.
on:
  push:
    branches:
      - develop
      - master
  pull_request: null
  workflow_call: null
permissions:
  contents: read
env:
  NODE_VERSION: "22"
# One run of this workflow for each event and branch: a new head cancels the run of
# the head before it. A pull_request run has github.ref refs/pull/<n>/merge, so
# the group names github.head_ref, the branch of the pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Unit Tests / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Always fetch the branch that triggered the event (develop or master)
          ref: ${{ github.ref }}
          submodules: true
      - name: Setup Bun 1.3.11
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      # `just setup-ci` installs Flowmark from its main branch as a uv tool.
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Restore the CI toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/texlive
            ~/ci-downloads
          key: ci-toolchain-${{ hashFiles('scripts/setup-ci-toolchain.sh', 'scripts/pandoc-reference.json') }}
        id: toolchain-cache
      - name: Provision real export toolchain
        run: just setup-ci
      - name: Save the CI toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/texlive
            ~/ci-downloads
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
      - name: Install packages
        run: bun ci
      - name: Verify pinned Pandoc parser reference data
        run: bun run check:pandoc-reference-data
      # The electron package downloads its distribution at the first require.
      - name: Configure Electron SUID sandbox
        run: |
          node -e "require('electron')"
          bash scripts/configure-electron-sandbox-ci.sh node_modules/electron/dist
      - name: Run unit tests
        run: bun run test
      # Compile the real webpack bundles (main + renderer + preload). tsc/eslint
      # type-check but never bundle, so a renderer file importing a main-only
      # module (e.g. `from 'electron'`, which drags in `child_process`) passes
      # lint yet breaks `bun run start`. `just package` runs the same webpack
      # compile as launching the app, minus the installer makers, and fails
      # when the build wrote no app.asar of this commit. The assembled-app
      # E2E step starts this binary, so the build comes first.
      - name: Build app bundle
        run: just package
      # The packaged app holds a copy of the Electron distribution. The
      # launch-delivery cases start that binary itself.
      - name: Configure the SUID sandbox of the packaged app
        run: bash scripts/configure-electron-sandbox-ci.sh out/Zettlr-Pandoc-linux-x64
      - name: Run assembled-app E2E
        run: just test-e2e
      - name: Upload assembled-app E2E logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zettlr-*-e2e-latest
          retention-days: 7
      - name: Test CSL update
        run: bun run update:csl
      - name: Test Citation update
        run: bun run update:citation
