name: Unit Tests / Lint
# A push to develop or master, each pull request, and a call of another workflow.
# A branch of a pull request gets one run for each head: the pull_request run.
on:
  push:
    branches:
      - develop
      - master
  pull_request: null
  workflow_call: null
permissions:
  contents: read
env:
  NODE_VERSION: "22"
# One run of this workflow for each event and branch: a new head cancels the run of
# the head before it. A pull_request run has github.ref refs/pull/<n>/merge, so
# the group names github.head_ref, the branch of the pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
# The unit job and the shards of the assembled-app run are jobs of their own,
# so the time of a run is the time of its slowest job and not their sum (#70).
# Without a limit, a step that does not end holds a runner for 6 hours.
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Always fetch the branch that triggered the event (develop or master)
          ref: ${{ github.ref }}
          submodules: true
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify pinned Pandoc parser reference data
        run: bun run check:pandoc-reference-data
      - name: Typecheck the sources and the contract fixtures
        run: bun run typecheck
      # The types of the Agent API are generated from openapi.yaml and
      # formatted with the global biome configuration of ai-review-ci.
      - name: Verify generated Agent API types
        run: |
          git clone --depth 1 https://github.com/dzackgarza/ai-review-ci "$HOME/ai-review-ci"
          bun run check:agent-api-types
      - name: Run unit tests
        run: bun run test
      - name: Test CSL update
        run: bun run update:csl
      - name: Test Citation update
        run: bun run update:citation
  e2e:
    name: Assembled-app E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failed shard does not stop the other shards: a run names each
      # failed file.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref }}
          submodules: true
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Compile the real webpack bundles (main + renderer + preload). tsc/eslint
      # type-check but never bundle, so a renderer file importing a main-only
      # module (e.g. `from 'electron'`, which drags in `child_process`) passes
      # lint yet breaks `bun run start`. `just package` runs the same webpack
      # compile as launching the app, minus the installer makers, and fails
      # when the build wrote no app.asar of this commit. Each shard builds the
      # package itself: a build takes less time than the wait for a build job
      # and the transfer of its package.
      - name: Build app bundle
        run: just package
      # The packaged app holds a copy of the Electron distribution. The
      # launch-delivery cases start that binary itself.
      - name: Configure the SUID sandbox of the packaged app
        run: bash scripts/configure-electron-sandbox-ci.sh out/Zettlr-Pandoc-linux-x64
      - name: Run assembled-app E2E
        timeout-minutes: 8
        run: just test-e2e ${{ matrix.shard }}/4
      - name: Upload assembled-app E2E logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: /tmp/zettlr-*-e2e-latest
          retention-days: 7
  # The check that the protection of develop requires. It passes when each
  # other job of the run passed.
  check:
    name: Unit Tests / Lint
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Each job of the run passed
        env:
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "unit: $UNIT; e2e: $E2E"
          test "$UNIT" = success
          test "$E2E" = success
