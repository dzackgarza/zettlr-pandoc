name: Unit Tests / Lint

# On every push, for every pull-request and whenever another workflow calls this one
on: [push, pull_request, workflow_call]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

# Ensure only a single unit test workflow runs at any one time for any event and
# ref. This allows multiple unit tests/linters to run, but at most one per ref.
# NOTE: Changed `ref` to `sha`, since even for PRs, `ref` will be `develop`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Unit Tests / Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # Always fetch the branch that triggered the event (develop or master)
        ref: ${{ github.ref }}
    - name: Enable Yarn 4.x
      run: corepack enable
    - name: Setup NodeJS ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
    - name: Install packages
      run: yarn install --immutable
    - name: Run ESLint
      run: yarn lint
    - name: Run unit tests
      run: yarn test
    # Compile the real webpack bundles (main + renderer + preload). tsc/eslint
    # type-check but never bundle, so a renderer file importing a main-only
    # module (e.g. `from 'electron'`, which drags in `child_process`) passes
    # lint yet breaks `yarn start`. `package` runs the same webpack compile as
    # launching the app, minus the installer makers — so this fails in CI
    # instead of being discovered by whoever next runs the app.
    - name: Build app bundle
      run: yarn package:linux-x64
    - name: Test CSL update
      run: yarn update:csl
    - name: Test Citation update
      run: yarn update:citation
