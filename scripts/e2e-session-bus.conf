<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The session bus of one assembled-app test run (`just test-e2e`,
  `just test-e2e-file`). The app of a run sends its desktop notifications and
  its other session requests to this bus, not to the bus of the author.

  The bus has no service directories. The stock session configuration starts
  a service on request (a notification daemon among them), and such a service
  draws on the compositor of the author. On this bus a request for a service
  that no process of the run owns gets the answer "no such service".
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
