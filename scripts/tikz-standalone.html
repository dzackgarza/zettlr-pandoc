<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikZ editor</title>
  <style>
    body { margin: 0; font: 14px system-ui; color: #eee; background: #242424; }
    header { display: flex; align-items: center; gap: 1rem; padding: .5rem 1rem; }
    main { display: grid; grid-template-columns: minmax(30rem, 2fr) minmax(20rem, 1fr); height: calc(100vh - 3rem); }
    section { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid #555; }
    section + section { border-left: 1px solid #555; }
    nav { display: flex; gap: .5rem; padding: .4rem; }
    iframe, #compiled { flex: 1; width: 100%; border: 0; background: white; }
    #compiled { display: flex; align-items: center; justify-content: center; overflow: auto; padding: 1rem; box-sizing: border-box; }
    #compiled svg { width: min(100%, 28rem); height: auto; max-height: 100%; }
    pre { max-height: 25%; overflow: auto; margin: 0; white-space: pre-wrap; color: #ffb3b3; }
    button { cursor: pointer; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  </style>
</head>
<body>
  <header><strong>TikZ editor</strong><button id="save">Save</button><span id="status"></span></header>
  <main>
    <section><iframe id="canvas" src="/tikz-editor/index.html" title="TikZ source and visual editor"></iframe></section>
    <section><nav>Compiled preview</nav><div id="compiled"></div><pre id="diagnostics" role="status"></pre></section>
  </main>
  <script type="module">
    const canvas = document.querySelector('#canvas');
    const compiled = document.querySelector('#compiled');
    const diagnostics = document.querySelector('#diagnostics');
    const status = document.querySelector('#status');
    let revision = 0;
    let currentSource = '';
    let loadedSource = '';
    let ready = false;
    let renderTimer;
    let renderRequest = 0;
    let documentRevision;

    function loadCanvas() {
      if (!ready) return;
      loadedSource = currentSource;
      revision += 1;
      canvas.contentWindow.postMessage({
        action: 'load', revision, source: loadedSource, autosave: 0, fileName: 'document.tikz'
      }, '*');
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      const requestId = ++renderRequest;
      renderTimer = setTimeout(async () => {
        status.textContent = 'Compiling…';
        try {
          const response = await fetch('/api/render', { method: 'POST', body: currentSource });
          if (!response.ok) throw new Error(await response.text());
          const result = await response.json();
          if (requestId !== renderRequest) return;
          if (result.ok) {
            compiled.innerHTML = result.svg;
            diagnostics.textContent = '';
            status.textContent = 'Compiled';
          } else {
            diagnostics.textContent = result.log || result.missing?.join(', ') || `${result.kind}: ${result.code || result.signal || ''}`;
            status.textContent = 'Compile failed';
          }
        } catch (error) {
          if (requestId !== renderRequest) return;
          diagnostics.textContent = String(error);
          status.textContent = 'Compile failed';
        }
      }, 350);
    }

    window.addEventListener('message', (event) => {
      if (event.source !== canvas.contentWindow) return;
      const message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      if (message.event === 'init') {
        ready = true;
        loadCanvas();
      } else if (message.event === 'change' && message.revision === revision && typeof message.source === 'string') {
        currentSource = message.source;
        loadedSource = message.source;
        status.textContent = 'Unsaved';
        scheduleRender();
      }
    });
    document.querySelector('#save').addEventListener('click', async () => {
      const response = await fetch('/api/document', {
        method: 'PUT', headers: { 'if-match': documentRevision }, body: currentSource
      });
      if (response.ok) {
        documentRevision = response.headers.get('etag');
        status.textContent = 'Saved';
      } else {
        status.textContent = await response.text();
      }
    });
    window.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 's') {
        event.preventDefault();
        document.querySelector('#save').click();
      }
    });
    const response = await fetch('/api/document');
    if (!response.ok) throw new Error(await response.text());
    documentRevision = response.headers.get('etag');
    currentSource = await response.text();
    loadCanvas();
    scheduleRender();
  </script>
</body>
</html>
