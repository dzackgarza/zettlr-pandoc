<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikZ editor</title>
  <style>
    body { margin: 0; font: 14px system-ui; color: #eee; background: #242424; }
    header { display: flex; align-items: center; gap: 1rem; padding: .5rem 1rem; }
    main { display: grid; grid-template-columns: minmax(30rem, 2fr) minmax(20rem, 1fr); height: calc(100vh - 3rem); }
    section { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid #555; }
    section + section { border-left: 1px solid #555; }
    nav { display: flex; gap: .5rem; padding: .4rem; }
    iframe, #compiled { flex: 1; width: 100%; border: 0; background: white; }
    #quiver { display: none; }
    #compiled { display: flex; align-items: center; justify-content: center; overflow: auto; padding: 1rem; box-sizing: border-box; }
    #compiled svg { width: min(100%, 28rem); height: auto; max-height: 100%; }
    pre { max-height: 25%; overflow: auto; margin: 0; white-space: pre-wrap; color: #ffb3b3; }
    button { cursor: pointer; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  </style>
</head>
<body>
  <header><strong>TikZ editor</strong><button id="save">Save</button><span id="status"></span></header>
  <main>
    <section><nav><button id="visual">Visual editor</button><button id="diagram">Quiver</button></nav><iframe id="canvas" title="TikZ source and visual editor"></iframe><iframe id="quiver" title="Quiver diagram editor"></iframe></section>
    <section><nav>Compiled preview</nav><div id="compiled"></div><pre id="diagnostics" role="status"></pre></section>
  </main>
  <script src="/host.js"></script>
  <script type="module">
    // The editor and Quiver message contracts live in their pinned iframe hosts:
    // vendor/tikz-editor/embed/src/main.tsx and vendor/quiver/src/zettlr-host.mjs.
    const host = globalThis.tikzWorkbenchHost;
    if (!host) throw new Error('TikZ workbench host is missing');
    const canvas = document.querySelector('#canvas');
    const quiver = document.querySelector('#quiver');
    const compiled = document.querySelector('#compiled');
    const diagnostics = document.querySelector('#diagnostics');
    const status = document.querySelector('#status');
    let revision = 0;
    let currentSource = '';
    let loadedSource = '';
    let ready = false;
    let renderTimer;
    let renderRequest = 0;
    let documentRevision;
    let quiverReady = false;
    let quiverLoaded = false;
    let quiverSource = '';
    let quiverSession = crypto.randomUUID();
    let quiverMacros;

    canvas.src = host.editorUrl;
    quiver.src = host.quiverUrl;

    function sendQuiverLoad() {
      if (!quiverReady || !quiverMacros) return;
      quiverSource = currentSource;
      quiver.contentWindow.postMessage({
        type: 'zettlr-quiver:load', sessionId: quiverSession,
        source: currentSource, macros: quiverMacros.macros, theme: 'light'
      }, '*');
      quiverLoaded = true;
    }

    function loadCanvas() {
      if (!ready) return;
      loadedSource = currentSource;
      revision += 1;
      canvas.contentWindow.postMessage({
        action: 'load', revision, source: loadedSource, autosave: 0, fileName: 'document.tikz', imageBaseUrl: host.imageBaseUrl
      }, '*');
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      const requestId = ++renderRequest;
      renderTimer = setTimeout(async () => {
        status.textContent = 'Compiling…';
        try {
          const result = await host.compile(currentSource);
          if (requestId !== renderRequest) return;
          if (result.ok) {
            compiled.innerHTML = result.svg;
            diagnostics.textContent = '';
            status.textContent = 'Compiled';
          } else {
            diagnostics.textContent = result.log || result.missing?.join(', ') || `${result.kind}: ${result.code || result.signal || ''}`;
            status.textContent = 'Compile failed';
          }
        } catch (error) {
          if (requestId !== renderRequest) return;
          diagnostics.textContent = String(error);
          status.textContent = 'Compile failed';
        }
      }, 350);
    }

    window.addEventListener('message', (event) => {
      if (event.source !== canvas.contentWindow && event.source !== quiver.contentWindow) return;
      const message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      if (event.source === quiver.contentWindow) {
        if (message.type === 'zettlr-quiver:ready') {
          quiverReady = true;
          sendQuiverLoad();
        } else if (message.sessionId === quiverSession && message.type === 'zettlr-quiver:change' && typeof message.source === 'string' && currentSource === quiverSource) {
          currentSource = message.source;
          quiverSource = currentSource;
          loadCanvas();
          status.textContent = 'Unsaved';
          scheduleRender();
        } else if (message.sessionId === quiverSession && message.type === 'zettlr-quiver:error') {
          diagnostics.textContent = message.message;
        }
        return;
      }
      if (message.event === 'init') {
        ready = true;
        loadCanvas();
      } else if (message.event === 'change' && message.revision === revision && typeof message.source === 'string') {
        currentSource = message.source;
        loadedSource = message.source;
        if (quiverReady && quiverMacros) {
          quiverSource = currentSource;
          quiver.contentWindow.postMessage({
            type: 'zettlr-quiver:source', sessionId: quiverSession,
            source: currentSource, macros: quiverMacros.macros
          }, '*');
        }
        status.textContent = 'Unsaved';
        scheduleRender();
      } else if (message.event === 'error') {
        diagnostics.textContent = message.message;
      }
    });
    document.querySelector('#visual').addEventListener('click', () => {
      canvas.style.display = '';
      quiver.style.display = 'none';
    });
    document.querySelector('#diagram').addEventListener('click', async () => {
      if (!/\\begin\{tikzcd\}/.test(currentSource)) {
        status.textContent = 'Quiver requires a tikzcd diagram';
        return;
      }
      try {
        if (!quiverMacros) quiverMacros = await host.quiverMacros();
        canvas.style.display = 'none';
        quiver.style.display = 'block';
        if (!quiverLoaded) sendQuiverLoad();
      } catch (error) {
        diagnostics.textContent = String(error);
        status.textContent = 'Quiver failed';
      }
    });
    document.querySelector('#save').addEventListener('click', async () => {
      try {
        documentRevision = await host.save(currentSource, documentRevision);
        status.textContent = 'Saved';
      } catch (error) {
        status.textContent = String(error);
      }
    });
    window.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 's') {
        event.preventDefault();
        document.querySelector('#save').click();
      }
    });
    try {
      const documentState = await host.load();
      documentRevision = documentState.revision;
      currentSource = documentState.source;
      loadCanvas();
      scheduleRender();
    } catch (error) {
      diagnostics.textContent = String(error);
      status.textContent = 'Load failed';
    }
  </script>
</body>
</html>
