        - linkedAt
      properties:
        actionId:
          type: string
        packetId:
          type: string
        reviewId:
          type: string
        linkedAt:
          type: string
        terminalOutcome:
          type: string
          enum:
            - accepted
            - rejected
            - mixed
            - withdrawn
            - cleared
    AnnotationResponse:
      type: object
      additionalProperties: false
      description: >-
        A comment thread attached to part of a document. Only the document
        owner can create, resolve, reopen, reattach, or delete annotations;
        agents may only reply to an open thread.
      required:
        - annotationId
        - documentId
        - target
        - state
        - messages
        - proposalActions
        - annotationGeneration
        - createdAt
        - updatedAt
      properties:
        annotationId:
          type: string
        documentId:
          type: string
        target:
          $ref: '#/components/schemas/AnnotationTarget'
        state:
          type: string
          enum:
            - open
            - resolved
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AnnotationMessage'
          description: The thread, owner-first, in creation order.
        proposalActions:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationProposalAction'
        annotationGeneration:
          type: integer
          description: >-
            Annotation version returned by this read. Send it back as
            expectedAnnotationGeneration on the next message.
        createdAt:
          type: string
        updatedAt:
          type: string
        resolvedAt:
          type: string
    AnnotationListResponse:
      type: object
      additionalProperties: false
      required:
