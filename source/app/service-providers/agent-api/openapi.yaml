openapi: 3.1.0
info:
  title: Zettlr-Pandoc Editor Agent API
  version: 1.0.0
  description: >-
    HTTP REST API for the Zettlr-Pandoc editor agent. Provides live document
    reads, proposal submission, review inspection, and Server-Sent Events. The
    Electron main process owns all agent-visible state.


    The working loop: orient (workspace files -> documents -> reviews ->
    chunks), submit claim-sized proposals against a freshly read content
    hash, then next turn read the review's chunk comments and comments and
    answer them with new claims. Accepted material is already in the working
    text — never resubmit it. A PATCH_NOT_APPLICABLE refusal means the text
    moved under you: re-read
    the working side and rebuild against it, because a retry fails the same
    way.


    You never accept, reject, or discard a chunk: the reviewer disposes
    of your proposals in the editor. Your moves are a revision, a comment,
    and retracting a packet of your own the reviewer has not touched yet.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://127.0.0.1:27412
    description: Default loopback endpoint
components:
  schemas:
    DocumentRevision:
      type: object
      additionalProperties: false
      required:
        - sha256
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ReviewState:
      type: string
      enum:
        - active
        - resolved-awaiting-save
        - completed
        - cleared
        - invalidated
    ReviewSummary:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: >-
            Suggestions not yet accepted or rejected.
        packetCount:
          type: integer
    ReviewComment:
      type: object
      required:
        - text
        - createdAt
      properties:
        text:
          type: string
        createdAt:
          type: string
    EditorViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
    DocumentSummary:
      type: object
      required:
        - documentId
        - uri
        - path
        - name
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    EditorContext:
      type: object
      properties:
        focusedView:
          $ref: '#/components/schemas/FocusedViewSummary'
        focusedDocument:
          $ref: '#/components/schemas/DocumentSummary'
        openDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
      required:
        - openDocuments
    ReadDocumentResponse:
      type: object
      additionalProperties: false
      required:
        - documentId
        - attached
        - side
        - revision
        - reviewGeneration
        - range
        - content
        - truncated
      properties:
        documentId:
          type: string
        attached:
          type: boolean
          description: Whether the document currently has a live authority buffer.
        side:
          type: string
          enum:
            - working
            - reference
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
          minimum: 0
        range:
          type: object
          required:
            - startLine
            - endLine
            - totalLines
          properties:
            startLine:
              type: integer
            endLine:
              type: integer
            totalLines:
              type: integer
        content:
          type: string
        truncated:
          type: boolean
    ProposalClaim:
      type: object
      description: >-
        One logical decision — the smallest change a reviewer can accept or
        reject on its own. Do not bundle unrelated edits into one claim.
      required:
        - description
        - patch
      properties:
        description:
          type: string
          minLength: 1
          description: >-
            Self-contained prose shown to the reviewer at the chunks this
            claim produced: what is wrong, what the patch changes, and why —
            enough to adjudicate without re-deriving the diagnosis. Each
            claim in a batch must carry a distinct, non-redundant description
            naming the edit-specific defect/location or context, what this
            claim changes there, and why that particular change fixes it.
            Duplicate or near-duplicate descriptions across claims are
            rejected as DUPLICATE_CLAIM_DESCRIPTION. Comparison applies NFKC
            normalization, case-folding, and whitespace removal, then uses
            normalized Levenshtein similarity; 0.94 or greater is rejected
            and an exact match reports 1.0.
        patch:
          type: string
          minLength: 1
          description: >-
            Unified diff implementing exactly this claim. Name the target in
            the ---/+++ headers as the literal `document` or as the
            document's absolute path (a git-style a/ or b/ prefix is
            allowed); any other filename, a create/delete/rename/binary/mode
            patch, or a diff that leaves the text unchanged is PATCH_INVALID.
        addressesAnnotationIds:
          type: array
          items:
            type: string
          description: >-
            Annotation ids this claim answers. Each must belong to the target
            document, be open, and not be orphaned; otherwise the whole
            submission is refused — ANNOTATION_NOT_FOUND, ANNOTATION_RESOLVED,
            or ANNOTATION_ORPHANED — with nothing committed, not this claim's
            patch and not any other claim in the same submission. On success,
            each addressed annotation records this claim's packet as a linked
            proposal action, visible on GET /v1/annotations/{annotationId}.
    SubmitProposalRequest:
      type: object
      additionalProperties: false
      required:
        - baselineSha256
        - expectedReviewGeneration
        - clientRequestId
        - claims
      properties:
        baselineSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 returned by the most recent working-content read. It pins
            the exact text the patches must apply to; a stale hash is refused
            as REVISION_MISMATCH.
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            Zero when no review exists; otherwise the generation returned by
            the most recent review or chunk read.
        clientRequestId:
          type: string
          minLength: 1
          description: >-
            Client-chosen unique string. Replaying it returns the original
            packet rather than applying the patch twice; reusing it for a
            different request is refused as IDEMPOTENCY_CONFLICT.
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProposalClaim'
          description: >-
            Ordered claim sequence applied against the ONE baseline,
            sequentially and atomically: claim k applies with zero fuzz to
            the text claim k-1 produced, all-or-nothing, and each claim
            becomes its own packet. Send one entry per logical decision —
            that gives the reviewer separately decidable packets. Descriptions
            are per-edit review justifications, not a reusable batch reason;
            each must identify that claim's specific defect/context, change,
            and justification.
    SubmitProposalResponse:
      type: object
      required:
        - packetId
        - packetIds
        - reviewId
        - documentId
        - documentRevision
        - reviewGeneration
        - unresolvedChunks
        - state
      properties:
        packetId:
          type: string
          description: >-
            The newest packet of this submission (the retractable one) —
            the last element of packetIds.
        packetIds:
          type: array
          items:
            type: string
          description: >-
            One packet per claim, in claim order; a single-patch submission
            has exactly one.
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
    AgentError:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - APP_NOT_RUNNING
            - PROTOCOL_MISMATCH
            - NO_FOCUSED_DOCUMENT
            - DOCUMENT_NOT_FOUND
            - DOCUMENT_CLOSED
            - REVISION_MISMATCH
            - REVIEW_GENERATION_MISMATCH
            - REVIEW_NOT_FOUND
            - REVIEW_INVALIDATED
            - PATCH_INVALID
            - PATCH_NOT_APPLICABLE
            - PACKET_NOT_RETRACTABLE
            - CHUNK_NOT_FOUND
            - ANNOTATION_NOT_FOUND
            - ANNOTATION_GENERATION_MISMATCH
            - ANNOTATION_RESOLVED
            - ANNOTATION_ORPHANED
            - ANNOTATION_OWNER_ONLY
            - IDEMPOTENCY_CONFLICT
            - REQUEST_TOO_LARGE
            - REQUEST_BODY_TIMEOUT
            - SEARCH_TIMEOUT
            - METHOD_NOT_FOUND
            - INVALID_PARAMS
            - PERSISTENCE_FAILED
            - INTERNAL_ERROR
            - CITATION_DATABASE_NOT_LOADED
            - CITATION_NOT_FOUND
            - FIGURE_NOT_FOUND
            - FIGURE_ALREADY_EXISTS
            - DUPLICATE_CLAIM_DESCRIPTION
            - BASELINE_MISMATCH
        message:
          type: string
        documentId:
          type: string
        expected:
          $ref: '#/components/schemas/DocumentRevision'
        actual:
          $ref: '#/components/schemas/DocumentRevision'
        reviewId:
          type: string
        reviewGeneration:
          type: integer
          description: >-
            REVIEW_GENERATION_MISMATCH: the generation the review is actually
            at, so the caller can re-read from exactly there.
        conflictingClaimIndices:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 0
          description: >-
            DUPLICATE_CLAIM_DESCRIPTION: zero-based indices of the first pair
            of claims whose normalized descriptions are too similar.
        descriptionSimilarity:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            DUPLICATE_CLAIM_DESCRIPTION: normalized Levenshtein similarity of
            the conflicting pair, where an exact match is 1.0.
    AgentErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/AgentError'
    AgentEvent:
      type: object
      required:
        - event
        - timestamp
      properties:
        event:
          type: string
          enum:
            - review.started
            - review.changed
            - review.resolved
            - review.commented
            - review.cleared
            - review.invalidated
            - review.completed
            - review.discarded
            - review.sidecar-error
            - proposal.applied
            - proposal.retracted
            - annotation.created
            - annotation.message-added
            - annotation.target-changed
            - annotation.orphaned
            - annotation.resolved
            - annotation.reopened
            - annotation.deleted
            - annotation.proposal-linked
        timestamp:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        annotationId:
          type: string
          description: >-
            annotation.*: the annotation the event is about.
        annotationGeneration:
          type: integer
          description: >-
            annotation.*: the document's annotation generation after the event.
        packetId:
          type: string
          description: >-
            proposal.applied and proposal.retracted: the packet affected by the event.
        chunkId:
          type: string
          description: >-
            review.commented: the outstanding chunk the comment is anchored
            to, when it is chunk-anchored.
        comment:
          type: string
          description: >-
            review.commented: the comment text. Absent on a chunk-anchored
            event when the reviewer removed the chunk's note.
        message:
          type: string
          description: 'review.sidecar-error: what failed and why.'
        id:
          type: string
          description: Server-generated event sequence identifier.
    ReviewEventsResponse:
      type: object
      required:
        - reviewId
      properties:
        reviewId:
          type: string
        status:
          $ref: '#/components/schemas/ReviewSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEvent'
        timedOut:
          type: boolean
          description: True if the request reached its timeout before a status change.
    FocusedViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - documentId
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
    ViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
        documents:
          type: array
          items:
            type: object
            required:
              - path
            properties:
              documentId:
                type: string
              path:
                type: string
    ViewsResponse:
      type: object
      required:
        - views
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewSummary'
    WorkspaceSummary:
      type: object
      required:
        - workspaceId
        - path
      properties:
        workspaceId:
          type: string
        path:
          type: string
    WorkspacesResponse:
      type: object
      required:
        - workspaces
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    LoadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - true
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    UnloadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - false
      additionalProperties: false
    WorkspaceDocumentSummary:
      oneOf:
        - $ref: '#/components/schemas/LoadedWorkspaceDocumentSummary'
        - $ref: '#/components/schemas/UnloadedWorkspaceDocumentSummary'
    FocusDocumentResponse:
      type: object
      required:
        - focused
        - documentId
      properties:
        focused:
          type: boolean
          const: true
        documentId:
          type: string
    WorkspaceDocumentsResponse:
      type: object
      required:
        - workspaceId
        - documents
      properties:
        workspaceId:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDocumentSummary'
    WorkspaceFileEntry:
      type: object
      required:
        - documentId
        - path
        - name
        - workspaceId
        - open
      properties:
        documentId:
          type: string
        path:
          type: string
        name:
          type: string
        workspaceId:
          type: string
        open:
          type: boolean
          description: Whether the file is currently loaded in the editor.
    WorkspaceFilesResponse:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFileEntry'
    SearchDocumentResponse:
      type: object
      required:
        - documentId
        - revision
        - hits
        - truncated
      properties:
        documentId:
          type: string
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        hits:
          type: array
          maxItems: 1000
          description: >-
            Search hits in document order. At most 1000 hits are returned; a
            true truncated field means more matching hits were present.
          items:
            type: object
            required:
              - line
              - column
              - length
              - contextBefore
              - contextAfter
            properties:
              line:
                type: integer
              column:
                type: integer
              length:
                type: integer
              contextBefore:
                type: string
              contextAfter:
                type: string
        truncated:
          type: boolean
    ReviewDetailResponse:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
        - comments
        - attached
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: >-
            Suggestions not yet accepted or rejected.
        packetCount:
          type: integer
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ReviewComment'
          description: >-
            Review-level comments in creation order.
        attached:
          type: boolean
          description: >-
            True while the reviewed document is open. A detached review is
            served from its sidecar: readable, but not decidable until its
            documentPath is opened again.
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
          description: >-
            The open document's revision. Absent for a detached review —
            there is no open document to revise.
    ReviewDiffResponse:
      type: object
      required:
        - reviewId
        - patch
        - generation
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent for a detached review, whose file is closed.
        patch:
          type: string
        generation:
          type: integer
    ReviewChunksResponse:
      type: object
      required:
        - reviewId
        - generation
        - chunks
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent for a detached review, whose file is closed.
        generation:
          type: integer
        workingSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 of the working text that contains these suggestions —
            the `expectedWorkingSha256` a retraction of one of the packets
            behind them must carry. Absent for a detached review, which has
            no live buffer and accepts no mutation until its file is
            reopened.
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingChunk'
    ReviewPacketsResponse:
      type: object
      required:
        - reviewId
        - packets
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent for a detached review, whose file is closed.
        packets:
          type: array
          items:
            $ref: '#/components/schemas/ProposalPacket'
    RetractProposalResponse:
      type: object
      required:
        - retracted
        - packetId
        - reviewId
        - documentId
        - reviewGeneration
        - unresolvedChunks
        - documentRevision
      properties:
        retracted:
          type: boolean
          const: true
        packetId:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    OutstandingChunk:
      type: object
      required:
        - chunkId
        - referenceText
        - workingText
        - workingSpans
        - packetIds
        - descriptions
        - patch
      properties:
        chunkId:
          type: string
          description: >-
            Stable suggestion identity. Owner edits map its anchors without
            changing this id. Deciding another suggestion does not change it.
        referenceText:
          type: string
          description: The reference-side lines, newline-joined; empty for a pure insertion.
        workingText:
          type: string
          description: The working-side lines, newline-joined; empty for a pure deletion.
        workingSpans:
          type: array
          description: >-
            Disjoint half-open character ranges containing only agent-authored
            bytes. Owner text inserted inside a suggestion is not included.
          items:
            type: object
            required:
              - from
              - to
            properties:
              from:
                type: integer
              to:
                type: integer
        packetIds:
          type: array
          items:
            type: string
          description: >-
            The one packet that owns this suggestion.
        descriptions:
          type: array
          items:
            type: string
          description: >-
            The owning packet's description.
        comment:
          type: string
          description: >-
            The reviewer's note attached to this chunk without deciding it —
            a question or objection. Address it in your next claims batch.
        patch:
          type: string
          description: Focused zero-context unified diff of exactly this chunk.
    ReviewMutationPrecondition:
      type: object
      additionalProperties: false
      required:
        - expectedReviewGeneration
        - expectedWorkingSha256
      properties:
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            The review generation this request was formed against — the
            `generation` of the chunk list, diff, or status you read. Every
            review mutation advances it, including the reviewer's decisions,
            so a request that carries a stale one was formed before somebody
            else's mutation landed and is refused as
            REVIEW_GENERATION_MISMATCH.
        expectedWorkingSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 of the working text this request was formed against —
            `workingSha256` from GET /v1/reviews/{reviewId}/chunks. Binding
            the request to the exact bytes makes an edit between the read and
            the request a REVISION_MISMATCH refusal instead of a retraction
            landing on text the caller never saw.
    AddReviewCommentRequest:
      type: object
      additionalProperties: false
      required:
        - expectedReviewGeneration
        - text
      properties:
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            See ReviewMutationPrecondition. A comment moves no document text,
            so it carries no working hash.
        text:
          type: string
          minLength: 1
    ReviewCommentResponse:
      type: object
      required:
        - reviewId
        - documentId
        - reviewGeneration
        - comment
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        comment:
          $ref: '#/components/schemas/ReviewComment'
    ProposalPacket:
      type: object
      required:
        - packetId
        - reviewId
        - clientRequestId
        - appliedAt
        - patchFormat
        - patch
        - applicationGeneration
      properties:
        packetId:
          type: string
        reviewId:
          type: string
        clientRequestId:
          type: string
        description:
          type: string
        appliedAt:
          type: string
        patchFormat:
          type: string
        patch:
          type: string
        applicationGeneration:
          type: integer
          description: The review generation this packet's application produced.
    HelpResponse:
      type: object
      required:
        - help
      properties:
        help:
          type: string
          description: Verbatim Markdown authoring help documentation.
    PingResponse:
      type: object
      required:
        - protocolVersion
        - instanceId
        - pid
      properties:
        protocolVersion:
          type: string
        instanceId:
          type: string
        pid:
          type: integer
    CapabilitiesResponse:
      type: object
      required:
        - protocolVersion
        - supportedPatchFormats
        - reviewSupport
        - retractionSupport
        - maxRequestSize
        - applicationVersion
        - instanceId
      properties:
        protocolVersion:
          type: string
        supportedPatchFormats:
          type: array
          items:
            type: string
            enum:
              - unified-diff
        reviewSupport:
          type: boolean
          const: true
        retractionSupport:
          type: boolean
          const: true
        maxRequestSize:
          type: integer
        applicationVersion:
          type: string
        instanceId:
          type: string
    DocumentListResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
    ReviewListEntry:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - type: object
          required:
            - documentPath
            - attached
          properties:
            documentId:
              type: string
              description: >-
                Present for a review attached to an open document; absent
                for a detached (sidecar-backed) review whose file is
                closed.
            documentPath:
              type: string
              description: The absolute path of the reviewed file.
            attached:
              type: boolean
              description: >-
                True while the reviewed document is open; false for a
                review persisted in its sidecar after the file closed.
                There is no reattach API — opening the file is the
                reattachment.
    ReviewListResponse:
      type: object
      required:
        - reviews
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewListEntry'
    AnnotationTarget:
      type: object
      additionalProperties: false
      description: >-
        Where an annotation points, reported in UTF-16 code-unit offsets and
        1-based line/column together. orphaned carries neither: I6 says the
        honest answer to lost text is a marker and Reattach, never a guessed
        position.
      required:
        - state
        - quotedText
      properties:
        state:
          type: string
          enum:
            - range
            - point
            - orphaned
        quotedText:
          type: string
          description: The text the annotation was created against. Never rewritten (I1).
        from:
          type: integer
          description: UTF-16 offset where the target starts. Present when state is range.
        to:
          type: integer
          description: UTF-16 offset where the target ends. Present when state is range.
        at:
          type: integer
          description: UTF-16 offset of the collapsed seam. Present when state is point.
        line:
          type: integer
          description: >-
            1-based line of from (range) or at (point). Absent when state is
            orphaned.
        column:
          type: integer
          description: >-
            1-based UTF-16 column of from (range) or at (point). Absent when
            state is orphaned.
        endLine:
          type: integer
          description: 1-based line of to. Present only when state is range.
        endColumn:
          type: integer
          description: 1-based UTF-16 column of to. Present only when state is range.
        reason:
          type: string
          enum:
            - target-deleted
            - external-drift
            - unmapped-document-change
          description: >-
            Present when state is point (always target-deleted) or orphaned
            (external-drift or unmapped-document-change).
    AnnotationMessage:
      type: object
      additionalProperties: false
      required:
        - messageId
        - author
        - text
        - createdAt
      properties:
        messageId:
          type: string
        author:
          type: string
          enum:
            - owner
            - agent
        text:
          type: string
        createdAt:
          type: string
        clientRequestId:
          type: string
          description: Present when author is agent — the id that made posting this message idempotent.
    AnnotationProposalAction:
      type: object
      additionalProperties: false
      required:
        - actionId
        - packetId
        - reviewId
        - linkedAt
      properties:
        actionId:
          type: string
        packetId:
          type: string
        reviewId:
          type: string
        linkedAt:
          type: string
        terminalOutcome:
          type: string
          enum:
            - accepted
            - rejected
            - mixed
            - withdrawn
            - cleared
    AnnotationResponse:
      type: object
      additionalProperties: false
      description: >-
        A durable comment on a stretch of one document. Lifecycle (resolve,
        reopen, reattach, delete, create) is owner-only (I3) and has no
        operation in this API — only its thread accepts an agent reply.
      required:
        - annotationId
        - documentId
        - target
        - state
        - messages
        - proposalActions
        - annotationGeneration
        - createdAt
        - updatedAt
      properties:
        annotationId:
          type: string
        documentId:
          type: string
        target:
          $ref: '#/components/schemas/AnnotationTarget'
        state:
          type: string
          enum:
            - open
            - resolved
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AnnotationMessage'
          description: The thread, owner-first, in creation order.
        proposalActions:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationProposalAction'
        annotationGeneration:
          type: integer
          description: >-
            The document's annotation generation this read reflects — send it
            back as expectedAnnotationGeneration on the next message.
        createdAt:
          type: string
        updatedAt:
          type: string
        resolvedAt:
          type: string
    AnnotationListResponse:
      type: object
      additionalProperties: false
      required:
        - annotations
      properties:
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationResponse'
    AddAnnotationMessageRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - clientRequestId
        - expectedAnnotationGeneration
      properties:
        text:
          type: string
          minLength: 1
        clientRequestId:
          type: string
          minLength: 1
          description: >-
            Client-chosen unique string. Replaying it returns the original
            message rather than posting a second one.
        expectedAnnotationGeneration:
          type: integer
          minimum: 0
          description: >-
            The annotationGeneration this request was formed against — the
            most recent AnnotationResponse or AnnotationListResponse read. A
            stale value is refused as ANNOTATION_GENERATION_MISMATCH; a
            replayed clientRequestId is answered before this check runs, so a
            retry against a generation the first post already advanced still
            succeeds.
    AddAnnotationMessageResponse:
      type: object
      additionalProperties: false
      required:
        - annotationId
        - documentId
        - message
        - annotationGeneration
      properties:
        annotationId:
          type: string
        documentId:
          type: string
        message:
          $ref: '#/components/schemas/AnnotationMessage'
        annotationGeneration:
          type: integer
    ReviewSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - document
        - clientRequestId
      properties:
        document:
          type: object
          additionalProperties: false
          required:
            - uri
          properties:
            uri:
              type: string
              pattern: ^(file://|/)
              description: Absolute file path or file URI within a configured workspace.
        baseline:
          type: object
          additionalProperties: false
          required:
            - sha256
          properties:
            sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: SHA-256 of the expected working text. A stale baseline is refused
                as BASELINE_MISMATCH.
        clientRequestId:
          type: string
          minLength: 1
          description: Client-chosen unique request key. Reuse after mutation is refused;
            use a new key for rebased claims.
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProposalClaim'
          description: "Ordered claim sequence applied against the ONE baseline,
            sequentially and atomically: claim k applies with zero fuzz to the text
            claim k-1 produced, all-or-nothing, and each claim becomes its own
            packet. Send one entry per logical decision — that gives the reviewer
            separately decidable packets. Descriptions are per-edit review
            justifications, not a reusable batch reason; each must identify that
            claim's specific defect/context, change, and justification."
        patch:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        focus:
          type: boolean
          default: true
      oneOf:
        - type: object
          required:
            - claims
          properties:
            claims:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ProposalClaim'
              description: "Ordered claim sequence applied against the ONE baseline,
                sequentially and atomically: claim k applies with zero fuzz to the
                text claim k-1 produced, all-or-nothing, and each claim becomes its
                own packet. Send one entry per logical decision — that gives the
                reviewer separately decidable packets. Descriptions are per-edit
                review justifications, not a reusable batch reason; each must identify
                that claim's specific defect/context, change, and justification."
        - type: object
          required:
            - patch
            - description
          properties:
            patch:
              type: string
              minLength: 1
            description:
              type: string
              minLength: 1
    ReviewSubmissionResponse:
      type: object
      required:
        - packetId
        - packetIds
        - reviewId
        - documentId
        - documentRevision
        - reviewGeneration
        - unresolvedChunks
        - state
        - focused
      properties:
        packetId:
          type: string
          description: The newest packet of this submission (the retractable one) — the
            last element of packetIds.
        packetIds:
          type: array
          items:
            type: string
          description: One packet per claim, in claim order; a single-patch submission has
            exactly one.
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
        focused:
          type: boolean
    CitationDatabaseSummary:
      type: object
      required:
        - path
        - type
      additionalProperties: false
      properties:
        path:
          type: string
        type:
          type: string
          enum:
            - csl
            - bibtex
            - biblatex
    CitationItem:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
        type:
          type: string
      additionalProperties: true
    CiteItemInput:
      type: object
      required:
        - id
      additionalProperties: false
      properties:
        id:
          type: string
          description: The citation key.
        locator:
          type: string
        label:
          type: string
        prefix:
          type: string
        suffix:
          type: string
    RenderCitationRequest:
      type: object
      required:
        - citations
      additionalProperties: false
      properties:
        database:
          type: string
          default: main
          description: >-
            Database identifier. Use "main" for the globally configured
            library.
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CiteItemInput'
        composite:
          type: boolean
          default: false
    RenderBibliographyRequest:
      type: object
      required:
        - citekeys
      additionalProperties: false
      properties:
        database:
          type: string
          default: main
        citekeys:
          type: array
          items:
            type: string
    CitationDatabasesResponse:
      type: object
      required:
        - databases
      additionalProperties: false
      properties:
        databases:
          type: array
          items:
            $ref: '#/components/schemas/CitationDatabaseSummary'
    CitationItemsResponse:
      type: object
      required:
        - items
        - count
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CitationItem'
        count:
          type: integer
    RenderCitationResponse:
      type: object
      required:
        - rendered
      additionalProperties: false
      properties:
        rendered:
          type:
            - string
            - 'null'
          description: >-
            The formatted citation string, or null when the engine could not
            render the requested items.
    RenderBibliographyResponse:
      type: object
      required:
        - entries
      additionalProperties: false
      properties:
        options:
          type: object
          properties: {}
          additionalProperties: true
          description: CSL bibliography formatting options.
        entries:
          type: array
          items:
            type: string
          description: Each entry is an HTML string for one bibliography item.
    MacroMathJaxDefinition:
      type: object
      additionalProperties: false
      required:
        - replacement
        - argumentCount
      properties:
        replacement:
          type: string
        argumentCount:
          type: integer
          minimum: 0
        optionalDefault:
          type: string
    MacroDeclaration:
      type: object
      additionalProperties: false
      required:
        - sourcePath
        - line
        - declaration
        - context
      properties:
        sourcePath:
          type: string
          description: Path relative to the canonical ~/.pandoc/styles/macros tree.
        line:
          type: integer
          minimum: 1
        declaration:
          type: string
          description: The physical source line containing the declaration.
        context:
          type: string
          description: A bounded source excerpt around the declaration.
    MacroEntry:
      type: object
      additionalProperties: false
      required:
        - name
        - declarations
      properties:
        name:
          type: string
          description: TeX control word including its leading backslash.
        declarations:
          type: array
          items:
            $ref: '#/components/schemas/MacroDeclaration'
        mathjax:
          $ref: '#/components/schemas/MacroMathJaxDefinition'
    MacroInventoryResponse:
      type: object
      additionalProperties: false
      required:
        - root
        - count
        - macros
      properties:
        root:
          type: string
          description: Absolute canonical macro-tree root.
        count:
          type: integer
          minimum: 0
        macros:
          type: array
          items:
            $ref: '#/components/schemas/MacroEntry'
    FigureEntry:
      type: object
      additionalProperties: false
      required:
        - path
        - kind
        - size
        - modifiedAt
      properties:
        path:
          type: string
          description: Path relative to the configured centralized figures directory.
        kind:
          type: string
          enum:
            - file
            - directory
            - symlink
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
    FigureListResponse:
      type: object
      additionalProperties: false
      required:
        - root
        - count
        - entries
      properties:
        root:
          type: string
          description: Absolute effective centralized figures directory.
        count:
          type: integer
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FigureEntry'
    FigureFileResponse:
      type: object
      additionalProperties: false
      required:
        - path
        - size
        - modifiedAt
        - sha256
        - encoding
        - content
      properties:
        path:
          type: string
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        encoding:
          type: string
          enum:
            - utf8
            - base64
        content:
          type: string
    FigureWriteRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
        encoding:
          type: string
          enum:
            - utf8
            - base64
          default: utf8
    FigureCreateRequest:
      type: object
      additionalProperties: false
      required:
        - path
        - content
      properties:
        path:
          type: string
          minLength: 6
          maxLength: 4096
          pattern: '^.+\.tikz$'
          description: >-
            Relative destination under the configured centralized figures directory.
            The filename must end in the lowercase `.tikz` extension; `.tikzcd` and
            every other extension are refused.
        content:
          type: string
          description: UTF-8 TikZ source written byte-for-byte to the new file.
    FigureSearchHit:
      type: object
      additionalProperties: false
      required:
        - path
        - matchType
        - excerpt
      properties:
        path:
          type: string
        matchType:
          type: string
          enum:
            - path
            - content
        line:
          type: integer
          minimum: 1
        excerpt:
          type: string
    FigureSearchResponse:
      type: object
      additionalProperties: false
      required:
        - root
        - query
        - hits
        - truncated
      properties:
        root:
          type: string
        query:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/FigureSearchHit'
        truncated:
          type: boolean
    LintSeverityCounts:
      type: object
      additionalProperties: false
      required:
        - error
        - warning
        - info
      properties:
        error:
          type: integer
          minimum: 0
        warning:
          type: integer
          minimum: 0
        info:
          type: integer
          minimum: 0
    LintDiagnostic:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - line
        - column
        - endLine
        - endColumn
        - severity
        - message
        - source
      properties:
        from:
          type: integer
          minimum: 0
          description: UTF-16 source offset of the diagnostic start.
        to:
          type: integer
          minimum: 0
          description: UTF-16 source offset immediately after the diagnostic.
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        endColumn:
          type: integer
          minimum: 1
        severity:
          type: string
          enum:
            - error
            - warning
            - info
        message:
          type: string
        source:
          type: string
        rule:
          type: string
    DocumentLintResult:
      type: object
      additionalProperties: false
      required:
        - documentId
        - path
        - name
        - open
        - focused
        - revision
        - diagnostics
        - counts
      properties:
        documentId:
          type: string
        path:
          type: string
        name:
          type: string
        open:
          type: boolean
        focused:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/LintDiagnostic'
        counts:
          $ref: '#/components/schemas/LintSeverityCounts'
    LintResponse:
      type: object
      additionalProperties: false
      required:
        - scope
        - documents
        - documentCount
        - diagnosticCount
        - counts
      properties:
        scope:
          type: string
          enum:
            - focused
            - open
            - document
            - workspace
            - all
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLintResult'
        documentCount:
          type: integer
          minimum: 0
        diagnosticCount:
          type: integer
          minimum: 0
        counts:
          $ref: '#/components/schemas/LintSeverityCounts'
paths:
  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      x-openai-isConsequential: false
      summary: Serve the OpenAPI specification
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /openapi.json:
    get:
      operationId: getOpenApiSpecJson
      x-openai-isConsequential: false
      summary: Serve the OpenAPI specification as JSON
      description: >-
        The identical document, parsed from the YAML per request so the two
        encodings cannot disagree. Offered because schema importers are not
        uniformly willing to read YAML.
      responses:
        '200':
          description: OpenAPI JSON document
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /health:
    get:
      operationId: health
      x-openai-isConsequential: false
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /help:
    get:
      operationId: getHelp
      x-openai-isConsequential: false
      summary: Serve authoring help documentation
      description: Returns authoring documentation from HELP.md in Markdown or JSON format.
      parameters:
        - name: format
          in: query
          required: false
          description: Response format (markdown or json)
          schema:
            type: string
            enum:
              - markdown
              - json
      responses:
        '200':
          description: Authoring help documentation in Markdown or JSON
          content:
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/HelpResponse'
  /v1/help:
    get:
      operationId: getV1Help
      x-openai-isConsequential: false
      summary: Serve authoring help documentation
      description: Returns authoring documentation from HELP.md in Markdown or JSON format.
      parameters:
        - name: format
          in: query
          required: false
          description: Response format (markdown or json)
          schema:
            type: string
            enum:
              - markdown
              - json
      responses:
        '200':
          description: Authoring help documentation in Markdown or JSON
          content:
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/HelpResponse'
  /v1/ping:
    get:
      operationId: ping
      x-openai-isConsequential: false
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      x-openai-isConsequential: false
      summary: Supported features and limits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/context:
    get:
      operationId: getContext
      x-openai-isConsequential: false
      summary: Focused view, focused document, and all open documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorContext'
  /v1/documents:
    get:
      operationId: listDocuments
      x-openai-isConsequential: false
      summary: List open or loaded documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
            default: open
          description: Reserved document-state filter for clients. Only open is currently
            supported.
  /v1/documents/{documentId}:
    get:
      operationId: getDocument
      x-openai-isConsequential: false
      summary: Document metadata and review status
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/focus:
    post:
      operationId: focusDocument
      x-openai-isConsequential: false
      summary: Focus or create an editor view for the document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusDocumentResponse'
        '404':
          description: Document not found or outside configured workspace scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/content:
    get:
      operationId: readDocumentContent
      x-openai-isConsequential: false
      summary: Read working or reference text by line slice
      description: >-
        Answers for every documentId GET /v1/workspace/files returns, whether
        or not the file is open; reading never opens a file or moves the
        user's focus. A closed file answers from its detached review when it
        has one and from disk otherwise. Re-read the working side before each
        new proposal.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum:
              - working
              - reference
            default: working
          description: >-
            working is the text your next patch must match, with every
            accepted change already in it, and the side whose revision hash a
            proposal needs; diff it against what you proposed to detect an
            acceptance the reviewer tweaked. reference is the review baseline,
            identical to working until a review exists.
        - name: startLine
          in: query
          schema:
            type: integer
        - name: endLine
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadDocumentResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/search:
    post:
      operationId: searchDocument
      x-openai-isConsequential: false
      summary: Literal or regex search against the live buffer
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - literal
              properties:
                literal:
                  type: string
                  maxLength: 512
                context:
                  type: integer
                  default: 3
                  minimum: 0
                  maximum: 100
                  description: >-
                    Lines of surrounding text returned on each side of every
                    hit. Every hit carries its own copy, so this multiplies
                    the response by the number of hits and is capped rather
                    than open-ended; a context outside this range is refused
                    with INVALID_PARAMS.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '400':
          description: >-
            Invalid, unparseable, or over-length search pattern, or a context
            outside the declared range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: >-
            Pattern evaluation exceeded the server's time budget
            (SEARCH_TIMEOUT). The budget bounds the whole match, including a
            single catastrophically backtracking execution, so an identical
            retry costs the same wall time and fails again: simplify the
            pattern instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/proposals:
    post:
      operationId: submitProposal
      x-openai-isConsequential: false
      summary: Submit an ordered batch of exact unified-diff claims
      description: >-
        The batch binds to the one baselineSha256 in the body and applies
        all-or-nothing; packetIds maps its packets in claim order.
        Accepted material is already in the working text — do not resubmit
        it. The reviewer may edit a chunk before accepting it, so diff your
        proposal against the final text.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProposalRequest'
      responses:
        '200':
          description: Proposal applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProposalResponse'
        '412':
          description: Stale revision (ETag mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Review generation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '400':
          description: >-
            Invalid or non-applicable patch. PATCH_NOT_APPLICABLE means the
            document drifted from the text you built against: re-read the
            working content and rebuild the patch against it — a blind retry
            fails identically. DUPLICATE_CLAIM_DESCRIPTION means two claim
            descriptions are too similar; rewrite each as a distinct per-edit
            diagnosis, change summary, and justification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: >-
            The document does not exist or is outside the configured workspace
            scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: >-
            The proposal could not be persisted or the server could not
            complete the submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/annotations:
    get:
      operationId: listAnnotations
      x-openai-isConsequential: false
      summary: List annotations across every open document
      description: >-
        Aggregates every currently open document's annotations. Lifecycle —
        resolve, reopen, reattach, delete, create — is owner-only (I3) and has
        no operation here; only a thread's reply is agent-writable.
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - resolved
            default: open
          description: >-
            open (the default) answers with annotations that still have a
            thread to read or reply to; resolved answers with the ones that
            do not.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationListResponse'
  /v1/documents/{documentId}/annotations:
    get:
      operationId: listDocumentAnnotations
      x-openai-isConsequential: false
      summary: List one document's annotations
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum:
              - open
              - resolved
          description: Omitted, both open and resolved annotations are returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationListResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/annotations/{annotationId}:
    get:
      operationId: getAnnotation
      x-openai-isConsequential: false
      summary: Get one annotation's full detail
      parameters:
        - name: annotationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationResponse'
        '404':
          description: Annotation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/annotations/{annotationId}/messages:
    post:
      operationId: addAnnotationMessage
      x-openai-isConsequential: false
      summary: Reply in an annotation's thread
      description: >-
        The only annotation mutation this API exposes (I3): lifecycle moves
        (resolve, reopen, reattach, delete, create) are owner-only and
        inexpressible here. Replaying clientRequestId returns the original
        message instead of posting a duplicate, even against a stale
        expectedAnnotationGeneration.
      parameters:
        - name: annotationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAnnotationMessageRequest'
      responses:
        '200':
          description: Message posted, or the original message from a replayed clientRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAnnotationMessageResponse'
        '404':
          description: Annotation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            ANNOTATION_GENERATION_MISMATCH when expectedAnnotationGeneration
            is stale, or ANNOTATION_RESOLVED when the thread is resolved —
            reopen it first. Neither refusal mutates anything.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '400':
          description: Missing or empty text, or a missing clientRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews:
    get:
      operationId: listReviews
      x-openai-isConsequential: false
      summary: List all reviews, attached and detached
      description: >-
        Reviews attached to open documents, plus detached (sidecar-backed)
        reviews on files that are currently closed. A returning turn starts
        here: this is every review still carrying outstanding state, on files
        nobody has open included. A detached review reattaches by opening its
        documentPath.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
  /v1/reviews/{reviewId}:
    get:
      operationId: getReview
      x-openai-isConsequential: false
      summary: Inspect a review
      description: >-
        Status plus review-level comments — the reviewer's channel back to
        you. Read them and the chunk notes at the start of each turn, and
        address them with new claims. Answers for every reviewId /v1/reviews
        lists: a detached review is served from its sidecar, with
        attached=false and no documentRevision.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/diff:
    get:
      operationId: getReviewDiff
      x-openai-isConsequential: false
      summary: Retrieve the complete unresolved composite diff
      description: >-
        Answers for a detached review too, from the frozen texts in its
        sidecar; that response carries no documentId.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDiffResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/chunks:
    get:
      operationId: getReviewChunks
      x-openai-isConsequential: false
      summary: Inspect current unresolved chunks
      description: >-
        Read this at the start of each turn. A chunk's comment is the
        reviewer's question or objection — answer it with a revised claim
        in your next submission. Every chunk here is undecided: the
        reviewer accepts and rejects them in the editor, and this API
        offers no way to decide them for them.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            The unresolved suggestions. A detached review answers from its
            stored suggestion entities with the same stable ids and no
            documentId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewChunksResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/comments:
    post:
      operationId: addReviewComment
      x-openai-isConsequential: false
      summary: Attach a review-level comment
      description: >-
        Communication without adjudication: the comment lands in the review's
        comment list and advances the generation, so a long-poll on the
        existing generation cursor wakes. Answer a chunk note here when the
        answer is an argument; answer with a new claim when the answer is an
        edit.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReviewCommentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCommentResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '400':
          description: Missing or empty comment text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached: it exists, and
            /v1/reviews lists it, but a comment cannot land while its file is
            closed. Open its documentPath to reattach it.
            Also REVISION_MISMATCH when expectedWorkingSha256 does not
            match the live working text, and REVIEW_GENERATION_MISMATCH
            when expectedReviewGeneration is not the review's current
            generation; the error carries the actual revision and
            generation, and neither refusal mutates anything.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'

  /v1/reviews/{reviewId}/packets:
    get:
      operationId: getReviewPackets
      x-openai-isConsequential: false
      summary: Inspect the proposal-packet ledger
      description: >-
        Answers for a detached review too, from its sidecar's ledger; that
        response carries no documentId.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPacketsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/proposals/{packetId}/retract:
    post:
      operationId: retractProposal
      x-openai-isConsequential: false
      summary: Retract an untouched, most-recent packet
      parameters:
        - name: packetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewMutationPrecondition'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetractProposalResponse'
        '409':
          description: >-
            PACKET_NOT_RETRACTABLE when the packet is live but no longer the
            retractable one: the error carries the owning reviewId, and the
            suggestions stay up for the reviewer to dispose of. A packet the
            reviewer has already adjudicated is never retractable — the
            decision advanced the generation the packet was applied at.
            DOCUMENT_CLOSED when the packet belongs to a detached review (one
            listReviews reports with attached: false): the message names the
            file to open.
            Also REVISION_MISMATCH when expectedWorkingSha256 does not
            match the live working text, and REVIEW_GENERATION_MISMATCH
            when expectedReviewGeneration is not the review's current
            generation; the error carries the actual revision and
            generation, and neither refusal mutates anything.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'

  /v1/reviews/{reviewId}/events:
    get:
      operationId: waitForReviewEvents
      x-openai-isConsequential: false
      summary: Long-poll review events and status after a generation advance
      description: >-
        The "what changed since my last turn" query: pass your last
        response's generation as afterGeneration. It answers at once if the
        review already moved past that generation, otherwise blocks until a
        decision, comment, or packet advances it — or until waitSeconds
        elapses, answering with timedOut true.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: afterGeneration
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: waitSeconds
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
        - name: wait
          in: query
          deprecated: true
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
          description: Deprecated alias for waitSeconds.
      responses:
        '200':
          description: Review state and matching event history (or timed out)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEventsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached, so nothing can advance
            its generation and the wait would never end. Open its
            documentPath to reattach it, then poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/views:
    get:
      operationId: listViews
      x-openai-isConsequential: false
      summary: List active editor views
