openapi: 3.1.0
info:
  title: Zettlr-Pandoc Editor Agent API
  version: 1.0.0
  description: >-
    REST API for reading editor documents, submitting proposed edits, and
    inspecting reviews. Read the current document before submitting a proposal
    and use the returned revision hash. If a patch no longer applies, read the
    document again and rebuild the patch. Accepted edits already appear in the
    working text. The reviewer accepts or rejects changes in the editor; an
    agent may submit new proposals, add comments, or retract its newest
    untouched proposal.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://127.0.0.1:27412
    description: Default loopback endpoint
components:
  schemas:
    DocumentRevision:
      type: object
      additionalProperties: false
      required:
        - sha256
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ReviewState:
      type: string
      enum:
        - active
        - resolved-awaiting-save
        - completed
        - cleared
        - invalidated
    ReviewSummary:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: >-
            Suggestions not yet accepted or rejected.
        packetCount:
          type: integer
    ReviewComment:
      type: object
      required:
        - text
        - createdAt
      properties:
        text:
          type: string
        createdAt:
          type: string
    EditorViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
    DocumentSummary:
      type: object
      required:
        - documentId
        - uri
        - path
        - name
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    EditorContext:
      type: object
      properties:
        focusedView:
          $ref: '#/components/schemas/FocusedViewSummary'
        focusedDocument:
          $ref: '#/components/schemas/DocumentSummary'
        openDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
      required:
        - openDocuments
    ReadDocumentResponse:
      type: object
      additionalProperties: false
      required:
        - documentId
        - attached
        - side
        - revision
        - reviewGeneration
        - range
        - content
        - truncated
      properties:
        documentId:
          type: string
        attached:
          type: boolean
          description: Whether the document is currently open in the editor.
        side:
          type: string
          enum:
            - working
            - reference
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
          minimum: 0
        range:
          type: object
          required:
            - startLine
            - endLine
            - totalLines
          properties:
            startLine:
              type: integer
            endLine:
              type: integer
            totalLines:
              type: integer
        content:
          type: string
        truncated:
          type: boolean
    ProposalClaim:
      type: object
      description: >-
        One independently reviewable edit. Keep unrelated edits in separate claims.
      required:
        - description
        - patch
      properties:
        description:
          type: string
          minLength: 1
          description: >-
            Explain what is wrong, what this edit changes, and why. Each claim
            in one submission needs a distinct description; duplicate or
            near-duplicate descriptions are rejected as
            DUPLICATE_CLAIM_DESCRIPTION.
        patch:
          type: string
          minLength: 1
          description: >-
            Unified diff implementing exactly this claim. Name the target in
            the ---/+++ headers as the literal `document` or as the
            document's absolute path (a git-style a/ or b/ prefix is
            allowed); any other filename, a create/delete/rename/binary/mode
            patch, or a diff that leaves the text unchanged is PATCH_INVALID.
        addressesAnnotationIds:
          type: array
          items:
            type: string
          description: >-
            Open annotation IDs this claim answers. If any ID is missing,
            resolved, or no longer points to text, the submission is rejected.
            Successful proposals appear on the addressed annotations.
    SubmitProposalRequest:
      type: object
      additionalProperties: false
      required:
        - baselineSha256
        - expectedReviewGeneration
        - clientRequestId
        - claims
      properties:
        baselineSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 returned by the most recent working-content read. It pins
            the exact text the patches must apply to; a stale hash is refused
            as REVISION_MISMATCH.
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            Zero when no review exists; otherwise the generation returned by
            the most recent review or chunk read.
        clientRequestId:
          type: string
          minLength: 1
          description: >-
            Client-chosen unique string. Replaying it returns the original
            packet rather than applying the patch twice; reusing it for a
            different request is refused as IDEMPOTENCY_CONFLICT.
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProposalClaim'
          description: >-
            Claims are applied in order against the supplied revision. All
            claims succeed or none are applied. Each claim becomes a separate
            review proposal that the reviewer can decide independently.
    SubmitProposalResponse:
      type: object
      required:
        - packetId
        - packetIds
        - reviewId
        - documentId
        - documentRevision
        - reviewGeneration
        - unresolvedChunks
        - state
      properties:
        packetId:
          type: string
          description: >-
            ID of the newest proposal in this submission; it is the last
            element of packetIds.
        packetIds:
          type: array
          items:
            type: string
          description: >-
            One proposal ID per claim, in claim order.
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
    AgentError:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - APP_NOT_RUNNING
            - PROTOCOL_MISMATCH
            - NO_FOCUSED_DOCUMENT
            - DOCUMENT_NOT_FOUND
            - DOCUMENT_CLOSED
            - REVISION_MISMATCH
            - REVIEW_GENERATION_MISMATCH
            - REVIEW_NOT_FOUND
            - REVIEW_INVALIDATED
            - PATCH_INVALID
            - PATCH_NOT_APPLICABLE
            - PACKET_NOT_RETRACTABLE
            - CHUNK_NOT_FOUND
            - ANNOTATION_NOT_FOUND
            - ANNOTATION_GENERATION_MISMATCH
            - ANNOTATION_RESOLVED
            - ANNOTATION_ORPHANED
            - ANNOTATION_OWNER_ONLY
            - IDEMPOTENCY_CONFLICT
            - REQUEST_TOO_LARGE
            - REQUEST_BODY_TIMEOUT
            - SEARCH_TIMEOUT
            - METHOD_NOT_FOUND
            - INVALID_PARAMS
            - PERSISTENCE_FAILED
            - INTERNAL_ERROR
            - CITATION_DATABASE_NOT_LOADED
            - CITATION_NOT_FOUND
            - FIGURE_NOT_FOUND
            - FIGURE_ALREADY_EXISTS
            - DUPLICATE_CLAIM_DESCRIPTION
            - BASELINE_MISMATCH
        message:
          type: string
        documentId:
          type: string
        expected:
          $ref: '#/components/schemas/DocumentRevision'
        actual:
          $ref: '#/components/schemas/DocumentRevision'
        reviewId:
          type: string
        reviewGeneration:
          type: integer
          description: >-
            REVIEW_GENERATION_MISMATCH: the generation the review is actually
            at, so the caller can re-read from exactly there.
        conflictingClaimIndices:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 0
          description: >-
            DUPLICATE_CLAIM_DESCRIPTION: zero-based indices of the first pair
            of claims whose normalized descriptions are too similar.
        descriptionSimilarity:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            DUPLICATE_CLAIM_DESCRIPTION: normalized Levenshtein similarity of
            the conflicting pair, where an exact match is 1.0.
    AgentErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/AgentError'
    AgentEvent:
      type: object
      required:
        - event
        - timestamp
      properties:
        event:
          type: string
          enum:
            - review.started
            - review.changed
            - review.resolved
            - review.commented
            - review.cleared
            - review.invalidated
            - review.completed
            - review.discarded
            - review.sidecar-error
            - proposal.applied
            - proposal.retracted
            - annotation.created
            - annotation.message-added
            - annotation.target-changed
            - annotation.orphaned
            - annotation.resolved
            - annotation.reopened
            - annotation.deleted
            - annotation.proposal-linked
        timestamp:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        annotationId:
          type: string
          description: >-
            annotation.*: the annotation the event is about.
        annotationGeneration:
          type: integer
          description: >-
            annotation.*: annotation version after the event.
        packetId:
          type: string
          description: >-
            proposal.applied and proposal.retracted: proposal ID affected by the event.
        chunkId:
          type: string
          description: >-
            review.commented: the outstanding chunk the comment is anchored
            to, when it is chunk-anchored.
        comment:
          type: string
          description: >-
            review.commented: the comment text. Absent on a chunk-anchored
            event when the reviewer removed the chunk's note.
        message:
          type: string
          description: Error detail for review.sidecar-error events.
        id:
          type: string
          description: Server-generated event sequence identifier.
    ReviewEventsResponse:
      type: object
      required:
        - reviewId
      properties:
        reviewId:
          type: string
        status:
          $ref: '#/components/schemas/ReviewSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEvent'
        timedOut:
          type: boolean
          description: True if the request reached its timeout before a status change.
    FocusedViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - documentId
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
    ViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
        documents:
          type: array
          items:
            type: object
            required:
              - path
            properties:
              documentId:
                type: string
              path:
                type: string
    ViewsResponse:
      type: object
      required:
        - views
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewSummary'
    WorkspaceSummary:
      type: object
      required:
        - workspaceId
        - path
      properties:
        workspaceId:
          type: string
        path:
          type: string
    WorkspacesResponse:
      type: object
      required:
        - workspaces
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    LoadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - true
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    UnloadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - false
      additionalProperties: false
    WorkspaceDocumentSummary:
      oneOf:
        - $ref: '#/components/schemas/LoadedWorkspaceDocumentSummary'
        - $ref: '#/components/schemas/UnloadedWorkspaceDocumentSummary'
    FocusDocumentResponse:
      type: object
      required:
        - focused
        - documentId
      properties:
        focused:
          type: boolean
          const: true
        documentId:
          type: string
    WorkspaceDocumentsResponse:
      type: object
      required:
        - workspaceId
        - documents
      properties:
        workspaceId:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDocumentSummary'
    WorkspaceFileEntry:
      type: object
      required:
        - documentId
        - path
        - name
        - workspaceId
        - open
      properties:
        documentId:
          type: string
        path:
          type: string
        name:
          type: string
        workspaceId:
          type: string
        open:
          type: boolean
          description: Whether the file is currently loaded in the editor.
    WorkspaceFilesResponse:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFileEntry'
    SearchDocumentResponse:
      type: object
      required:
        - documentId
        - revision
        - hits
        - truncated
      properties:
        documentId:
          type: string
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        hits:
          type: array
          maxItems: 1000
          description: >-
            Search hits in document order. At most 1000 hits are returned; a
            true truncated field means more matching hits were present.
          items:
            type: object
            required:
              - line
              - column
              - length
              - contextBefore
              - contextAfter
            properties:
              line:
                type: integer
              column:
                type: integer
              length:
                type: integer
              contextBefore:
                type: string
              contextAfter:
                type: string
        truncated:
          type: boolean
    ReviewDetailResponse:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
        - comments
        - attached
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: >-
            Suggestions not yet accepted or rejected.
        packetCount:
          type: integer
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ReviewComment'
          description: >-
            Review-level comments in creation order.
        attached:
          type: boolean
          description: >-
            True while the reviewed document is open. Reviews for closed files
            remain readable but cannot be changed until the file is reopened.
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
          description: >-
            Current document revision. Absent while the reviewed file is closed.
    ReviewDiffResponse:
      type: object
      required:
        - reviewId
        - patch
        - generation
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent while the reviewed file is closed.
        patch:
          type: string
        generation:
          type: integer
    ReviewChunksResponse:
      type: object
      required:
        - reviewId
        - generation
        - chunks
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent while the reviewed file is closed.
        generation:
          type: integer
        workingSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 of the current text containing these changes. Use it as
            expectedWorkingSha256 when retracting a related proposal. Absent
            while the reviewed file is closed.
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingChunk'
    ReviewPacketsResponse:
      type: object
      required:
        - reviewId
        - packets
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent while the reviewed file is closed.
        packets:
          type: array
          items:
            $ref: '#/components/schemas/ProposalPacket'
    RetractProposalResponse:
      type: object
      required:
        - retracted
        - packetId
        - reviewId
        - documentId
        - reviewGeneration
        - unresolvedChunks
        - documentRevision
      properties:
        retracted:
          type: boolean
          const: true
        packetId:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    OutstandingChunk:
      type: object
      required:
        - chunkId
        - referenceText
        - workingText
        - workingSpans
        - packetIds
        - descriptions
        - patch
      properties:
        chunkId:
          type: string
          description: >-
            Stable ID for this proposed change.
        referenceText:
          type: string
          description: Original text; empty for a pure insertion.
        workingText:
          type: string
          description: Proposed text; empty for a pure deletion.
        workingSpans:
          type: array
          description: >-
            Character ranges belonging to this proposed change. Text added by
            the document owner is excluded.
          items:
            type: object
            required:
              - from
              - to
            properties:
              from:
                type: integer
              to:
                type: integer
        packetIds:
          type: array
          items:
            type: string
          description: >-
            Proposal ID associated with this change.
        descriptions:
          type: array
          items:
            type: string
          description: >-
            Description of the associated proposal.
        comment:
          type: string
          description: >-
            Reviewer's note on this change. Address it in a later proposal.
        patch:
          type: string
          description: Focused zero-context unified diff of exactly this chunk.
    ReviewMutationPrecondition:
      type: object
      additionalProperties: false
      required:
        - expectedReviewGeneration
        - expectedWorkingSha256
      properties:
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            generation from the latest review read. A stale value is rejected
            as REVIEW_GENERATION_MISMATCH.
        expectedWorkingSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            workingSha256 from the latest chunk read. A stale hash is rejected
            as REVISION_MISMATCH.
    AddReviewCommentRequest:
      type: object
      additionalProperties: false
      required:
        - expectedReviewGeneration
        - text
      properties:
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            See ReviewMutationPrecondition. A comment moves no document text,
            so it carries no working hash.
        text:
          type: string
          minLength: 1
    ReviewCommentResponse:
      type: object
      required:
        - reviewId
        - documentId
        - reviewGeneration
        - comment
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        comment:
          $ref: '#/components/schemas/ReviewComment'
    ProposalPacket:
      type: object
      required:
        - packetId
        - reviewId
        - clientRequestId
        - appliedAt
        - patchFormat
        - patch
        - applicationGeneration
      properties:
        packetId:
          type: string
        reviewId:
          type: string
        clientRequestId:
          type: string
        description:
          type: string
        appliedAt:
          type: string
        patchFormat:
          type: string
        patch:
          type: string
        applicationGeneration:
          type: integer
          description: Review generation after this proposal was applied.
    HelpResponse:
      type: object
      required:
        - help
      properties:
        help:
          type: string
          description: Markdown authoring help.
    PingResponse:
      type: object
      required:
        - protocolVersion
        - instanceId
        - pid
      properties:
        protocolVersion:
          type: string
        instanceId:
          type: string
        pid:
          type: integer
    CapabilitiesResponse:
      type: object
      required:
        - protocolVersion
        - supportedPatchFormats
        - reviewSupport
        - retractionSupport
        - maxRequestSize
        - applicationVersion
        - instanceId
      properties:
        protocolVersion:
          type: string
        supportedPatchFormats:
          type: array
          items:
            type: string
            enum:
              - unified-diff
        reviewSupport:
          type: boolean
          const: true
        retractionSupport:
          type: boolean
          const: true
        maxRequestSize:
          type: integer
        applicationVersion:
          type: string
        instanceId:
          type: string
    DocumentListResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
    ReviewListEntry:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - type: object
          required:
            - documentPath
            - attached
          properties:
            documentId:
              type: string
              description: >-
                Present while the reviewed file is open; absent while it is closed.
            documentPath:
              type: string
              description: The absolute path of the reviewed file.
            attached:
              type: boolean
              description: >-
                True while the reviewed file is open. Open a closed reviewed
                file before changing its review.
    ReviewListResponse:
      type: object
      required:
        - reviews
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewListEntry'
    AnnotationTarget:
      type: object
      additionalProperties: false
      description: >-
        Where an annotation points, reported in UTF-16 code-unit offsets and
        1-based line/column together. orphaned carries neither: I6 says the
        honest answer to lost text is a marker and Reattach, never a guessed
        position.
      required:
        - state
        - quotedText
      properties:
        state:
          type: string
          enum:
            - range
            - point
            - orphaned
        quotedText:
          type: string
          description: Text selected when the annotation was created.
        from:
          type: integer
          description: UTF-16 offset where the target starts. Present when state is range.
        to:
          type: integer
          description: UTF-16 offset where the target ends. Present when state is range.
        at:
          type: integer
          description: UTF-16 offset of the collapsed seam. Present when state is point.
        line:
          type: integer
          description: >-
            1-based line of from (range) or at (point). Absent when state is
            orphaned.
        column:
          type: integer
          description: >-
            1-based UTF-16 column of from (range) or at (point). Absent when
            state is orphaned.
        endLine:
          type: integer
          description: 1-based line of to. Present only when state is range.
        endColumn:
          type: integer
          description: 1-based UTF-16 column of to. Present only when state is range.
        reason:
          type: string
          enum:
            - target-deleted
            - external-drift
            - unmapped-document-change
          description: >-
            Present when state is point (always target-deleted) or orphaned
            (external-drift or unmapped-document-change).
    AnnotationMessage:
      type: object
      additionalProperties: false
      required:
        - messageId
        - author
        - text
        - createdAt
      properties:
        messageId:
          type: string
        author:
          type: string
          enum:
            - owner
            - agent
        text:
          type: string
        createdAt:
          type: string
        clientRequestId:
          type: string
          description: Client request ID for an agent-authored message, when present.
    AnnotationProposalAction:
      type: object
      additionalProperties: false
      required:
        - actionId
        - packetId
        - reviewId
        - linkedAt
      properties:
        actionId:
          type: string
        packetId:
          type: string
        reviewId:
          type: string
        linkedAt:
          type: string
        terminalOutcome:
          type: string
          enum:
            - accepted
            - rejected
            - mixed
            - withdrawn
            - cleared
    AnnotationResponse:
      type: object
      additionalProperties: false
      description: >-
        A comment thread attached to part of a document. Only the document
        owner can create, resolve, reopen, reattach, or delete annotations;
        agents may only reply to an open thread.
      required:
        - annotationId
        - documentId
        - target
        - state
        - messages
        - proposalActions
        - annotationGeneration
        - createdAt
        - updatedAt
      properties:
        annotationId:
          type: string
        documentId:
          type: string
        target:
          $ref: '#/components/schemas/AnnotationTarget'
        state:
          type: string
          enum:
            - open
            - resolved
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AnnotationMessage'
          description: The thread, owner-first, in creation order.
        proposalActions:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationProposalAction'
        annotationGeneration:
          type: integer
          description: >-
            Annotation version returned by this read. Send it back as
            expectedAnnotationGeneration on the next message.
        createdAt:
          type: string
        updatedAt:
          type: string
        resolvedAt:
          type: string
    AnnotationListResponse:
      type: object
      additionalProperties: false
      required:
        - annotations
      properties:
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationResponse'
    AddAnnotationMessageRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - clientRequestId
        - expectedAnnotationGeneration
      properties:
        text:
          type: string
          minLength: 1
        clientRequestId:
          type: string
          minLength: 1
          description: >-
            Client-chosen request ID. Repeating the same request returns the
            original message instead of posting it twice.
        expectedAnnotationGeneration:
          type: integer
          minimum: 0
          description: >-
            annotationGeneration from the latest annotation read. A stale
            value is rejected as ANNOTATION_GENERATION_MISMATCH.
    AddAnnotationMessageResponse:
      type: object
      additionalProperties: false
      required:
        - annotationId
        - documentId
        - message
        - annotationGeneration
      properties:
        annotationId:
          type: string
        documentId:
          type: string
        message:
          $ref: '#/components/schemas/AnnotationMessage'
        annotationGeneration:
          type: integer
    ReviewSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - document
        - clientRequestId
      properties:
        document:
          type: object
          additionalProperties: false
          required:
            - uri
          properties:
            uri:
              type: string
              pattern: ^(file://|/)
              description: Absolute file path or file URI within a configured workspace.
        baseline:
          type: object
          additionalProperties: false
          required:
            - sha256
          properties:
            sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: SHA-256 of the document text this submission was built against.
        clientRequestId:
          type: string
          minLength: 1
          description: Client-chosen request ID. Use a new ID after rebuilding a submission.
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProposalClaim'
          description: >-
            Ordered edits built against the same document revision. All
            claims succeed or none are applied. Each claim becomes a separate
            review proposal.
        patch:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        focus:
          type: boolean
          default: true
      oneOf:
        - type: object
          required:
            - claims
          properties:
            claims:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ProposalClaim'
              description: >-
                Ordered edits built against the same document revision. All
                claims succeed or none are applied. Each claim becomes a
                separate review proposal.
        - type: object
          required:
            - patch
            - description
          properties:
            patch:
              type: string
              minLength: 1
            description:
              type: string
              minLength: 1
    ReviewSubmissionResponse:
      type: object
      required:
        - packetId
        - packetIds
        - reviewId
        - documentId
        - documentRevision
        - reviewGeneration
        - unresolvedChunks
        - state
        - focused
      properties:
        packetId:
          type: string
          description: ID of the newest proposal in this submission; the last element of packetIds.
        packetIds:
          type: array
          items:
            type: string
          description: One proposal ID per claim, in claim order.
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
        focused:
          type: boolean
    CitationDatabaseSummary:
      type: object
      required:
        - path
        - type
      additionalProperties: false
      properties:
        path:
          type: string
        type:
          type: string
          enum:
            - csl
            - bibtex
            - biblatex
    CitationItem:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
        type:
          type: string
      additionalProperties: true
    CiteItemInput:
      type: object
      required:
        - id
      additionalProperties: false
      properties:
        id:
          type: string
          description: The citation key.
        locator:
          type: string
        label:
          type: string
        prefix:
          type: string
        suffix:
          type: string
    RenderCitationRequest:
      type: object
      required:
        - citations
      additionalProperties: false
      properties:
        database:
          type: string
          default: main
          description: >-
            Database identifier. Use "main" for the globally configured
            library.
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CiteItemInput'
        composite:
          type: boolean
          default: false
    RenderBibliographyRequest:
      type: object
      required:
        - citekeys
      additionalProperties: false
      properties:
        database:
          type: string
          default: main
        citekeys:
          type: array
          items:
            type: string
    RenderCitationsRequest:
      type: object
      required:
        - mode
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - citation
            - bibliography
          default: citation
        database:
          type: string
          default: main
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CiteItemInput'
        composite:
          type: boolean
          default: false
        citekeys:
          type: array
          items:
            type: string
    CitationDatabasesResponse:
      type: object
      required:
        - databases
      additionalProperties: false
      properties:
        databases:
          type: array
          items:
            $ref: '#/components/schemas/CitationDatabaseSummary'
    CitationItemsResponse:
      type: object
      required:
        - items
        - count
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CitationItem'
        count:
          type: integer
    RenderCitationResponse:
      type: object
      required:
        - rendered
      additionalProperties: false
      properties:
        rendered:
          type:
            - string
            - 'null'
          description: >-
            The formatted citation string, or null when the engine could not
            render the requested items.
    RenderBibliographyResponse:
      type: object
      required:
        - entries
      additionalProperties: false
      properties:
        options:
          type: object
          properties: {}
          additionalProperties: true
          description: CSL bibliography formatting options.
        entries:
          type: array
          items:
            type: string
          description: Each entry is an HTML string for one bibliography item.
    MacroMathJaxDefinition:
      type: object
      additionalProperties: false
      required:
        - replacement
        - argumentCount
      properties:
        replacement:
          type: string
        argumentCount:
          type: integer
          minimum: 0
        optionalDefault:
          type: string
    MacroDeclaration:
      type: object
      additionalProperties: false
      required:
        - sourcePath
        - line
        - declaration
        - context
      properties:
        sourcePath:
          type: string
          description: Path relative to ~/.pandoc/styles/macros.
        line:
          type: integer
          minimum: 1
        declaration:
          type: string
          description: The physical source line containing the declaration.
        context:
          type: string
          description: A bounded source excerpt around the declaration.
    MacroEntry:
      type: object
      additionalProperties: false
      required:
        - name
        - declarations
      properties:
        name:
          type: string
          description: TeX control word including its leading backslash.
        declarations:
          type: array
          items:
            $ref: '#/components/schemas/MacroDeclaration'
        mathjax:
          $ref: '#/components/schemas/MacroMathJaxDefinition'
    MacroInventoryResponse:
      type: object
      additionalProperties: false
      required:
        - root
        - count
        - macros
      properties:
        root:
          type: string
          description: Absolute TeX macro directory.
        count:
          type: integer
          minimum: 0
        macros:
          type: array
          items:
            $ref: '#/components/schemas/MacroEntry'
    FigureEntry:
      type: object
      additionalProperties: false
      required:
        - path
        - kind
        - size
        - modifiedAt
      properties:
        path:
          type: string
          description: Path relative to the configured figures directory.
        kind:
          type: string
          enum:
            - file
            - directory
            - symlink
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
    FigureListResponse:
      type: object
      additionalProperties: false
      required:
        - root
        - count
        - entries
      properties:
        root:
          type: string
          description: Absolute figures directory.
        count:
          type: integer
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FigureEntry'
    FigureFileResponse:
      type: object
      additionalProperties: false
      required:
        - path
        - size
        - modifiedAt
        - sha256
        - encoding
        - content
      properties:
        path:
          type: string
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        encoding:
          type: string
          enum:
            - utf8
            - base64
        content:
          type: string
    FigureWriteRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
        encoding:
          type: string
          enum:
            - utf8
            - base64
          default: utf8
    FigureCreateRequest:
      type: object
      additionalProperties: false
      required:
        - path
        - content
      properties:
        path:
          type: string
          minLength: 6
          maxLength: 4096
          pattern: '^.+\.tikz$'
          description: >-
            Relative destination under the configured figures directory.
            The filename must end in the lowercase `.tikz` extension; `.tikzcd` and
            every other extension are refused.
        content:
          type: string
          description: UTF-8 TikZ source written byte-for-byte to the new file.
    FigureSaveRequest:
      type: object
      additionalProperties: false
      required:
        - path
        - content
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Relative destination under the configured figures directory.
        content:
          type: string
          description: File content as UTF-8 or base64.
        action:
          type: string
          enum:
            - create
            - write
          default: create
          description: create fails with 409 if file exists; write replaces existing files.
        encoding:
          type: string
          enum:
            - utf8
            - base64
          default: utf8
    FigureSearchHit:
      type: object
      additionalProperties: false
      required:
        - path
        - matchType
        - excerpt
      properties:
        path:
          type: string
        matchType:
          type: string
          enum:
            - path
            - content
        line:
          type: integer
          minimum: 1
        excerpt:
          type: string
    FigureSearchResponse:
      type: object
      additionalProperties: false
      required:
        - root
        - query
        - hits
        - truncated
      properties:
        root:
          type: string
        query:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/FigureSearchHit'
        truncated:
          type: boolean
    LintSeverityCounts:
      type: object
      additionalProperties: false
      required:
        - error
        - warning
        - info
      properties:
        error:
          type: integer
          minimum: 0
        warning:
          type: integer
          minimum: 0
        info:
          type: integer
          minimum: 0
    LintDiagnostic:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - line
        - column
        - endLine
        - endColumn
        - severity
        - message
        - source
      properties:
        from:
          type: integer
          minimum: 0
          description: UTF-16 source offset of the diagnostic start.
        to:
          type: integer
          minimum: 0
          description: UTF-16 source offset immediately after the diagnostic.
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        endColumn:
          type: integer
          minimum: 1
        severity:
          type: string
          enum:
            - error
            - warning
            - info
        message:
          type: string
        source:
          type: string
        rule:
          type: string
        data:
          type: object
          properties: {}
          additionalProperties: true
          description: Structured rule-specific facts. Human-facing message text is not an API identifier.
    DocumentLintResult:
      type: object
      additionalProperties: false
      required:
        - documentId
        - path
        - name
        - open
        - focused
        - revision
        - diagnostics
        - counts
      properties:
        documentId:
          type: string
        path:
          type: string
        name:
          type: string
        open:
          type: boolean
        focused:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/LintDiagnostic'
        counts:
          $ref: '#/components/schemas/LintSeverityCounts'
    LintResponse:
      type: object
      additionalProperties: false
      required:
        - scope
        - documents
        - documentCount
        - diagnosticCount
        - counts
      properties:
        scope:
          type: string
          enum:
            - focused
            - open
            - document
            - workspace
            - all
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLintResult'
        documentCount:
          type: integer
          minimum: 0
        diagnosticCount:
          type: integer
          minimum: 0
        counts:
          $ref: '#/components/schemas/LintSeverityCounts'
paths:
  /help:
    get:
      operationId: getHelp
      x-openai-isConsequential: false
      summary: Serve authoring help documentation
      description: Returns authoring documentation from HELP.md in Markdown or JSON format.
      parameters:
        - name: format
          in: query
          required: false
          description: Response format (markdown or json)
          schema:
            type: string
            enum:
              - markdown
              - json
      responses:
        '200':
          description: Authoring help documentation in Markdown or JSON
          content:
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/HelpResponse'
  /v1/ping:
    get:
      operationId: ping
      x-openai-isConsequential: false
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      x-openai-isConsequential: false
      summary: Report supported Agent API capabilities and formats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/context:
    get:
      operationId: getContext
      x-openai-isConsequential: false
      summary: High-level overview of active editor views and open documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorContext'
  /v1/views:
    get:
      operationId: listViews
      x-openai-isConsequential: false
      summary: List active editor views
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewsResponse'
  /v1/workspace/files:
    get:
      operationId: listWorkspaceFiles
      x-openai-isConsequential: false
      summary: List every file across the configured workspaces
      description: >-
        The agent's orientation entry point — all files the editor can see,
        flat, open or not. Files here can be read and reviewed immediately.
      responses:
        '200':
          description: All workspace files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFilesResponse'
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      x-openai-isConsequential: false
      summary: List configured workspaces or documents within a workspace
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
          description: Optional workspace ID to inspect documents in that workspace.
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum:
              - summary
              - documents
            default: summary
          description: Whether to return workspace summaries or documents.
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Optional search term when listing workspace documents.
      responses:
        '200':
          description: Workspace listing or document list.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorkspacesResponse'
                  - $ref: '#/components/schemas/WorkspaceDocumentsResponse'
  /v1/documents:
    get:
      operationId: listDocuments
      x-openai-isConsequential: false
      summary: List open or loaded documents
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
            default: open
          description: Reserved document-state filter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
  /v1/documents/{documentId}:
    get:
      operationId: getDocument
      x-openai-isConsequential: false
      summary: Document metadata and optional text content
      description: >-
        Returns document metadata by default. Set includeContent=true to read
        current or pre-review text with an ETag revision header.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: includeContent
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to include the text content lines.
        - name: side
          in: query
          schema:
            type: string
            enum:
              - working
              - reference
            default: working
          description: working is the current text; reference is the text before proposed changes.
        - name: startLine
          in: query
          schema:
            type: integer
        - name: endLine
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DocumentSummary'
                  - $ref: '#/components/schemas/ReadDocumentResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/focus:
    post:
      operationId: focusDocument
      x-openai-isConsequential: false
      summary: Focus or create an editor view for the document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusDocumentResponse'
        '404':
          description: Document not found or outside workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/search:
    post:
      operationId: searchDocument
      x-openai-isConsequential: false
      summary: Literal or regex search against the live buffer
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - literal
              properties:
                literal:
                  type: string
                  maxLength: 512
                context:
                  type: integer
                  default: 3
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '400':
          description: Invalid regex pattern
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '408':
          description: Search timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/proposals:
    post:
      operationId: submitProposal
      x-openai-isConsequential: false
      summary: Submit edits against an open document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProposalRequest'
      responses:
        '200':
          description: Proposal accepted into review
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProposalResponse'
        '400':
          description: Invalid request payload or claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Revision mismatch or document closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '412':
          description: Precondition failed
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: Patch does not apply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/review-submissions:
    post:
      operationId: submitReview
      x-openai-isConsequential: false
      summary: Submit a review by file path
      description: >-
        Resolve a workspace file, verify an optional revision hash, submit
        ordered claims or one patch as an all-or-nothing change, and focus the
        document unless disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSubmissionRequest'
      responses:
        '200':
          description: Review submission applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProposalResponse'
        '400':
          description: Invalid payload or claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: File not found in workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Conflict or mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '412':
          description: Baseline mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: Patch does not apply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/annotations:
    get:
      operationId: listAnnotations
      x-openai-isConsequential: false
      summary: List annotations across the workspace or for one document
      parameters:
        - name: documentId
          in: query
          required: false
          schema:
            type: string
          description: Optional document ID to filter annotations.
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - resolved
      responses:
        '200':
          description: Annotations list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationListResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/annotations/{annotationId}:
    get:
      operationId: getAnnotation
      x-openai-isConsequential: false
      summary: Get a single annotation and its conversation thread
      parameters:
        - name: annotationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The annotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationResponse'
        '404':
          description: Annotation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/annotations/{annotationId}/messages:
    post:
      operationId: addAnnotationMessage
      x-openai-isConsequential: false
      summary: Append a message to an annotation conversation thread
      parameters:
        - name: annotationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAnnotationMessageRequest'
      responses:
        '200':
          description: Appended message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAnnotationMessageResponse'
        '404':
          description: Annotation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Document is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews:
    get:
      operationId: listReviews
      x-openai-isConsequential: false
      summary: List reviews for open and closed workspace files
      responses:
        '200':
          description: Review summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
  /v1/reviews/{reviewId}:
    get:
      operationId: getReview
      x-openai-isConsequential: false
      summary: Inspect review details, its diff, pending changes, or proposals
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum:
              - detail
              - diff
              - chunks
              - packets
            default: detail
          description: Which slice of the review to return.
      responses:
        '200':
          description: Review slice.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReviewDetailResponse'
                  - $ref: '#/components/schemas/ReviewDiffResponse'
                  - $ref: '#/components/schemas/ReviewChunksResponse'
                  - $ref: '#/components/schemas/ReviewPacketsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Document closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/comments:
    post:
      operationId: addReviewComment
      x-openai-isConsequential: false
      summary: Add a comment to a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReviewCommentRequest'
      responses:
        '200':
          description: The review with the comment appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Document closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/proposals/{packetId}/retract:
    post:
      operationId: retractProposal
      x-openai-isConsequential: false
      summary: Retract the newest untouched proposal
      parameters:
        - name: packetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposal retracted
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetractProposalResponse'
        '404':
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Proposal cannot be retracted or document is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/events:
    get:
      operationId: waitForReviewEvents
      x-openai-isConsequential: false
      summary: Wait for review changes after a generation
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: afterGeneration
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: waitSeconds
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
        - name: wait
          in: query
          deprecated: true
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
      responses:
        '200':
          description: Advance events or current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEventsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/citations:
    get:
      operationId: queryCitations
      x-openai-isConsequential: false
      summary: Query citation databases, item lists, or specific items
      parameters:
        - name: target
          in: query
          required: false
          schema:
            type: string
            enum:
              - items
              - databases
            default: items
        - name: database
          in: query
          required: false
          schema:
            type: string
            default: main
          description: Database identifier. Defaults to main.
        - name: citeKey
          in: query
          required: false
          schema:
            type: string
          description: Lookup a specific citation item by key.
      responses:
        '200':
          description: Citation query results.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CitationItemsResponse'
                  - $ref: '#/components/schemas/CitationDatabasesResponse'
                  - $ref: '#/components/schemas/CitationItem'
        '404':
          description: Database or cite key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/citations/render:
    post:
      operationId: renderCitations
      x-openai-isConsequential: false
      summary: Render formatted inline citations or bibliographies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderCitationsRequest'
      responses:
        '200':
          description: Rendered citations or bibliography
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RenderCitationResponse'
                  - $ref: '#/components/schemas/RenderBibliographyResponse'
        '404':
          description: Database not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/macros:
    get:
      operationId: listMacros
      x-openai-isConsequential: false
      summary: Inspect configured mathematical macros
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: Configured macro inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroInventoryResponse'
        '500':
          description: Macro inspection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/figures:
    get:
      operationId: queryFigures
      x-openai-isConsequential: false
      summary: List, search, or read figure files
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - list
              - search
              - read
            default: list
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: Search term when action=search.
        - name: path
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
          description: Relative path when action=read.
      responses:
        '200':
          description: Figure listing, search results, or file contents.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FigureListResponse'
                  - $ref: '#/components/schemas/FigureSearchResponse'
                  - $ref: '#/components/schemas/FigureFileResponse'
        '400':
          description: Invalid path or search parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Figure file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: Figure operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
    post:
      operationId: saveFigure
      x-openai-isConsequential: false
      summary: Create or update a figure file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FigureSaveRequest'
      responses:
        '200':
          description: Figure saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigureFileResponse'
        '201':
          description: Figure created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigureFileResponse'
        '400':
          description: Invalid path or content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Figure already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: Figure persistence failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/lint:
    get:
      operationId: lintDocuments
      x-openai-isConsequential: false
      summary: Lint documents by editor/workspace scope
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - focused
              - open
              - document
              - workspace
              - all
        - name: documentId
          in: query
          schema:
            type: string
        - name: workspaceId
          in: query
          schema:
            type: string
        - name: minimumSeverity
          in: query
          schema:
            type: string
            enum:
              - info
              - warning
              - error
      responses:
        '200':
          description: Lint diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LintResponse'
        '400':
          description: Missing scope parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Document or workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: Lint failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
