    ReviewSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - document
        - clientRequestId
      properties:
        document:
          type: object
          additionalProperties: false
          required:
            - uri
          properties:
            uri:
              type: string
              pattern: ^(file://|/)
              description: Absolute file path or file URI within a configured workspace.
        baseline:
          type: object
          additionalProperties: false
