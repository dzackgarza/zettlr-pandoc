        - text
        - createdAt
      properties:
        messageId:
          type: string
        author:
          type: string
          enum:
            - owner
            - agent
        text:
          type: string
        createdAt:
          type: string
        clientRequestId:
          type: string
          description: Client request ID for an agent-authored message, when present.
    AnnotationProposalAction:
      type: object
      additionalProperties: false
      required:
        - actionId
