                $ref: '#/components/schemas/FigureFileResponse'
        '400':
          description: The relative path is unsafe or does not name a regular file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: The figure file does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
    put:
      operationId: writeFigure
      x-openai-isConsequential: false
      summary: Write a centralized figure file
      description: >-
        Atomically creates or replaces one file under the configured centralized
        figures directory. Missing parent directories are created.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4096
          description: Relative path under the configured centralized figures directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FigureWriteRequest'
      responses:
        '200':
          description: The file after the atomic write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigureFileResponse'
        '400':
          description: The path or encoded content is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: The figure file could not be persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/lint:
    get:
      operationId: lintDocuments
      x-openai-isConsequential: false
      summary: Lint documents by editor/workspace scope
      description: >-
        Runs the document lint stack over authoritative working text. focused checks
        the focused Markdown document; open checks all open Markdown documents;
        document checks one documentId; workspace checks one configured workspace;
        all checks every Markdown document in every configured workspace.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - focused
              - open
              - document
              - workspace
              - all
            default: focused
        - name: documentId
          in: query
          required: false
          schema:
            type: string
          description: Required when scope=document.
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
          description: Required when scope=workspace; this is the workspace path returned by /v1/workspaces.
        - name: minimumSeverity
          in: query
          required: false
          schema:
            type: string
            enum:
              - info
              - warning
              - error
            default: info
          description: Filters returned diagnostics while preserving document selection.
      responses:
        '200':
          description: Lint diagnostics grouped by document with aggregate counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LintResponse'
        '400':
          description: The selected scope is missing its required document or workspace id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: The requested document, workspace, or focused document was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: A selected document could not be linted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
