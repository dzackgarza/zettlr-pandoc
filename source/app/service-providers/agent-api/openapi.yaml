openapi: 3.1.0
info:
  title: Zettlr-Pandoc Editor Agent API
  version: 1.0.0
  description: >-
    HTTP REST API for the Zettlr-Pandoc editor agent. Provides live document
    reads, proposal submission, review inspection, and Server-Sent Events. The
    Electron main process owns all agent-visible state.


    The working loop: orient (workspace files -> documents -> reviews ->
    chunks), submit claim-sized proposals against a freshly read content
    hash, then next turn read the review's held chunks and comments and
    answer them with new claims. Accepted material is already in the working
    text — never resubmit it. A PATCH_NOT_APPLICABLE refusal means the text
    moved under you: re-read
    the working side and rebuild against it, because a retry fails the same
    way.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://127.0.0.1:27412
    description: Default loopback endpoint
components:
  schemas:
    DocumentRevision:
      type: object
      additionalProperties: false
      required:
        - sha256
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ReviewState:
      type: string
      enum:
        - active
        - resolved-awaiting-save
        - completed
        - cleared
        - invalidated
    ReviewSummary:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - heldChunks
        - packetCount
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: >-
            Pending chunks only. Held chunks are excluded — they do not block
            saving.
        heldChunks:
          type: integer
        packetCount:
          type: integer
    ReviewComment:
      type: object
      required:
        - text
        - createdAt
      properties:
        text:
          type: string
        createdAt:
          type: string
        orphanedFromChunkId:
          type: string
          description: >-
            Present when this comment was salvaged from a hold whose chunk id
            vanished from the partition (the held region was edited, decided,
            cleared, or absorbed by a later claim). Hold text is never
            silently lost.
    EditorViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
    DocumentSummary:
      type: object
      required:
        - documentId
        - uri
        - path
        - name
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    EditorContext:
      type: object
      properties:
        focusedView:
          $ref: '#/components/schemas/FocusedViewSummary'
        focusedDocument:
          $ref: '#/components/schemas/DocumentSummary'
        openDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
      required:
        - openDocuments
    ReadDocumentResponse:
      type: object
      additionalProperties: false
      required:
        - documentId
        - attached
        - side
        - revision
        - reviewGeneration
        - range
        - content
        - truncated
      properties:
        documentId:
          type: string
        attached:
          type: boolean
          description: Whether the document currently has a live authority buffer.
        side:
          type: string
          enum:
            - working
            - reference
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
          minimum: 0
        range:
          type: object
          required:
            - startLine
            - endLine
            - totalLines
          properties:
            startLine:
              type: integer
            endLine:
              type: integer
            totalLines:
              type: integer
        content:
          type: string
        truncated:
          type: boolean
    ProposalClaim:
      type: object
      description: >-
        One logical decision — the smallest change a reviewer can accept or
        reject on its own. Do not bundle unrelated edits into one claim.
      required:
        - description
        - patch
      properties:
        description:
          type: string
          minLength: 1
          description: >-
            Self-contained prose shown to the reviewer at the chunks this
            claim produced: what is wrong, what the patch changes, and why —
            enough to adjudicate without re-deriving the diagnosis.
        patch:
          type: string
          minLength: 1
          description: >-
            Unified diff implementing exactly this claim. Name the target in
            the ---/+++ headers as the literal `document` or as the
            document's absolute path (a git-style a/ or b/ prefix is
            allowed); any other filename, a create/delete/rename/binary/mode
            patch, or a diff that leaves the text unchanged is PATCH_INVALID.
    SubmitProposalRequest:
      type: object
      additionalProperties: false
      required:
        - baselineSha256
        - expectedReviewGeneration
        - clientRequestId
        - claims
      properties:
        baselineSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 returned by the most recent working-content read. It pins
            the exact text the patches must apply to; a stale hash is refused
            as REVISION_MISMATCH.
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            Zero when no review exists; otherwise the generation returned by
            the most recent review or chunk read.
        clientRequestId:
          type: string
          minLength: 1
          description: >-
            Client-chosen unique string. Replaying it returns the original
            packet rather than applying the patch twice; reusing it for a
            different request is refused as IDEMPOTENCY_CONFLICT.
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProposalClaim'
          description: >-
            Ordered claim sequence applied against the ONE baseline,
            sequentially and atomically: claim k applies with zero fuzz to
            the text claim k-1 produced, all-or-nothing, and each claim
            becomes its own packet. Send one entry per logical decision —
            that gives the reviewer separately decidable packets.
    SubmitProposalResponse:
      type: object
      required:
        - packetId
        - packetIds
        - reviewId
        - documentId
        - documentRevision
        - reviewGeneration
        - unresolvedChunks
        - state
      properties:
        packetId:
          type: string
          description: >-
            The newest packet of this submission (the retractable one) —
            the last element of packetIds.
        packetIds:
          type: array
          items:
            type: string
          description: >-
            One packet per claim, in claim order; a single-patch submission
            has exactly one.
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
    AgentError:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - APP_NOT_RUNNING
            - PROTOCOL_MISMATCH
            - NO_FOCUSED_DOCUMENT
            - DOCUMENT_NOT_FOUND
            - DOCUMENT_CLOSED
            - REVISION_MISMATCH
            - REVIEW_GENERATION_MISMATCH
            - REVIEW_NOT_FOUND
            - REVIEW_INVALIDATED
            - PATCH_INVALID
            - PATCH_NOT_APPLICABLE
            - PACKET_NOT_RETRACTABLE
            - CHUNK_NOT_FOUND
            - IDEMPOTENCY_CONFLICT
            - REQUEST_TOO_LARGE
            - REQUEST_BODY_TIMEOUT
            - SEARCH_TIMEOUT
            - METHOD_NOT_FOUND
            - INVALID_PARAMS
            - PERSISTENCE_FAILED
            - INTERNAL_ERROR
        message:
          type: string
        documentId:
          type: string
        expected:
          $ref: '#/components/schemas/DocumentRevision'
        actual:
          $ref: '#/components/schemas/DocumentRevision'
        reviewId:
          type: string
        canClearUnresolved:
          type: boolean
    AgentErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/AgentError'
    AgentEvent:
      type: object
      required:
        - event
        - timestamp
      properties:
        event:
          type: string
        timestamp:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        chunkId:
          type: string
          description: 'review.held: the chunk that was held.'
        comment:
          type: string
          description: 'review.held / review.commented: the comment text, when one exists.'
        orphanedFromChunkId:
          type: string
          description: >-
            review.commented: set when the comment was salvaged from a hold
            whose chunk id vanished from the partition.
        message:
          type: string
          description: 'review.sidecar-error: what failed and why.'
        id:
          type: string
          description: Server-generated event sequence identifier.
    ReviewEventsResponse:
      type: object
      required:
        - reviewId
      properties:
        reviewId:
          type: string
        status:
          $ref: '#/components/schemas/ReviewSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEvent'
        timedOut:
          type: boolean
          description: True if the request reached its timeout before a status change.
    FocusedViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - documentId
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
    ViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
        documents:
          type: array
          items:
            type: object
            required:
              - path
            properties:
              documentId:
                type: string
              path:
                type: string
    ViewsResponse:
      type: object
      required:
        - views
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewSummary'
    WorkspaceSummary:
      type: object
      required:
        - workspaceId
        - path
      properties:
        workspaceId:
          type: string
        path:
          type: string
    WorkspacesResponse:
      type: object
      required:
        - workspaces
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    LoadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - true
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    UnloadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - false
      additionalProperties: false
    WorkspaceDocumentSummary:
      oneOf:
        - $ref: '#/components/schemas/LoadedWorkspaceDocumentSummary'
        - $ref: '#/components/schemas/UnloadedWorkspaceDocumentSummary'
    FocusDocumentResponse:
      type: object
      required:
        - focused
        - documentId
      properties:
        focused:
          type: boolean
          const: true
        documentId:
          type: string
    WorkspaceDocumentsResponse:
      type: object
      required:
        - workspaceId
        - documents
      properties:
        workspaceId:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDocumentSummary'
    WorkspaceFileEntry:
      type: object
      required:
        - documentId
        - path
        - name
        - workspaceId
        - open
      properties:
        documentId:
          type: string
        path:
          type: string
        name:
          type: string
        workspaceId:
          type: string
        open:
          type: boolean
          description: Whether the file is currently loaded in the editor.
    WorkspaceFilesResponse:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFileEntry'
    SearchDocumentResponse:
      type: object
      required:
        - documentId
        - revision
        - hits
        - truncated
      properties:
        documentId:
          type: string
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        hits:
          type: array
          maxItems: 1000
          description: >-
            Search hits in document order. At most 1000 hits are returned; a
            true truncated field means more matching hits were present.
          items:
            type: object
            required:
              - line
              - column
              - length
              - contextBefore
              - contextAfter
            properties:
              line:
                type: integer
              column:
                type: integer
              length:
                type: integer
              contextBefore:
                type: string
              contextAfter:
                type: string
        truncated:
          type: boolean
    ReviewDetailResponse:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - heldChunks
        - packetCount
        - comments
        - attached
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: Pending chunks only; held chunks are excluded.
        heldChunks:
          type: integer
        packetCount:
          type: integer
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ReviewComment'
          description: >-
            Review-level comments in creation order — attached directly via
            the comments route, or orphaned from holds whose chunks vanished.
        attached:
          type: boolean
          description: >-
            True while the reviewed document is open. A detached review is
            served from its sidecar: readable, but not decidable until its
            documentPath is opened again.
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
          description: >-
            The open document's revision. Absent for a detached review —
            there is no open document to revise.
    ReviewDiffResponse:
      type: object
      required:
        - reviewId
        - patch
        - generation
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent for a detached review, whose file is closed.
        patch:
          type: string
        generation:
          type: integer
    ReviewChunksResponse:
      type: object
      required:
        - reviewId
        - generation
        - chunks
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent for a detached review, whose file is closed.
        generation:
          type: integer
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingChunk'
    ReviewPacketsResponse:
      type: object
      required:
        - reviewId
        - packets
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent for a detached review, whose file is closed.
        packets:
          type: array
          items:
            $ref: '#/components/schemas/ProposalPacket'
    ClearReviewResponse:
      type: object
      required:
        - reviewId
        - documentId
        - state
        - documentRevision
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    RetractProposalResponse:
      type: object
      required:
        - retracted
        - packetId
        - reviewId
        - documentId
        - reviewGeneration
        - unresolvedChunks
        - documentRevision
      properties:
        retracted:
          type: boolean
          const: true
        packetId:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    OutstandingChunk:
      type: object
      required:
        - chunkId
        - referenceRange
        - workingRange
        - referenceText
        - workingText
        - packetIds
        - descriptions
        - state
        - patch
      properties:
        chunkId:
          type: string
          description: >-
            Content-addressed identity: stable while the chunk's own text is
            untouched, so deciding one chunk does not invalidate the ids of
            the others. A decision against an id whose region has since
            changed fails with CHUNK_NOT_FOUND.
        referenceRange:
          description: >-
            1-based, half-open: the chunk covers lines [fromLine, toLine).
            fromLine equal to toLine marks an empty side (a pure insertion
            has an empty reference range; a pure deletion an empty working
            range). Ranges of distinct chunks never overlap.
          type: object
          required:
            - fromLine
            - toLine
          properties:
            fromLine:
              type: integer
            toLine:
              type: integer
        workingRange:
          type: object
          required:
            - fromLine
            - toLine
          properties:
            fromLine:
              type: integer
            toLine:
              type: integer
        referenceText:
          type: string
          description: The reference-side lines, newline-joined; empty for a pure insertion.
        workingText:
          type: string
          description: The working-side lines, newline-joined; empty for a pure deletion.
        packetIds:
          type: array
          items:
            type: string
          description: >-
            The packets whose edits produced this chunk, in application
            order — every packet whose recorded edit spans still touch the
            chunk's reference range. Overlapping claims attribute together;
            a chunk the user tweaked keeps the attribution of the claim it
            grew from; a chunk only the user's own edits created carries
            none.
        descriptions:
          type: array
          items:
            type: string
          description: >-
            Those packets' descriptions, in the same order, packets without
            one omitted.
        state:
          type: string
          enum:
            - pending
            - held
          description: >-
            The chunk's decision state. Accepted and rejected chunks stop
            being disagreements and leave the partition, so only pending and
            held chunks exist here.
        holdComment:
          type: string
          description: >-
            The hold's comment, when this chunk is held with one — the
            reviewer's question or objection. Address it in your next
            claims batch.
        patch:
          type: string
          description: Focused zero-context unified diff of exactly this chunk.
    ChunkDecisionResponse:
      type: object
      required:
        - ok
        - reviewId
        - documentId
        - chunkId
        - decision
        - reviewGeneration
        - unresolvedChunks
        - state
        - documentRevision
      properties:
        ok:
          type: boolean
          const: true
        reviewId:
          type: string
        documentId:
          type: string
        chunkId:
          type: string
        decision:
          type: string
          enum:
            - accept
            - reject
            - hold
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    AcceptAllChunksResponse:
      type: object
      required:
        - ok
        - reviewId
        - documentId
        - acceptedChunks
        - reviewGeneration
        - unresolvedChunks
        - state
        - documentRevision
      properties:
        ok:
          type: boolean
          const: true
        reviewId:
          type: string
        documentId:
          type: string
        acceptedChunks:
          type: integer
          description: How many chunks the sweep resolved (held ones included).
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    HoldChunkRequest:
      type: object
      properties:
        comment:
          type: string
          minLength: 1
          description: >-
            Optional note attached to the chunk without adjudicating it. A
            hold without text is legal; re-holding a held chunk replaces its
            comment.
    AddReviewCommentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
    ReviewCommentResponse:
      type: object
      required:
        - reviewId
        - documentId
        - reviewGeneration
        - comment
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        comment:
          $ref: '#/components/schemas/ReviewComment'
    ProposalPacket:
      type: object
      required:
        - packetId
        - reviewId
        - clientRequestId
        - appliedAt
        - patchFormat
        - patch
        - applicationGeneration
      properties:
        packetId:
          type: string
        reviewId:
          type: string
        clientRequestId:
          type: string
        description:
          type: string
        appliedAt:
          type: string
        patchFormat:
          type: string
        patch:
          type: string
        applicationGeneration:
          type: integer
          description: The review generation this packet's application produced.
    PingResponse:
      type: object
      required:
        - protocolVersion
        - instanceId
        - pid
      properties:
        protocolVersion:
          type: string
        instanceId:
          type: string
        pid:
          type: integer
    CapabilitiesResponse:
      type: object
      required:
        - protocolVersion
        - supportedPatchFormats
        - reviewSupport
        - retractionSupport
        - maxRequestSize
        - eventStreamSupport
        - eventReplayBufferSize
        - applicationVersion
        - instanceId
      properties:
        protocolVersion:
          type: string
        supportedPatchFormats:
          type: array
          items:
            type: string
            enum:
              - unified-diff
        reviewSupport:
          type: boolean
          const: true
        retractionSupport:
          type: boolean
          const: true
        maxRequestSize:
          type: integer
        eventStreamSupport:
          type: boolean
          const: true
        eventReplayBufferSize:
          type: integer
        applicationVersion:
          type: string
        instanceId:
          type: string
    DocumentListResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
    ReviewListEntry:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - type: object
          required:
            - documentPath
            - attached
          properties:
            documentId:
              type: string
              description: >-
                Present for a review attached to an open document; absent
                for a detached (sidecar-backed) review whose file is
                closed.
            documentPath:
              type: string
              description: The absolute path of the reviewed file.
            attached:
              type: boolean
              description: >-
                True while the reviewed document is open; false for a
                review persisted in its sidecar after the file closed.
                There is no reattach API — opening the file is the
                reattachment.
    ReviewListResponse:
      type: object
      required:
        - reviews
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewListEntry'
paths:
  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: Serve the OpenAPI specification
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /openapi.json:
    get:
      operationId: getOpenApiSpecJson
      summary: Serve the OpenAPI specification as JSON
      description: >-
        The identical document, parsed from the YAML per request so the two
        encodings cannot disagree. Offered because schema importers are not
        uniformly willing to read YAML.
      responses:
        '200':
          description: OpenAPI JSON document
          content:
            application/json:
              schema:
                type: object
  /openapi-actions.json:
    get:
      operationId: getOpenApiActionsJson
      summary: Serve the OpenAPI specification as JSON without the SSE route
      description: >-
        Action-compatible projection without the SSE route. Derived per request
        from the same document, dropping only /v1/events, which is
        Server-Sent Events: an Action cannot consume it and waits on it
        forever. The long-poll route /v1/reviews/{reviewId}/events is an
        ordinary request and remains.
      responses:
        '200':
          description: OpenAPI JSON document
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      operationId: health
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/ping:
    get:
      operationId: ping
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Supported features and limits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/context:
    get:
      operationId: getContext
      summary: Focused view, focused document, and all open documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorContext'
  /v1/documents:
