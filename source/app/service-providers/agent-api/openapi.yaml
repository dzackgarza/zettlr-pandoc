      operationId: listDocuments
      summary: List open or loaded documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
            default: open
          description: Reserved document-state filter for clients. Only open is currently
            supported.
  /v1/documents/{documentId}:
    get:
      operationId: getDocument
      summary: Document metadata and review status
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/focus:
    post:
      operationId: focusDocument
      summary: Focus or create an editor view for the document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusDocumentResponse'
        '404':
          description: Document not found or outside configured workspace scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/content:
    get:
      operationId: readDocumentContent
      summary: Read working or reference text by line slice
      description: >-
        Answers for every documentId GET /v1/workspace/files returns, whether
        or not the file is open; reading never opens a file or moves the
        user's focus. side=working is the text your next patch must match,
        with every accepted change already in it, and the side whose revision
        hash a proposal needs. side=reference is the review baseline,
        identical to working until a review exists. A closed file answers
        from its detached review when it has one and from disk otherwise.
        Re-read working before each new proposal, and diff it against what
        you proposed to detect an acceptance the reviewer tweaked.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum:
              - working
              - reference
            default: working
        - name: startLine
          in: query
          schema:
            type: integer
        - name: endLine
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadDocumentResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/search:
    post:
      operationId: searchDocument
      summary: Literal or regex search against the live buffer
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - literal
              properties:
                literal:
                  type: string
                  maxLength: 512
                context:
                  type: integer
                  default: 3
                  minimum: 0
                  maximum: 100
                  description: >-
                    Lines of surrounding text returned on each side of every
                    hit. Every hit carries its own copy, so this multiplies
                    the response by the number of hits and is capped rather
                    than open-ended; a context outside this range is refused
                    with INVALID_PARAMS.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '400':
          description: >-
            Invalid, unparseable, or over-length search pattern, or a context
            outside the declared range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: >-
            Pattern evaluation exceeded the server's time budget
            (SEARCH_TIMEOUT). The budget bounds the whole match, including a
            single catastrophically backtracking execution, so an identical
            retry costs the same wall time and fails again: simplify the
            pattern instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/proposals:
    post:
      operationId: submitProposal
      summary: Submit an ordered batch of exact unified-diff claims
      description: >-
        The batch binds to the one baselineSha256 in the body. It applies
        sequentially and atomically server-side: every claim applies with
        zero fuzz to its predecessor's text or the whole batch is
        refused with nothing applied, and each claim becomes its own
        packet (packetIds maps them in claim order). Submit claim-sized
        entries — one logical decision each. Accepted material is already in
        the working text; do not resubmit it. The reviewer may edit a
        proposed chunk before accepting it, so diff your proposal against the
        final text if you care whether acceptance was verbatim.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProposalRequest'
      responses:
        '200':
          description: Proposal applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProposalResponse'
        '412':
          description: Stale revision (ETag mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Review generation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '400':
          description: >-
            Invalid or non-applicable patch. PATCH_NOT_APPLICABLE means the
            document drifted from the text you built against: re-read the
            working content and rebuild the patch against it — a blind retry
            fails identically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews:
    get:
      operationId: listReviews
      summary: List all reviews, attached and detached
      description: >-
        Reviews attached to open documents, plus detached (sidecar-backed)
        reviews on files that are currently closed. A returning turn starts
        here: this is every review still carrying outstanding state, on files
        nobody has open included. A detached review reattaches by opening its
        documentPath.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
  /v1/reviews/{reviewId}:
    get:
      operationId: getReview
      summary: Inspect a review
      description: >-
        Status plus review-level comments — the reviewer's channel back to
        you. Read the comments and the held chunks at the start of each turn
        and address them with new claims. Answers for every reviewId
        /v1/reviews lists: a detached review is served from its sidecar,
        with attached=false and no documentRevision.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/diff:
    get:
      operationId: getReviewDiff
      summary: Retrieve the complete unresolved composite diff
      description: >-
        Answers for a detached review too, from the frozen texts in its
        sidecar; that response carries no documentId.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDiffResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/chunks:
    get:
      operationId: getReviewChunks
      summary: Inspect current unresolved chunks
      description: >-
        Read this at the start of each turn. A held chunk's holdComment is
        the reviewer's question or objection — answer it with a revised claim
        in your next submission. Pending chunks are simply undecided;
        adjudicating your own proposals through the accept/reject routes ends
        the review instead of answering it. Answers for a detached review
        too, from the frozen texts in its sidecar — same content-addressed
        chunk ids, no documentId — but deciding those chunks needs the file
        open.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewChunksResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/chunks/{chunkId}/accept:
    post:
      operationId: acceptReviewChunk
      summary: Accept one chunk
      description: >-
        Moves the merge reference to agree with the working document on this
        chunk. The document itself does not change. The same decision path the
        editor's Accept button uses.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: chunkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkDecisionResponse'
        '404':
          description: >-
            Review not found, or no unresolved chunk carries this id at the
            current state — the region changed since the chunk list was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached: it exists, and
            /v1/reviews lists it, but no decision can land while its file is
            closed. Open its documentPath to reattach it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/chunks/{chunkId}/reject:
    post:
      operationId: rejectReviewChunk
      summary: Reject one chunk
      description: >-
        Restores this chunk of the working document to the merge reference.
        The document changes; the response carries the new revision. The same
        decision path the editor's Reject button uses.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: chunkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkDecisionResponse'
        '404':
          description: >-
            Review not found, or no unresolved chunk carries this id at the
            current state — the region changed since the chunk list was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached: it exists, and
            /v1/reviews lists it, but no decision can land while its file is
            closed. Open its documentPath to reattach it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/chunks/{chunkId}/hold:
    post:
      operationId: holdReviewChunk
      summary: Hold one chunk without adjudicating it
      description: >-
        Attaches an optional comment to the chunk and takes it out of the
        pending count: held chunks do not block saving, survive the save (the
        reference retains its disagreement over the span), and stay rendered
        in the editor. Chunk ids are content-addressed, so editing or
        deciding a held chunk retires its id — the hold is then released and
        a comment it carried surfaces as an orphaned review-level comment.
        Re-holding a held chunk replaces its comment. The same decision path
        the editor's Hold button uses.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: chunkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldChunkRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkDecisionResponse'
        '404':
          description: >-
            Review not found, or no unresolved chunk carries this id at the
            current state — the region changed since the chunk list was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached: it exists, and
            /v1/reviews lists it, but no decision can land while its file is
            closed. Open its documentPath to reattach it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/comments:
    post:
      operationId: addReviewComment
      summary: Attach a review-level comment
      description: >-
        Communication without adjudication: the comment lands in the review's
        comment list and advances the generation, so a long-poll on the
        existing generation cursor wakes — that cursor IS the "what changed
        since my last turn" query. Answer a hold here when the answer is an
        argument; answer with a new claim when the answer is an edit.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReviewCommentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCommentResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '400':
          description: Missing or empty comment text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached: it exists, and
            /v1/reviews lists it, but a comment cannot land while its file is
            closed. Open its documentPath to reattach it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/packets:
    get:
      operationId: getReviewPackets
      summary: Inspect the proposal-packet ledger
      description: >-
        Answers for a detached review too, from its sidecar's ledger; that
        response carries no documentId.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPacketsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/accept-all:
    post:
      operationId: acceptAllReviewChunks
      summary: Accept every outstanding chunk in one sweep
      description: >-
        Accepts the whole current partition at once — the mirror of /clear,
        which is mass reject. The reference moves to agree with the working
        document; the document itself does not change. Held chunks are
        accepted too; a hold's comment is preserved as an orphaned
        review-level comment. Same decision authority as the editor's
        Accept-all control.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptAllChunksResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: The reviewed document is closed, or the review was invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/clear:
    post:
      operationId: clearReview
      summary: Discard unresolved suggestions while preserving accepted changes
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearReviewResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached: it exists, and
            /v1/reviews lists it, but clearing edits the document, which is
            closed. Open its documentPath to reattach it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/proposals/{packetId}/retract:
    post:
      operationId: retractProposal
      summary: Retract an untouched, most-recent packet
      parameters:
        - name: packetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetractProposalResponse'
        '409':
          description: >-
            PACKET_NOT_RETRACTABLE when the packet is live but no longer the
            retractable one: the error carries the owning reviewId and
            canClearUnresolved: true — clearing is the remaining way to drop
            the unresolved suggestions. DOCUMENT_CLOSED when the packet
            belongs to a detached review (one listReviews reports with
            attached: false): the message names the file to open, and
            canClearUnresolved is false because clearing refuses too.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/events:
    get:
      operationId: subscribeEvents
      summary: Subscribe to focus, document, proposal, and review events via SSE
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            Cache-Control:
              description: SSE transport must not be cached by intermediaries.
              schema:
                type: string
              example: no-cache
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Resumes from the next server event after this id.
  /v1/reviews/{reviewId}/events:
    get:
      operationId: waitForReviewEvents
      summary: Long-poll review events and status after a generation advance
      description: >-
        The "what changed since my last turn" query: pass the generation from
        your last response as afterGeneration. It answers at once if the
        review has already moved past that generation, otherwise blocks until
        a decision, hold, comment, or new packet advances it — or until
        waitSeconds elapses, which answers with timedOut true.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: afterGeneration
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: waitSeconds
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
        - name: wait
          in: query
          deprecated: true
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
          description: Deprecated alias for waitSeconds.
      responses:
        '200':
          description: Review state and matching event history (or timed out)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEventsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached, so nothing can advance
            its generation and the wait would never end. Open its
            documentPath to reattach it, then poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/views:
    get:
      operationId: listViews
      summary: List active editor views
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewsResponse'
  /v1/workspace/files:
    get:
      operationId: listWorkspaceFiles
      summary: List every file across the configured workspaces
      description: >-
        The agent's orientation entry point — all files the editor can see,
        open or not, flat across every configured workspace. Orient in this
        order: workspace files -> documents -> reviews -> chunks.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFilesResponse'
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List configured workspaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesResponse'
  /v1/workspaces/{workspaceId}/documents:
    get:
      operationId: listWorkspaceDocuments
      summary: List documents known to a workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Optional case-insensitive substring filter over file path.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDocumentsResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
