openapi: 3.1.0
info:
  title: Zettlr-Pandoc Editor Agent API
  version: 1.0.0
  description: >-
    REST API for reading editor documents, submitting proposed edits, and
    inspecting reviews. Read the current document before submitting a proposal
    and use the returned revision hash. If a patch no longer applies, read the
    document again and rebuild the patch. Accepted edits already appear in the
    working text. The reviewer accepts or rejects changes in the editor; an
    agent may submit new proposals, add comments, or retract its newest
    untouched proposal.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://127.0.0.1:27412
    description: Default loopback endpoint
components:
  schemas:
    DocumentRevision:
      type: object
      additionalProperties: false
      required:
        - sha256
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ReviewState:
      type: string
      description: >-
        invalidated means the file changed on disk under the review. Its
        suggestions are frozen against the text they were made in: read them
        with view=chunks or view=diff, then call reapplyReview to map them onto
        the current text, or discardReview to remove them.
      enum:
        - active
        - resolved-awaiting-save
        - completed
        - cleared
        - invalidated
    ReviewSummary:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: >-
            Suggestions not yet accepted or rejected.
        packetCount:
          type: integer
    ReviewComment:
      type: object
      required:
        - text
        - createdAt
      properties:
        text:
          type: string
        createdAt:
          type: string
    EditorViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
    DocumentSummary:
      type: object
      required:
        - documentId
        - uri
        - path
        - name
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        crossReferences:
          type: string
          enum:
            - quarto
            - pandoc-crossref
          description: >-
            The system that renders this document's cross-references, which fixes
            the ID syntax: quarto for documents in a Quarto project (#tbl-key),
            pandoc-crossref for everything else (#tbl:key). GET /help shows both.
        review:
          $ref: '#/components/schemas/ReviewSummary'
    EditorContext:
      type: object
      properties:
        focusedView:
          $ref: '#/components/schemas/FocusedViewSummary'
        focusedDocument:
          $ref: '#/components/schemas/DocumentSummary'
        openDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
      required:
        - openDocuments
    ReadDocumentResponse:
      type: object
      additionalProperties: false
      required:
        - documentId
        - attached
        - side
        - revision
        - reviewGeneration
        - range
        - content
        - truncated
      properties:
        documentId:
          type: string
        attached:
          type: boolean
          description: Whether the document is currently open in the editor.
        side:
          type: string
          enum:
            - working
            - reference
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
          minimum: 0
        range:
          type: object
          required:
            - startLine
            - endLine
            - totalLines
          properties:
            startLine:
              type: integer
            endLine:
              type: integer
            totalLines:
              type: integer
        content:
          type: string
        truncated:
          type: boolean
    ProposalClaim:
      type: object
      description: >-
        One reviewable change: exactly one unified-diff hunk, justified by
        its own description. The reviewer keeps or undoes each claim on its
        own. An edit that repeats at several places in the document is
        several claims, each with its own description.
      required:
        - description
        - patch
      properties:
        description:
          type: string
          minLength: 1
          description: >-
            Justify this one change: what is wrong in these lines, what the
            edit changes, and why. Each claim
            in one submission needs a distinct description; duplicate or
            near-duplicate descriptions are rejected as
            DUPLICATE_CLAIM_DESCRIPTION.
        patch:
          type: string
          minLength: 1
          description: >-
            Unified diff implementing exactly this claim. Name the target in
            the ---/+++ headers as the literal `document` or as the
            document's absolute path (a git-style a/ or b/ prefix is
            allowed); any other filename, a create/delete/rename/binary/mode
            patch, or a diff that leaves the text unchanged is PATCH_INVALID.
            The change must be exactly one hunk when diffed with three lines
            of context (as `diff -u` and `git diff` do): changes more than six
            unchanged lines apart are separate hunks, and a patch whose change
            is two or more hunks is CLAIM_NOT_ATOMIC.
        addressesAnnotationIds:
          type: array
          items:
            type: string
          description: >-
            Open annotation IDs this claim answers. If any ID is missing,
            resolved, or no longer points to text, the submission is rejected.
            Successful proposals appear on the addressed annotations.
    SubmitProposalRequest:
      type: object
      additionalProperties: false
      required:
        - baselineSha256
        - expectedReviewGeneration
        - clientRequestId
        - claims
      properties:
        baselineSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 returned by the most recent working-content read. It pins
            the exact text the patches must apply to; a stale hash is refused
            as REVISION_MISMATCH.
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            Zero when no review exists; otherwise the generation returned by
            the most recent review or chunk read.
        clientRequestId:
          type: string
          minLength: 1
          description: >-
            Client-chosen unique string. Replaying it returns the original
            packet rather than applying the patch twice; reusing it for a
            different request is refused as IDEMPOTENCY_CONFLICT.
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProposalClaim'
          description: >-
            Claims are applied in order against the supplied revision. All
            claims succeed or none are applied. Each claim becomes a separate
            review proposal that the reviewer can decide independently.
    SubmitProposalResponse:
      type: object
      required:
        - packetId
        - packetIds
        - reviewId
        - documentId
        - documentRevision
        - reviewGeneration
        - unresolvedChunks
        - state
      properties:
        packetId:
          type: string
          description: >-
            ID of the newest proposal in this submission; it is the last
            element of packetIds.
        packetIds:
          type: array
          items:
            type: string
          description: >-
            One proposal ID per claim, in claim order.
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
    AgentError:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - APP_NOT_RUNNING
            - PROTOCOL_MISMATCH
            - NO_FOCUSED_DOCUMENT
            - DOCUMENT_NOT_FOUND
            - DOCUMENT_CLOSED
            - REVISION_MISMATCH
            - REVIEW_GENERATION_MISMATCH
            - REVIEW_NOT_FOUND
            - REVIEW_INVALIDATED
            - REVIEW_NOT_INVALIDATED
            - PATCH_INVALID
            - PATCH_NOT_APPLICABLE
            - CLAIM_NOT_ATOMIC
            - PACKET_NOT_RETRACTABLE
            - CHUNK_NOT_FOUND
            - ANNOTATION_NOT_FOUND
            - ANNOTATION_GENERATION_MISMATCH
            - ANNOTATION_RESOLVED
            - ANNOTATION_ORPHANED
            - ANNOTATION_OWNER_ONLY
            - IDEMPOTENCY_CONFLICT
            - REQUEST_TOO_LARGE
            - REQUEST_BODY_TIMEOUT
            - SEARCH_TIMEOUT
            - METHOD_NOT_FOUND
            - INVALID_PARAMS
            - PERSISTENCE_FAILED
            - INTERNAL_ERROR
            - CITATION_DATABASE_NOT_LOADED
            - CITATION_NOT_FOUND
            - FIGURE_NOT_FOUND
            - FIGURE_ALREADY_EXISTS
            - WORKSPACE_NOT_FOUND
            - WORKSPACE_OUTSIDE_SCOPE
            - WORKSPACE_ENTRY_EXISTS
            - DUPLICATE_CLAIM_DESCRIPTION
            - BASELINE_MISMATCH
            - ZOTERO_UNAVAILABLE
            - ZOTERO_SOURCE_NOT_IDENTIFIED
            - ZOTERO_REQUEST_FAILED
        message:
          type: string
        documentId:
          type: string
        expected:
          $ref: '#/components/schemas/DocumentRevision'
        actual:
          $ref: '#/components/schemas/DocumentRevision'
        reviewId:
          type: string
        reviewGeneration:
          type: integer
          description: >-
            REVIEW_GENERATION_MISMATCH: the generation the review is actually
            at, so the caller can re-read from exactly there.
        conflictingClaimIndices:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 0
          description: >-
            DUPLICATE_CLAIM_DESCRIPTION: zero-based indices of the first pair
            of claims whose normalized descriptions are too similar.
        descriptionSimilarity:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            DUPLICATE_CLAIM_DESCRIPTION: normalized Levenshtein similarity of
            the conflicting pair, where an exact match is 1.0.
        remediation:
          $ref: '#/components/schemas/ZoteroSourceRemediation'
    AgentErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/AgentError'
    AgentEvent:
      type: object
      required:
        - event
        - timestamp
      properties:
        event:
          type: string
          enum:
            - review.started
            - review.changed
            - review.resolved
            - review.commented
            - review.cleared
            - review.invalidated
            - review.completed
            - review.discarded
            - review.sidecar-error
            - proposal.applied
            - proposal.retracted
            - annotation.created
            - annotation.message-added
            - annotation.target-changed
            - annotation.orphaned
            - annotation.resolved
            - annotation.reopened
            - annotation.deleted
            - annotation.proposal-linked
        timestamp:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        annotationId:
          type: string
          description: >-
            annotation.*: the annotation the event is about.
        annotationGeneration:
          type: integer
          description: >-
            annotation.*: annotation version after the event.
        packetId:
          type: string
          description: >-
            proposal.applied and proposal.retracted: proposal ID affected by the event.
        chunkId:
          type: string
          description: >-
            review.commented: the outstanding chunk the comment is anchored
            to, when it is chunk-anchored.
        comment:
          type: string
          description: >-
            review.commented: the comment text. Absent on a chunk-anchored
            event when the reviewer removed the chunk's note.
        message:
          type: string
          description: Error detail for review.sidecar-error events.
        id:
          type: string
          description: Server-generated event sequence identifier.
    ReviewEventsResponse:
      type: object
      required:
        - reviewId
      properties:
        reviewId:
          type: string
        status:
          $ref: '#/components/schemas/ReviewSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEvent'
        timedOut:
          type: boolean
          description: True if the request reached its timeout before a status change.
    FocusedViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - documentId
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
    ViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
        documents:
          type: array
          items:
            type: object
            required:
              - path
            properties:
              documentId:
                type: string
              path:
                type: string
    ViewsResponse:
      type: object
      required:
        - views
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewSummary'
    WorkspaceSummary:
      type: object
      required:
        - workspaceId
        - path
      properties:
        workspaceId:
          type: string
        path:
          type: string
    WorkspacesResponse:
      type: object
      required:
        - workspaces
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    LoadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - true
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    UnloadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - false
      additionalProperties: false
    WorkspaceDocumentSummary:
      oneOf:
        - $ref: '#/components/schemas/LoadedWorkspaceDocumentSummary'
        - $ref: '#/components/schemas/UnloadedWorkspaceDocumentSummary'
    FocusDocumentResponse:
      type: object
      required:
        - focused
        - documentId
      properties:
        focused:
          type: boolean
          const: true
        documentId:
          type: string
    WorkspaceDocumentsResponse:
      type: object
      required:
        - workspaceId
        - documents
      properties:
        workspaceId:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDocumentSummary'
    WorkspaceFileEntry:
      type: object
      required:
        - documentId
        - path
        - name
        - workspaceId
        - open
      properties:
        documentId:
          type: string
        path:
          type: string
        name:
          type: string
        workspaceId:
          type: string
        open:
          type: boolean
          description: Whether the file is currently loaded in the editor.
        linkTarget:
          type: string
          description: >-
            How other documents link to this Markdown file: [[linkTarget]]. The
            shortest path suffix that names it alone. Absent for other files.
    WorkspaceFilesResponse:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFileEntry'
    WorkspaceDirectoryEntry:
      type: object
      required:
        - path
        - name
        - workspaceId
        - parent
      properties:
        path:
          type: string
          description: Absolute path of the folder.
        name:
          type: string
        workspaceId:
          type: string
        parent:
          type: string
          description: >-
            Absolute path of the containing folder, or the workspace root for a
            top-level folder.
    WorkspaceDirectoriesResponse:
      type: object
      required:
        - workspaceId
        - directories
      properties:
        workspaceId:
          type: string
        directories:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDirectoryEntry'
    WorkspaceEntryCreateRequest:
      type: object
      additionalProperties: false
      required:
        - path
        - kind
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Absolute destination path, or a path relative to the target
            workspace. The destination folder must exist.
        kind:
          type: string
          enum:
            - file
            - folder
          description: Create a file or a folder.
        content:
          type: string
          description: File content as UTF-8; required when kind is file.
        workspaceId:
          type: string
          description: >-
            Workspace root a relative `path` resolves against. Required when
            `path` is not absolute.
    WorkspaceEntryResponse:
      type: object
      required:
        - kind
        - path
        - name
        - workspaceId
      properties:
        kind:
          type: string
          enum:
            - file
            - folder
        path:
          type: string
        name:
          type: string
        workspaceId:
          type: string
    WorkspaceSearchMatch:
      type: object
      required:
        - range
        - line
        - preview
      properties:
        range:
          type: object
          description: Character offsets into the file text, end exclusive.
          required:
            - from
            - to
          properties:
            from:
              type: integer
            to:
              type: integer
        line:
          type: integer
          description: One-based line of the match start.
        preview:
          type: object
          description: 'The line of the match: text before it (trimmed), the match, and
            text after it.'
          required:
            - before
            - inside
            - after
          properties:
            before:
              type: string
            inside:
              type: string
            after:
              type: string
    WorkspaceSearchFile:
      type: object
      required:
        - documentId
        - path
        - name
        - open
        - matches
      properties:
        documentId:
          type: string
        path:
          type: string
        name:
          type: string
        workspaceId:
          type: string
          description: The workspace that holds the file; absent for an open file outside
            every workspace.
        open:
          type: boolean
          description: Whether the file is currently loaded in the editor.
        matches:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSearchMatch'
    WorkspaceSearchResponse:
      type: object
      required:
        - files
        - matchCount
        - truncated
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSearchFile'
        matchCount:
          type: integer
        truncated:
          type: boolean
          description: True when the search stopped at maxMatches; narrow the query or the
            globs.
    SearchDocumentResponse:
      type: object
      required:
        - documentId
        - revision
        - hits
        - truncated
      properties:
        documentId:
          type: string
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        hits:
          type: array
          maxItems: 1000
          description: >-
            Search hits in document order. At most 1000 hits are returned; a
            true truncated field means more matching hits were present.
          items:
            type: object
            required:
              - line
              - column
              - length
              - contextBefore
              - contextAfter
            properties:
              line:
                type: integer
              column:
                type: integer
              length:
                type: integer
              contextBefore:
                type: string
              contextAfter:
                type: string
        truncated:
          type: boolean
    ReviewDetailResponse:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
        - comments
        - attached
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: >-
            Suggestions not yet accepted or rejected.
        packetCount:
          type: integer
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ReviewComment'
          description: >-
            Review-level comments in creation order.
        attached:
          type: boolean
          description: >-
            True while the reviewed document is open. Reviews for closed files
            remain readable but cannot be changed until the file is reopened.
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
          description: >-
            Current document revision. Absent while the reviewed file is closed.
    ReviewDiffResponse:
      type: object
      required:
        - reviewId
        - patch
        - generation
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent while the reviewed file is closed.
        patch:
          type: string
        generation:
          type: integer
    ReviewChunksResponse:
      type: object
      required:
        - reviewId
        - generation
        - chunks
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent while the reviewed file is closed.
        generation:
          type: integer
        workingSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 of the current text containing these changes. Use it as
            expectedWorkingSha256 when retracting a related proposal. Absent
            while the reviewed file is closed.
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingChunk'
    ReviewPacketsResponse:
      type: object
      required:
        - reviewId
        - packets
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent while the reviewed file is closed.
        packets:
          type: array
          items:
            $ref: '#/components/schemas/ProposalPacket'
    ReapplyReviewRequest:
      type: object
      additionalProperties: false
      required:
        - expectedReviewGeneration
      properties:
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            See ReviewMutationPrecondition. Reapply and discard do not depend
            on the current text, so they carry no working hash.
    ReapplyReviewResponse:
      type: object
      additionalProperties: false
      required:
        - reviewId
        - documentId
        - reviewGeneration
        - unresolvedChunks
        - withdrawnChunkIds
        - state
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        withdrawnChunkIds:
          type: array
          description: >-
            The suggestions whose text the current file no longer holds. They
            are withdrawn; submit them again as new proposals if they still
            apply.
          items:
            type: string
        state:
          $ref: '#/components/schemas/ReviewState'
    DiscardReviewResponse:
      type: object
      additionalProperties: false
      required:
        - reviewId
        - documentId
      properties:
        reviewId:
          type: string
        documentId:
          type: string
    RetractProposalResponse:
      type: object
      required:
        - retracted
        - packetId
        - reviewId
        - documentId
        - reviewGeneration
        - unresolvedChunks
        - documentRevision
      properties:
        retracted:
          type: boolean
          const: true
        packetId:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    OutstandingChunk:
      type: object
      required:
        - chunkId
        - referenceText
        - workingText
        - workingSpans
        - packetIds
        - descriptions
        - patch
      properties:
        chunkId:
          type: string
          description: >-
            Stable ID for this proposed change.
        referenceText:
          type: string
          description: Original text; empty for a pure insertion.
        workingText:
          type: string
          description: Proposed text; empty for a pure deletion.
        workingSpans:
          type: array
          description: >-
            Character ranges belonging to this proposed change. Text added by
            the document owner is excluded.
          items:
            type: object
            required:
              - from
              - to
            properties:
