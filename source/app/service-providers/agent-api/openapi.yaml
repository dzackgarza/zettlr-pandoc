openapi: 3.1.0
info:
  title: Zettlr-Pandoc Editor Agent API
  version: 1.0.0
  description: >-
    HTTP REST API for the Zettlr-Pandoc editor agent. Provides live document
    reads, proposal submission, review inspection, and Server-Sent Events. The
    Electron main process owns all agent-visible state.


    The working loop: orient (workspace files -> documents -> reviews ->
    chunks), submit claim-sized proposals against a freshly read content
    hash, then next turn read the review's chunk comments and comments and
    answer them with new claims. Accepted material is already in the working
    text — never resubmit it. A PATCH_NOT_APPLICABLE refusal means the text
    moved under you: re-read
    the working side and rebuild against it, because a retry fails the same
    way.


    You never accept, reject, or discard a chunk: the reviewer disposes
    of your proposals in the editor. Your moves are a revision, a comment,
    and retracting a packet of your own the reviewer has not touched yet.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://127.0.0.1:27412
    description: Default loopback endpoint
components:
  schemas:
    DocumentRevision:
      type: object
      additionalProperties: false
      required:
        - sha256
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ReviewState:
      type: string
      enum:
        - active
        - resolved-awaiting-save
        - completed
        - cleared
        - invalidated
    ReviewSummary:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: >-
            Chunks not yet accepted or rejected — the whole outstanding
            partition.
        packetCount:
          type: integer
    ReviewComment:
      type: object
      required:
        - text
        - createdAt
      properties:
        text:
          type: string
        createdAt:
          type: string
        orphanedFromChunkId:
          type: string
          description: >-
            Present when this comment was salvaged from a chunk-anchored
            note whose chunk id vanished from the partition (the annotated
            region was edited, decided, cleared, or absorbed by a later
            claim). Note text is never silently lost.
        decision:
          type: string
          enum: [accept, reject]
          description: >-
            Present when the orphaning event was a decision: what happened
            to the chunk this comment annotated. Absent when the chunk
            dissolved through an ordinary edit.
        referenceText:
          type: string
          description: >-
            The annotated chunk's reference-side text, snapshotted when the
            note was written. Lets a caller reconstruct what the comment
            was about without replaying the document history.
        workingText:
          type: string
          description: >-
            The annotated chunk's working-side text, snapshotted when the
            note was written.
    EditorViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
    DocumentSummary:
      type: object
      required:
        - documentId
        - uri
        - path
        - name
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    EditorContext:
      type: object
      properties:
        focusedView:
          $ref: '#/components/schemas/FocusedViewSummary'
        focusedDocument:
          $ref: '#/components/schemas/DocumentSummary'
        openDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
      required:
        - openDocuments
    ReadDocumentResponse:
      type: object
      additionalProperties: false
      required:
        - documentId
        - attached
        - side
        - revision
        - reviewGeneration
        - range
        - content
        - truncated
      properties:
        documentId:
          type: string
        attached:
          type: boolean
          description: Whether the document currently has a live authority buffer.
        side:
          type: string
          enum:
            - working
            - reference
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
          minimum: 0
        range:
          type: object
          required:
            - startLine
            - endLine
            - totalLines
          properties:
            startLine:
              type: integer
            endLine:
              type: integer
            totalLines:
              type: integer
        content:
          type: string
        truncated:
          type: boolean
    ProposalClaim:
      type: object
      description: >-
        One logical decision — the smallest change a reviewer can accept or
        reject on its own. Do not bundle unrelated edits into one claim.
      required:
        - description
        - patch
      properties:
        description:
          type: string
          minLength: 1
          description: >-
            Self-contained prose shown to the reviewer at the chunks this
            claim produced: what is wrong, what the patch changes, and why —
            enough to adjudicate without re-deriving the diagnosis.
        patch:
          type: string
          minLength: 1
          description: >-
            Unified diff implementing exactly this claim. Name the target in
            the ---/+++ headers as the literal `document` or as the
            document's absolute path (a git-style a/ or b/ prefix is
            allowed); any other filename, a create/delete/rename/binary/mode
            patch, or a diff that leaves the text unchanged is PATCH_INVALID.
    SubmitProposalRequest:
      type: object
      additionalProperties: false
      required:
        - baselineSha256
        - expectedReviewGeneration
        - clientRequestId
        - claims
      properties:
        baselineSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 returned by the most recent working-content read. It pins
            the exact text the patches must apply to; a stale hash is refused
            as REVISION_MISMATCH.
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            Zero when no review exists; otherwise the generation returned by
            the most recent review or chunk read.
        clientRequestId:
          type: string
          minLength: 1
          description: >-
            Client-chosen unique string. Replaying it returns the original
            packet rather than applying the patch twice; reusing it for a
            different request is refused as IDEMPOTENCY_CONFLICT.
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProposalClaim'
          description: >-
            Ordered claim sequence applied against the ONE baseline,
            sequentially and atomically: claim k applies with zero fuzz to
            the text claim k-1 produced, all-or-nothing, and each claim
            becomes its own packet. Send one entry per logical decision —
            that gives the reviewer separately decidable packets.
    SubmitProposalResponse:
      type: object
      required:
        - packetId
        - packetIds
        - reviewId
        - documentId
        - documentRevision
        - reviewGeneration
        - unresolvedChunks
        - state
      properties:
        packetId:
          type: string
          description: >-
            The newest packet of this submission (the retractable one) —
            the last element of packetIds.
        packetIds:
          type: array
          items:
            type: string
          description: >-
            One packet per claim, in claim order; a single-patch submission
            has exactly one.
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
    AgentError:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - APP_NOT_RUNNING
            - PROTOCOL_MISMATCH
            - NO_FOCUSED_DOCUMENT
            - DOCUMENT_NOT_FOUND
            - DOCUMENT_CLOSED
            - REVISION_MISMATCH
            - REVIEW_GENERATION_MISMATCH
            - REVIEW_NOT_FOUND
            - REVIEW_INVALIDATED
            - PATCH_INVALID
            - PATCH_NOT_APPLICABLE
            - PACKET_NOT_RETRACTABLE
            - CHUNK_NOT_FOUND
            - IDEMPOTENCY_CONFLICT
            - REQUEST_TOO_LARGE
            - REQUEST_BODY_TIMEOUT
            - SEARCH_TIMEOUT
            - METHOD_NOT_FOUND
            - INVALID_PARAMS
            - PERSISTENCE_FAILED
            - INTERNAL_ERROR
        message:
          type: string
        documentId:
          type: string
        expected:
          $ref: '#/components/schemas/DocumentRevision'
        actual:
          $ref: '#/components/schemas/DocumentRevision'
        reviewId:
          type: string
        reviewGeneration:
          type: integer
          description: >-
            REVIEW_GENERATION_MISMATCH: the generation the review is actually
            at, so the caller can re-read from exactly there.
    AgentErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/AgentError'
    AgentEvent:
      type: object
      required:
        - event
        - timestamp
      properties:
        event:
          type: string
          enum:
            - focus.changed
            - document.changed
            - document.closed
            - review.started
            - review.changed
            - review.resolved
            - review.commented
            - review.cleared
            - review.invalidated
            - review.completed
            - review.discarded
            - review.sidecar-error
            - proposal.applied
            - proposal.retracted
        timestamp:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        packetId:
          type: string
          description: >-
            proposal.applied and proposal.retracted: the packet affected by the event.
        chunkId:
          type: string
          description: >-
            review.commented: the outstanding chunk the comment is anchored
            to, when it is chunk-anchored.
        comment:
          type: string
          description: >-
            review.commented: the comment text. Absent on a chunk-anchored
            event when the reviewer removed the chunk's note.
        orphanedFromChunkId:
          type: string
          description: >-
            review.commented: set when the comment was salvaged from a
            chunk-anchored note whose chunk id vanished from the partition.
        message:
          type: string
          description: 'review.sidecar-error: what failed and why.'
        id:
          type: string
          description: Server-generated event sequence identifier.
    ReviewEventsResponse:
      type: object
      required:
        - reviewId
      properties:
        reviewId:
          type: string
        status:
          $ref: '#/components/schemas/ReviewSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEvent'
        timedOut:
          type: boolean
          description: True if the request reached its timeout before a status change.
    FocusedViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - documentId
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
    ViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
        documents:
          type: array
          items:
            type: object
            required:
              - path
            properties:
              documentId:
                type: string
              path:
                type: string
    ViewsResponse:
      type: object
      required:
        - views
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewSummary'
    WorkspaceSummary:
      type: object
      required:
        - workspaceId
        - path
      properties:
        workspaceId:
          type: string
        path:
          type: string
    WorkspacesResponse:
      type: object
      required:
        - workspaces
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    LoadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - true
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    UnloadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - false
      additionalProperties: false
    WorkspaceDocumentSummary:
      oneOf:
        - $ref: '#/components/schemas/LoadedWorkspaceDocumentSummary'
        - $ref: '#/components/schemas/UnloadedWorkspaceDocumentSummary'
    FocusDocumentResponse:
      type: object
      required:
        - focused
        - documentId
      properties:
        focused:
          type: boolean
          const: true
        documentId:
          type: string
    WorkspaceDocumentsResponse:
      type: object
      required:
        - workspaceId
        - documents
      properties:
        workspaceId:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDocumentSummary'
    WorkspaceFileEntry:
      type: object
      required:
        - documentId
        - path
        - name
        - workspaceId
        - open
      properties:
        documentId:
          type: string
        path:
          type: string
        name:
          type: string
        workspaceId:
          type: string
        open:
          type: boolean
          description: Whether the file is currently loaded in the editor.
    WorkspaceFilesResponse:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFileEntry'
    SearchDocumentResponse:
      type: object
      required:
        - documentId
        - revision
        - hits
        - truncated
      properties:
        documentId:
          type: string
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        hits:
          type: array
          maxItems: 1000
          description: >-
            Search hits in document order. At most 1000 hits are returned; a
            true truncated field means more matching hits were present.
          items:
            type: object
            required:
              - line
              - column
              - length
              - contextBefore
              - contextAfter
            properties:
              line:
                type: integer
              column:
                type: integer
              length:
                type: integer
              contextBefore:
                type: string
              contextAfter:
                type: string
        truncated:
          type: boolean
    ReviewDetailResponse:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
        - comments
        - attached
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
          description: >-
            Chunks not yet accepted or rejected — the whole outstanding
            partition.
        packetCount:
          type: integer
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ReviewComment'
          description: >-
            Review-level comments in creation order — attached directly via
            the comments route, or orphaned from chunk-anchored notes whose
            chunks vanished.
        attached:
          type: boolean
          description: >-
            True while the reviewed document is open. A detached review is
            served from its sidecar: readable, but not decidable until its
            documentPath is opened again.
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
          description: >-
            The open document's revision. Absent for a detached review —
            there is no open document to revise.
    ReviewDiffResponse:
      type: object
      required:
        - reviewId
        - patch
        - generation
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent for a detached review, whose file is closed.
        patch:
          type: string
        generation:
          type: integer
    ReviewChunksResponse:
      type: object
      required:
        - reviewId
        - generation
        - chunks
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent for a detached review, whose file is closed.
        generation:
          type: integer
        workingSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 of the working text these chunks were partitioned from —
            the `expectedWorkingSha256` a retraction of one of the packets
            behind them must carry. Absent for a detached review, which has
            no live buffer and accepts no mutation until its file is
            reopened.
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingChunk'
    ReviewPacketsResponse:
      type: object
      required:
        - reviewId
        - packets
      properties:
        reviewId:
          type: string
        documentId:
          type: string
          description: Absent for a detached review, whose file is closed.
        packets:
          type: array
          items:
            $ref: '#/components/schemas/ProposalPacket'
    RetractProposalResponse:
      type: object
      required:
        - retracted
        - packetId
        - reviewId
        - documentId
        - reviewGeneration
        - unresolvedChunks
        - documentRevision
      properties:
        retracted:
          type: boolean
          const: true
        packetId:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    OutstandingChunk:
      type: object
      required:
        - chunkId
        - referenceRange
        - workingRange
        - referenceText
        - workingText
        - packetIds
        - descriptions
        - patch
      properties:
        chunkId:
          type: string
          description: >-
            Content-addressed identity: stable while the chunk's own text is
            untouched, so deciding one chunk does not invalidate the ids of
            the others. A decision against an id whose region has since
            changed fails with CHUNK_NOT_FOUND.
        referenceRange:
          description: >-
            1-based, half-open: the chunk covers lines [fromLine, toLine).
            fromLine equal to toLine marks an empty side (a pure insertion
            has an empty reference range; a pure deletion an empty working
            range). Ranges of distinct chunks never overlap.
          type: object
          required:
            - fromLine
            - toLine
          properties:
            fromLine:
              type: integer
            toLine:
              type: integer
        workingRange:
          type: object
          required:
            - fromLine
            - toLine
          properties:
            fromLine:
              type: integer
            toLine:
              type: integer
        referenceText:
          type: string
          description: The reference-side lines, newline-joined; empty for a pure insertion.
        workingText:
          type: string
          description: The working-side lines, newline-joined; empty for a pure deletion.
        packetIds:
          type: array
          items:
            type: string
          description: >-
            The packets whose edits produced this chunk, in application
            order — every packet whose recorded edit spans still touch the
            chunk's reference range. Overlapping claims attribute together;
            a chunk the user tweaked keeps the attribution of the claim it
            grew from; a chunk only the user's own edits created carries
            none.
        descriptions:
          type: array
          items:
            type: string
          description: >-
            Those packets' descriptions, in the same order, packets without
            one omitted.
        comment:
          type: string
          description: >-
            The reviewer's note attached to this chunk without deciding it —
            a question or objection. Address it in your next claims batch.
        patch:
          type: string
          description: Focused zero-context unified diff of exactly this chunk.
    ReviewMutationPrecondition:
      type: object
      additionalProperties: false
      required:
        - expectedReviewGeneration
        - expectedWorkingSha256
      properties:
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            The review generation this request was formed against — the
            `generation` of the chunk list, diff, or status you read. Every
            review mutation advances it, including the reviewer's decisions,
            so a request that carries a stale one was formed before somebody
            else's mutation landed and is refused as
            REVIEW_GENERATION_MISMATCH.
        expectedWorkingSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 of the working text this request was formed against —
            `workingSha256` from GET /v1/reviews/{reviewId}/chunks. Binding
            the request to the exact bytes makes an edit between the read and
            the request a REVISION_MISMATCH refusal instead of a retraction
            landing on text the caller never saw.
    AddReviewCommentRequest:
      type: object
      additionalProperties: false
      required:
        - expectedReviewGeneration
        - text
      properties:
        expectedReviewGeneration:
          type: integer
          minimum: 0
          description: >-
            See ReviewMutationPrecondition. A comment moves no document text,
            so it carries no working hash.
        text:
          type: string
          minLength: 1
    ReviewCommentResponse:
      type: object
      required:
        - reviewId
        - documentId
        - reviewGeneration
        - comment
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        comment:
          $ref: '#/components/schemas/ReviewComment'
    ProposalPacket:
      type: object
      required:
        - packetId
        - reviewId
        - clientRequestId
        - appliedAt
        - patchFormat
        - patch
        - applicationGeneration
      properties:
        packetId:
          type: string
        reviewId:
          type: string
        clientRequestId:
          type: string
        description:
          type: string
        appliedAt:
          type: string
        patchFormat:
          type: string
        patch:
          type: string
        applicationGeneration:
          type: integer
          description: The review generation this packet's application produced.
    PingResponse:
      type: object
      required:
        - protocolVersion
        - instanceId
        - pid
      properties:
        protocolVersion:
          type: string
        instanceId:
          type: string
        pid:
          type: integer
    CapabilitiesResponse:
      type: object
      required:
        - protocolVersion
        - supportedPatchFormats
        - reviewSupport
        - retractionSupport
        - maxRequestSize
        - eventStreamSupport
        - eventReplayBufferSize
        - applicationVersion
        - instanceId
      properties:
        protocolVersion:
          type: string
        supportedPatchFormats:
          type: array
          items:
            type: string
            enum:
              - unified-diff
        reviewSupport:
          type: boolean
          const: true
        retractionSupport:
          type: boolean
          const: true
        maxRequestSize:
          type: integer
        eventStreamSupport:
          type: boolean
          const: true
        eventReplayBufferSize:
          type: integer
        applicationVersion:
          type: string
        instanceId:
          type: string
    DocumentListResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
    ReviewListEntry:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - type: object
          required:
            - documentPath
            - attached
          properties:
            documentId:
              type: string
              description: >-
                Present for a review attached to an open document; absent
                for a detached (sidecar-backed) review whose file is
                closed.
            documentPath:
              type: string
              description: The absolute path of the reviewed file.
            attached:
              type: boolean
              description: >-
                True while the reviewed document is open; false for a
                review persisted in its sidecar after the file closed.
                There is no reattach API — opening the file is the
                reattachment.
    ReviewListResponse:
      type: object
      required:
        - reviews
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewListEntry'
paths:
  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: Serve the OpenAPI specification
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /openapi.json:
    get:
      operationId: getOpenApiSpecJson
      summary: Serve the OpenAPI specification as JSON
      description: >-
        The identical document, parsed from the YAML per request so the two
        encodings cannot disagree. Offered because schema importers are not
        uniformly willing to read YAML.
      responses:
        '200':
          description: OpenAPI JSON document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /openapi-actions.json:
    get:
      operationId: getOpenApiActionsJson
      summary: Serve the OpenAPI specification as JSON without the SSE route
      description: >-
        Action-compatible projection without the SSE route. Derived per request
        from the same document, dropping only /v1/events, which is
        Server-Sent Events: an Action cannot consume it and waits on it
        forever. The long-poll route /v1/reviews/{reviewId}/events is an
        ordinary request and remains.
      responses:
        '200':
          description: OpenAPI JSON document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /health:
    get:
      operationId: health
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/ping:
    get:
      operationId: ping
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Supported features and limits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/context:
    get:
      operationId: getContext
      summary: Focused view, focused document, and all open documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorContext'
  /v1/documents:
    get:
      operationId: listDocuments
      summary: List open or loaded documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
            default: open
          description: Reserved document-state filter for clients. Only open is currently
            supported.
  /v1/documents/{documentId}:
    get:
      operationId: getDocument
      summary: Document metadata and review status
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/focus:
    post:
      operationId: focusDocument
      summary: Focus or create an editor view for the document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusDocumentResponse'
        '404':
          description: Document not found or outside configured workspace scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/content:
    get:
      operationId: readDocumentContent
      summary: Read working or reference text by line slice
      description: >-
        Answers for every documentId GET /v1/workspace/files returns, whether
        or not the file is open; reading never opens a file or moves the
        user's focus. A closed file answers from its detached review when it
        has one and from disk otherwise. Re-read the working side before each
        new proposal.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum:
              - working
              - reference
            default: working
          description: >-
            working is the text your next patch must match, with every
            accepted change already in it, and the side whose revision hash a
            proposal needs; diff it against what you proposed to detect an
            acceptance the reviewer tweaked. reference is the review baseline,
            identical to working until a review exists.
        - name: startLine
          in: query
          schema:
            type: integer
        - name: endLine
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadDocumentResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/search:
    post:
      operationId: searchDocument
      summary: Literal or regex search against the live buffer
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - literal
              properties:
                literal:
                  type: string
                  maxLength: 512
                context:
                  type: integer
                  default: 3
                  minimum: 0
                  maximum: 100
                  description: >-
                    Lines of surrounding text returned on each side of every
                    hit. Every hit carries its own copy, so this multiplies
                    the response by the number of hits and is capped rather
                    than open-ended; a context outside this range is refused
                    with INVALID_PARAMS.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '400':
          description: >-
            Invalid, unparseable, or over-length search pattern, or a context
            outside the declared range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: >-
            Pattern evaluation exceeded the server's time budget
            (SEARCH_TIMEOUT). The budget bounds the whole match, including a
            single catastrophically backtracking execution, so an identical
            retry costs the same wall time and fails again: simplify the
            pattern instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/proposals:
    post:
      operationId: submitProposal
      summary: Submit an ordered batch of exact unified-diff claims
      description: >-
        The batch binds to the one baselineSha256 in the body and applies
        all-or-nothing; packetIds maps its packets in claim order.
        Accepted material is already in the working text — do not resubmit
        it. The reviewer may edit a chunk before accepting it, so diff your
        proposal against the final text.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProposalRequest'
      responses:
        '200':
          description: Proposal applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProposalResponse'
        '412':
          description: Stale revision (ETag mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Review generation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '400':
          description: >-
            Invalid or non-applicable patch. PATCH_NOT_APPLICABLE means the
            document drifted from the text you built against: re-read the
            working content and rebuild the patch against it — a blind retry
            fails identically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: >-
            The document does not exist or is outside the configured workspace
            scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: >-
            The proposal could not be persisted or the server could not
            complete the submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews:
    get:
      operationId: listReviews
      summary: List all reviews, attached and detached
      description: >-
        Reviews attached to open documents, plus detached (sidecar-backed)
        reviews on files that are currently closed. A returning turn starts
        here: this is every review still carrying outstanding state, on files
        nobody has open included. A detached review reattaches by opening its
        documentPath.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
  /v1/reviews/{reviewId}:
    get:
      operationId: getReview
      summary: Inspect a review
      description: >-
        Status plus review-level comments — the reviewer's channel back to
        you. Read them and the chunk notes at the start of each turn, and
        address them with new claims. Answers for every reviewId /v1/reviews
        lists: a detached review is served from its sidecar, with
        attached=false and no documentRevision.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/diff:
    get:
      operationId: getReviewDiff
      summary: Retrieve the complete unresolved composite diff
      description: >-
        Answers for a detached review too, from the frozen texts in its
        sidecar; that response carries no documentId.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDiffResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/chunks:
    get:
      operationId: getReviewChunks
      summary: Inspect current unresolved chunks
      description: >-
        Read this at the start of each turn. A chunk's comment is the
        reviewer's question or objection — answer it with a revised claim
        in your next submission. Every chunk here is undecided: the
        reviewer accepts and rejects them in the editor, and this API
        offers no way to decide them for them.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            The unresolved chunks. A detached review answers from the frozen
            texts in its sidecar — same content-addressed chunk ids, no
            documentId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewChunksResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/comments:
    post:
      operationId: addReviewComment
      summary: Attach a review-level comment
      description: >-
        Communication without adjudication: the comment lands in the review's
        comment list and advances the generation, so a long-poll on the
        existing generation cursor wakes. Answer a chunk note here when the
        answer is an argument; answer with a new claim when the answer is an
        edit.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReviewCommentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCommentResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '400':
          description: Missing or empty comment text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached: it exists, and
            /v1/reviews lists it, but a comment cannot land while its file is
            closed. Open its documentPath to reattach it.
            Also REVISION_MISMATCH when expectedWorkingSha256 does not
            match the live working text, and REVIEW_GENERATION_MISMATCH
            when expectedReviewGeneration is not the review's current
            generation; the error carries the actual revision and
            generation, and neither refusal mutates anything.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'

  /v1/reviews/{reviewId}/packets:
    get:
      operationId: getReviewPackets
      summary: Inspect the proposal-packet ledger
      description: >-
        Answers for a detached review too, from its sidecar's ledger; that
        response carries no documentId.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPacketsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/proposals/{packetId}/retract:
    post:
      operationId: retractProposal
      summary: Retract an untouched, most-recent packet
      parameters:
        - name: packetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewMutationPrecondition'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetractProposalResponse'
        '409':
          description: >-
            PACKET_NOT_RETRACTABLE when the packet is live but no longer the
            retractable one: the error carries the owning reviewId, and the
            suggestions stay up for the reviewer to dispose of. A packet the
            reviewer has already adjudicated is never retractable — the
            decision advanced the generation the packet was applied at.
            DOCUMENT_CLOSED when the packet belongs to a detached review (one
            listReviews reports with attached: false): the message names the
            file to open.
            Also REVISION_MISMATCH when expectedWorkingSha256 does not
            match the live working text, and REVIEW_GENERATION_MISMATCH
            when expectedReviewGeneration is not the review's current
            generation; the error carries the actual revision and
            generation, and neither refusal mutates anything.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'

  /v1/events:
    get:
      operationId: subscribeEvents
      summary: Subscribe to focus, document, proposal, and review events via SSE
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            Cache-Control:
              description: SSE transport must not be cached by intermediaries.
              schema:
                type: string
              example: no-cache
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Resumes from the next server event after this id.
  /v1/reviews/{reviewId}/events:
    get:
      operationId: waitForReviewEvents
      summary: Long-poll review events and status after a generation advance
      description: >-
        The "what changed since my last turn" query: pass your last
        response's generation as afterGeneration. It answers at once if the
        review already moved past that generation, otherwise blocks until a
        decision, comment, or packet advances it — or until waitSeconds
        elapses, answering with timedOut true.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: afterGeneration
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: waitSeconds
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
        - name: wait
          in: query
          deprecated: true
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
          description: Deprecated alias for waitSeconds.
      responses:
        '200':
          description: Review state and matching event history (or timed out)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEventsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: >-
            DOCUMENT_CLOSED — the review is detached, so nothing can advance
            its generation and the wait would never end. Open its
            documentPath to reattach it, then poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/views:
    get:
      operationId: listViews
      summary: List active editor views
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewsResponse'
  /v1/workspace/files:
    get:
      operationId: listWorkspaceFiles
      summary: List every file across the configured workspaces
      description: >-
        The agent's orientation entry point — all files the editor can see,
        open or not, flat across every configured workspace. Orient in this
        order: workspace files -> documents -> reviews -> chunks.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFilesResponse'
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List configured workspaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesResponse'
  /v1/workspaces/{workspaceId}/documents:
    get:
      operationId: listWorkspaceDocuments
      summary: List documents known to a workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Optional case-insensitive substring filter over file path.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDocumentsResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
