                Ordered edits built against the same document revision. All
                claims succeed or none are applied. Each claim becomes a
                separate review proposal.
        - type: object
          required:
            - patch
            - description
          properties:
            patch:
              type: string
              minLength: 1
            description:
              type: string
              minLength: 1
