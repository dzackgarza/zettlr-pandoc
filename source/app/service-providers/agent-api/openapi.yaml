          type: boolean
          description: >-
            Whether the main citation database of the editor contained
            citationKey before the response was sent. The import waits for
            the Better BibTeX export to reach that database; false means the
            export did not arrive in time, and a later search shows when it
            does.
    ZoteroIdentifierImportRequest:
      type: object
      required:
        - identifier
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          description: >-
            An arXiv ID (2401.01234 or arXiv:2401.01234), a DOI
            (10.1007/BF01440955), an ISBN, or a PubMed ID. Zotero gets the
            metadata from the registry of the identifier.
        collectionKeys:
          type: array
          items:
            type: string
          description: Zotero collection keys to add the new items to.
    ZoteroIdentifierImportResponse:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ZoteroAddedItem'
    ZoteroFallbackMetadata:
      type: object
      description: >-
        The caller's description of a source that Zotero cannot identify. Send
        it only after importZoteroUrl answered ZOTERO_SOURCE_NOT_IDENTIFIED and
        no alternative source in the remediation has the work. Take the title,
        authors and year from the source itself.
      required:
        - title
        - creators
        - year
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        creators:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - lastName
            additionalProperties: false
            properties:
              firstName:
                type: string
              lastName:
                type: string
                minLength: 1
        year:
          type: string
          pattern: '^[0-9]{4}$'
    ZoteroUrlImportRequest:
      type: object
      required:
        - url
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: >-
            An http or https URL: an arXiv abstract page, a DOI link, a
            publisher page, a catalogue page, or a direct link to a PDF.
        collectionKeys:
          type: array
          items:
            type: string
          description: Zotero collection keys to add the new item to.
        fallbackMetadata:
          $ref: '#/components/schemas/ZoteroFallbackMetadata'
    ZoteroUrlImportResponse:
      type: object
      required:
        - item
        - existing
        - method
        - finalUrl
        - attachmentFailures
      additionalProperties: false
      properties:
        item:
          $ref: '#/components/schemas/ZoteroAddedItem'
        existing:
          type: boolean
          description: >-
            true when the work was already in the library; that item is
            returned unchanged.
        method:
          type: string
          enum:
            - web_translator
            - page_metadata
            - identifier
            - published_bibtex
            - external_service
            - pdf_recognition
            - caller_metadata
          description: >-
            How Zotero identified the source. caller_metadata means the item
            was made from fallbackMetadata and has the tag
            metadata:unresolved.
        finalUrl:
          type: string
          description: The URL after redirects.
        attachmentFailures:
          type: array
          description: >-
            Attachments that Zotero could not store. The item is saved without
            them.
          items:
            type: object
            required:
              - title
              - url
              - error
            additionalProperties: false
            properties:
              title:
                type: string
              url:
                type: string
              error:
                type: string
    ZoteroSourceRemediation:
      type: object
      description: >-
        ZOTERO_SOURCE_NOT_IDENTIFIED: sources whose pages Zotero identifies
        reliably. Find the work at one of them and import that URL or
        identifier. Only when none has the work, send the same URL again with
        fallbackMetadata.
      required:
        - message
        - alternativeSources
      additionalProperties: false
      properties:
        message:
          type: string
        alternativeSources:
          type: array
          items:
            type: object
            required:
              - name
              - example
            additionalProperties: false
            properties:
              name:
                type: string
              example:
                type: string
                description: The form of a URL or identifier at this source.
paths:
  /help:
    get:
      operationId: getHelp
      x-openai-isConsequential: false
      summary: Serve authoring help documentation
      description: Returns authoring documentation from HELP.md in Markdown or JSON format.
      parameters:
        - name: format
          in: query
          required: false
          description: Response format (markdown or json)
          schema:
            type: string
            enum:
              - markdown
              - json
      responses:
        '200':
          description: Authoring help documentation in Markdown or JSON
          content:
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/HelpResponse'
  /v1/ping:
    get:
      operationId: ping
      x-openai-isConsequential: false
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      x-openai-isConsequential: false
      summary: Report supported Agent API capabilities and formats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/context:
    get:
      operationId: getContext
      x-openai-isConsequential: false
      summary: High-level overview of active editor views and open documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorContext'
  /v1/views:
    get:
      operationId: listViews
      x-openai-isConsequential: false
      summary: List active editor views
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewsResponse'
  /v1/workspace/search:
    get:
      operationId: searchWorkspace
      x-openai-isConsequential: false
      summary: Find text across every file in the workspaces
      description: >-
        The editor's find-in-files over every file in the open workspaces. Open
        documents are searched in their live buffer. Text is literal unless
        regex is true. Each file carries the documentId that the document
        routes take.
      parameters:
        - name: text
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
          description: The text or regular expression to find.
        - name: matchCase
          in: query
          schema:
            type: boolean
            default: false
          description: Match letter case exactly.
        - name: wholeWord
          in: query
          schema:
            type: boolean
            default: false
          description: Match only at word boundaries.
        - name: regex
          in: query
          schema:
            type: boolean
            default: false
          description: Read text as a JavaScript regular expression.
        - name: include
          in: query
          schema:
            type: string
            default: ''
          description: Comma-separated globs relative to the workspace root; a file must
            match one. A glob without a slash matches at any depth, for example
            `*.md`.
        - name: exclude
          in: query
          schema:
            type: string
            default: ''
          description: Comma-separated globs; a file that matches one is skipped.
        - name: maxMatches
          in: query
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 1000
          description: The search stops after this many matches and sets truncated.
      responses:
        '200':
          description: The matching files, in workspace order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSearchResponse'
        '400':
          description: Empty text or invalid regular expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: Matching one file did not finish within the server deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      x-openai-isConsequential: false
      summary: List configured workspaces, or a workspace's documents, directories, or files
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
          description: Optional workspace ID to inspect within that workspace.
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum:
              - summary
              - documents
              - directories
              - files
            default: summary
          description: >-
            summary: the configured workspaces. documents and directories
            require a workspaceId. files lists every supported file, flat,
            open or not — across all workspaces, or the one workspaceId names.
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Optional search term when listing workspace documents.
      responses:
        '200':
          description: Workspace listing, document list, directory list, or file list.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorkspacesResponse'
                  - $ref: '#/components/schemas/WorkspaceDocumentsResponse'
                  - $ref: '#/components/schemas/WorkspaceDirectoriesResponse'
                  - $ref: '#/components/schemas/WorkspaceFilesResponse'
  /v1/workspace/entries:
    post:
      operationId: createWorkspaceEntry
      x-openai-isConsequential: false
      summary: Create a file or folder inside a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceEntryCreateRequest'
      responses:
        '201':
          description: Entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntryResponse'
        '400':
          description: Invalid path or missing file content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '403':
          description: Destination is outside every configured workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Named workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: An entry already exists at the destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: Persistence failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents:
    get:
      operationId: listDocuments
      x-openai-isConsequential: false
      summary: List open or loaded documents
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
            default: open
          description: Reserved document-state filter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
  /v1/documents/{documentId}:
    get:
      operationId: getDocument
      x-openai-isConsequential: false
      summary: Document metadata and optional text content
      description: >-
        Returns document metadata by default. Set includeContent=true to read
        current or pre-review text with an ETag revision header.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: includeContent
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to include the text content lines.
        - name: side
          in: query
          schema:
            type: string
            enum:
              - working
              - reference
            default: working
          description: working is the current text; reference is the text before proposed changes.
        - name: startLine
          in: query
          schema:
            type: integer
        - name: endLine
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DocumentSummary'
                  - $ref: '#/components/schemas/ReadDocumentResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/focus:
    post:
      operationId: focusDocument
      x-openai-isConsequential: false
      summary: Focus or create an editor view for the document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusDocumentResponse'
        '404':
          description: Document not found or outside workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/search:
    post:
      operationId: searchDocument
      x-openai-isConsequential: false
      summary: Literal or regex search in one document, open or closed
      description: >-
        Searches the text that getDocument reads: the live buffer of an open
        document, or the file of a closed one. To search every file, use
        searchWorkspace.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - literal
              properties:
                literal:
                  type: string
                  maxLength: 512
                context:
                  type: integer
                  default: 3
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '400':
          description: Invalid regex pattern
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '408':
          description: Search timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/proposals:
    post:
      operationId: submitProposal
      x-openai-isConsequential: false
      summary: Submit edits against an open document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProposalRequest'
      responses:
        '200':
          description: Proposal accepted into review
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProposalResponse'
        '400':
          description: Invalid request payload or claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Revision mismatch or document closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '412':
          description: Precondition failed
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: Patch does not apply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/review-submissions:
    post:
      operationId: submitReview
      x-openai-isConsequential: false
      summary: Submit a review by file path
      description: >-
        Resolve a workspace file, verify an optional revision hash, submit
        ordered claims or one patch as an all-or-nothing change, and focus the
        document unless disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSubmissionRequest'
      responses:
        '200':
          description: Review submission applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSubmissionResponse'
        '400':
          description: Invalid payload or claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: File not found in workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Conflict or mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '412':
          description: Baseline mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: Patch does not apply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/annotations:
    get:
      operationId: listAnnotations
      x-openai-isConsequential: false
      summary: List annotations across the workspace or for one document
      parameters:
        - name: documentId
          in: query
          required: false
          schema:
            type: string
          description: Optional document ID to filter annotations.
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - resolved
      responses:
        '200':
          description: Annotations list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationListResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/annotations/{annotationId}:
    get:
      operationId: getAnnotation
      x-openai-isConsequential: false
      summary: Get a single annotation and its conversation thread
      parameters:
        - name: annotationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The annotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationResponse'
        '404':
          description: Annotation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/annotations/{annotationId}/messages:
    post:
      operationId: addAnnotationMessage
      x-openai-isConsequential: false
      summary: Append a message to an annotation conversation thread
      parameters:
        - name: annotationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAnnotationMessageRequest'
      responses:
        '200':
          description: Appended message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAnnotationMessageResponse'
        '404':
          description: Annotation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Document is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews:
    get:
      operationId: listReviews
      x-openai-isConsequential: false
      summary: List reviews for open and closed workspace files
      responses:
        '200':
          description: Review summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
  /v1/reviews/{reviewId}:
    get:
      operationId: getReview
      x-openai-isConsequential: false
      summary: Inspect review details, its diff, pending changes, or proposals
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum:
              - detail
              - diff
              - chunks
              - packets
            default: detail
          description: Which slice of the review to return.
      responses:
        '200':
          description: Review slice.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReviewDetailResponse'
                  - $ref: '#/components/schemas/ReviewDiffResponse'
                  - $ref: '#/components/schemas/ReviewChunksResponse'
                  - $ref: '#/components/schemas/ReviewPacketsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Document closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/comments:
    post:
      operationId: addReviewComment
      x-openai-isConsequential: false
      summary: Add a comment to a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReviewCommentRequest'
      responses:
        '200':
          description: The review with the comment appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Document closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/reapply:
    post:
      operationId: reapplyReview
      x-openai-isConsequential: false
      summary: Reapply an invalidated review to the current text
      description: >-
        Maps the frozen suggestions of an invalidated review onto the current
        text (the open buffer, or the file on disk). A suggestion whose text
        is still there is live again; the rest are withdrawn and listed in
        withdrawnChunkIds.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReapplyReviewRequest'
      responses:
        '200':
          description: The review is live again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReapplyReviewResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: The review is still current, or its generation moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/discard:
    post:
      operationId: discardReview
      x-openai-isConsequential: false
      summary: Discard an invalidated review
      description: >-
        Removes an invalidated review and its frozen suggestions. The file
        keeps its current text. Discard a review whose changes are already in
        the file, or no longer apply.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReapplyReviewRequest'
      responses:
        '200':
          description: The review is discarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscardReviewResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: The review is still current, or its generation moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/proposals/{packetId}/retract:
    post:
      operationId: retractProposal
      x-openai-isConsequential: false
      summary: Retract the newest untouched proposal
      parameters:
        - name: packetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewMutationPrecondition'
      responses:
        '200':
          description: Proposal retracted
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetractProposalResponse'
        '404':
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Proposal cannot be retracted or document is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/events:
    get:
      operationId: waitForReviewEvents
      x-openai-isConsequential: false
      summary: Wait for review changes after a generation
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: afterGeneration
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: waitSeconds
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
        - name: wait
          in: query
          deprecated: true
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
      responses:
        '200':
          description: Advance events or current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEventsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/citations:
    get:
      operationId: queryCitations
      x-openai-isConsequential: false
      summary: Query citation databases, item lists, or specific items
      parameters:
        - name: target
          in: query
          required: false
          schema:
            type: string
            enum:
              - items
              - databases
            default: items
        - name: database
          in: query
          required: false
          schema:
            type: string
            default: main
          description: Database identifier. Defaults to main.
        - name: citeKey
          in: query
          required: false
          schema:
            type: string
          description: Lookup a specific citation item by key.
      responses:
        '200':
          description: Citation query results.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CitationItemsResponse'
                  - $ref: '#/components/schemas/CitationDatabasesResponse'
                  - $ref: '#/components/schemas/CitationItem'
        '404':
          description: Database or cite key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/citations/render:
    post:
      operationId: renderCitations
      x-openai-isConsequential: false
      summary: Render formatted inline citations or bibliographies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderCitationsRequest'
      responses:
        '200':
          description: Rendered citations or bibliography
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RenderCitationResponse'
                  - $ref: '#/components/schemas/RenderBibliographyResponse'
        '400':
          description: No citations or citekeys to render
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Database not loaded, or a citation key not in it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/macros:
    get:
      operationId: listMacros
      x-openai-isConsequential: false
      summary: Inspect configured mathematical macros
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: Configured macro inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroInventoryResponse'
        '500':
          description: Macro inspection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/figures:
    get:
      operationId: queryFigures
      x-openai-isConsequential: false
      summary: List, search, or read figure files
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - list
              - search
              - read
            default: list
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: Search term when action=search.
        - name: path
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
          description: Relative path when action=read.
      responses:
        '200':
          description: Figure listing, search results, or file contents.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FigureListResponse'
                  - $ref: '#/components/schemas/FigureSearchResponse'
                  - $ref: '#/components/schemas/FigureFileResponse'
        '400':
          description: Invalid path or search parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Figure file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: Figure operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
    post:
      operationId: saveFigure
      x-openai-isConsequential: false
      summary: Create or update a figure file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FigureSaveRequest'
      responses:
        '200':
          description: Figure saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigureFileResponse'
        '201':
          description: Figure created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigureFileResponse'
        '400':
          description: Invalid path or content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Figure already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: Figure persistence failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/lint:
    get:
      operationId: lintDocuments
      x-openai-isConsequential: false
      summary: Lint documents by editor/workspace scope
      description: >-
        focused, open and document lint the current text through the lint
        cache. workspace and all read only the cache and return at once;
        documents never linted are listed under pending while the background
        linter works through them.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - focused
              - open
              - document
              - workspace
              - all
            default: focused
        - name: documentId
          in: query
          schema:
            type: string
        - name: workspaceId
          in: query
          schema:
            type: string
        - name: minimumSeverity
          in: query
          schema:
            type: string
            enum:
              - info
              - warning
              - error
            default: info
      responses:
        '200':
          description: Lint diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LintResponse'
        '400':
          description: Missing scope parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: Document or workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '500':
          description: Lint failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/zotero/items:
    get:
      operationId: searchZoteroItems
      tags:
        - zotero
      summary: Search the Zotero library and get citation keys
      description: >-
        Searches the titles, creators and years of the top-level items in the
        Zotero library. Each result has its Better BibTeX citation key and
        whether the editor can cite it now. Search before an import: a work
        that is already in the library needs no import.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Words of the title, a creator name, or a year.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: >-
            At most limit matching items, most recently added first. Standalone
            notes are left out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoteroSearchResponse'
        '502':
          description: Zotero answered with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '503':
          description: Zotero or the citation database is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/zotero/imports/identifier:
    post:
      operationId: importZoteroIdentifier
      tags:
        - zotero
      summary: Add a work to Zotero by arXiv ID, DOI, ISBN or PubMed ID
      description: >-
        Zotero gets the metadata of the work from the registry of the
        identifier, and the full text when it can. The response has the
        citation key of each new item. Prefer this operation when the work
        has an identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoteroIdentifierImportRequest'
      responses:
        '200':
          description: The new items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoteroIdentifierImportResponse'
        '400':
          description: The request or the identifier is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: No registry has the identifier, or a collection key does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '502':
          description: Zotero answered with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '503':
          description: Zotero or the citation database is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/zotero/imports/url:
    post:
      operationId: importZoteroUrl
      tags:
        - zotero
      summary: Add a work to Zotero from a URL
      description: >-
        Zotero identifies the work at the URL with its own translators,
        identifier discovery and PDF recognition, and stores the full text it
        gets: the PDF itself when the URL is a PDF. A work that is already in
        the library is returned with existing true. When Zotero cannot
        identify the source, the 422 ZOTERO_SOURCE_NOT_IDENTIFIED error has a
        remediation: find the work at one of its sources and import that.
        Only when none has the work, send the same URL again with
        fallbackMetadata; the item then has the tag metadata:unresolved and
        is citable at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoteroUrlImportRequest'
      responses:
        '200':
          description: The new or existing item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoteroUrlImportResponse'
        '400':
          description: The request is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '404':
          description: A collection key does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: ZOTERO_SOURCE_NOT_IDENTIFIED, with error.remediation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '502':
          description: Zotero could not fetch the source, or answered with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '503':
          description: Zotero or the citation database is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
