    AnnotationTarget:
      type: object
      additionalProperties: false
      description: >-
        Where an annotation points, reported in UTF-16 code-unit offsets and
        1-based line/column together. orphaned carries neither: I6 says the
        honest answer to lost text is a marker and Reattach, never a guessed
        position.
      required:
        - state
        - quotedText
      properties:
        state:
          type: string
          enum:
            - range
            - point
            - orphaned
        quotedText:
          type: string
          description: Text selected when the annotation was created.
        from:
          type: integer
          description: UTF-16 offset where the target starts. Present when state is range.
        to:
          type: integer
          description: UTF-16 offset where the target ends. Present when state is range.
        at:
          type: integer
          description: UTF-16 offset of the collapsed seam. Present when state is point.
        line:
          type: integer
          description: >-
            1-based line of from (range) or at (point). Absent when state is
            orphaned.
        column:
          type: integer
          description: >-
            1-based UTF-16 column of from (range) or at (point). Absent when
            state is orphaned.
        endLine:
          type: integer
          description: 1-based line of to. Present only when state is range.
        endColumn:
          type: integer
          description: 1-based UTF-16 column of to. Present only when state is range.
        reason:
          type: string
          enum:
            - target-deleted
            - external-drift
            - unmapped-document-change
          description: >-
            Present when state is point (always target-deleted) or orphaned
            (external-drift or unmapped-document-change).
    AnnotationMessage:
      type: object
      additionalProperties: false
      required:
        - messageId
