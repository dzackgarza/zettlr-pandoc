openapi: 3.1.0
info:
  title: Zettlr-Pandoc Editor Agent API
  version: 1.0.0
  description: 'HTTP REST API for the Zettlr-Pandoc editor agent. Provides live document
    reads, proposal submission, review inspection, and Server-Sent Events. The Electron
    main process owns all agent-visible state.

    '
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://127.0.0.1:27412
    description: Default loopback endpoint
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: >-
        The shared secret this editor instance was started with. Obtain it
        from the operator of the instance; every route below requires it.
  schemas:
    DocumentRevision:
      type: object
      required:
        - version
        - sha256
      properties:
        version:
          type: integer
        sha256:
          type: string
    ReviewState:
      type: string
      enum:
        - active
        - resolved-awaiting-save
        - completed
        - cleared
        - invalidated
    ReviewSummary:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
        packetCount:
          type: integer
    EditorViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
    DocumentSummary:
      type: object
      required:
        - documentId
        - uri
        - path
        - name
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    EditorContext:
      type: object
      properties:
        focusedView:
          $ref: '#/components/schemas/FocusedViewSummary'
        focusedDocument:
          $ref: '#/components/schemas/DocumentSummary'
        openDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
      required:
        - openDocuments
    ReadDocumentResponse:
      type: object
      required:
        - documentId
        - side
        - revision
        - range
        - content
        - truncated
      properties:
        documentId:
          type: string
        side:
          type: string
          enum:
            - working
            - reference
        snapshot:
          type: string
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        range:
          type: object
          required:
            - startLine
            - endLine
            - totalLines
          properties:
            startLine:
              type: integer
            endLine:
              type: integer
            totalLines:
              type: integer
        content:
          type: string
        truncated:
          type: boolean
    ProposalClaim:
      type: object
      required:
        - description
        - patch
      properties:
        description:
          type: string
          minLength: 1
          description: >-
            Prose: what this claim asserts its patch accomplishes. Shown to
            the reviewer at the chunks the claim produced.
        patch:
          type: string
          description: Unified diff implementing exactly this claim.
    SubmitProposalRequest:
      type: object
      required:
        - clientRequestId
        - snapshot
        - patchFormat
      oneOf:
        - required:
            - patch
        - required:
            - claims
          not:
            required:
              - description
      properties:
        clientRequestId:
          type: string
          minLength: 1
          description: >-
            Client-chosen unique string. Replaying it returns the original
            packet rather than applying the patch twice; reusing it for a
            different request is refused as IDEMPOTENCY_CONFLICT.
        snapshot:
          type: string
        patchFormat:
          type: string
          enum:
            - unified-diff
        patch:
          type: string
        description:
          type: string
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProposalClaim'
          description: >-
            Ordered claim sequence applied against the ONE snapshot,
            sequentially and atomically: claim k applies with zero fuzz to
            the text claim k-1 produced, all-or-nothing, and each claim
            becomes its own packet. The patch/description pair remains as
            the one-claim degenerate case; send exactly one of the two
            shapes.
        expectedReviewGeneration:
          type: integer
    SubmitProposalResponse:
      type: object
      required:
        - packetId
        - packetIds
        - reviewId
        - documentId
        - documentRevision
        - reviewGeneration
        - unresolvedChunks
        - state
      properties:
        packetId:
          type: string
          description: >-
            The newest packet of this submission (the retractable one) —
            the last element of packetIds.
        packetIds:
          type: array
          items:
            type: string
          description: >-
            One packet per claim, in claim order; a single-patch submission
            has exactly one.
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
    AgentError:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - APP_NOT_RUNNING
            - PROTOCOL_MISMATCH
            - NO_FOCUSED_DOCUMENT
            - DOCUMENT_NOT_FOUND
            - DOCUMENT_CLOSED
            - REVISION_MISMATCH
            - REVIEW_GENERATION_MISMATCH
            - REVIEW_NOT_FOUND
            - REVIEW_INVALIDATED
            - PATCH_INVALID
            - PATCH_NOT_APPLICABLE
            - PACKET_NOT_RETRACTABLE
            - CHUNK_NOT_FOUND
            - IDEMPOTENCY_CONFLICT
            - REQUEST_TOO_LARGE
            - REQUEST_BODY_TIMEOUT
            - SEARCH_TIMEOUT
            - METHOD_NOT_FOUND
            - INVALID_PARAMS
            - UNAUTHORIZED
            - INTERNAL_ERROR
        message:
          type: string
        documentId:
          type: string
        expected:
          $ref: '#/components/schemas/DocumentRevision'
        actual:
          $ref: '#/components/schemas/DocumentRevision'
        reviewId:
          type: string
        canClearUnresolved:
          type: boolean
    AgentErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/AgentError'
    AgentEvent:
      type: object
      required:
        - event
        - timestamp
      properties:
        event:
          type: string
        timestamp:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        id:
          type: string
          description: Server-generated event sequence identifier.
    ReviewEventsResponse:
      type: object
      required:
        - reviewId
      properties:
        reviewId:
          type: string
        status:
          $ref: '#/components/schemas/ReviewSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEvent'
        timedOut:
          type: boolean
          description: True if the request reached its timeout before a status change.
    FocusedViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - documentId
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
    ViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
        documents:
          type: array
          items:
            type: object
            required:
              - path
            properties:
              documentId:
                type: string
              path:
                type: string
    ViewsResponse:
      type: object
      required:
        - views
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewSummary'
    WorkspaceSummary:
      type: object
      required:
        - workspaceId
        - path
      properties:
        workspaceId:
          type: string
        path:
          type: string
    WorkspacesResponse:
      type: object
      required:
        - workspaces
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    LoadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - true
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/EditorViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    UnloadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - false
      additionalProperties: false
    WorkspaceDocumentSummary:
      oneOf:
        - $ref: '#/components/schemas/LoadedWorkspaceDocumentSummary'
        - $ref: '#/components/schemas/UnloadedWorkspaceDocumentSummary'
    FocusDocumentResponse:
      type: object
      required:
        - focused
        - documentId
      properties:
        focused:
          type: boolean
          const: true
        documentId:
          type: string
    WorkspaceDocumentsResponse:
      type: object
      required:
        - workspaceId
        - documents
      properties:
        workspaceId:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDocumentSummary'
    SearchDocumentResponse:
      type: object
      required:
        - documentId
        - snapshot
        - revision
        - hits
        - truncated
      properties:
        documentId:
          type: string
        snapshot:
          type: string
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        hits:
          type: array
          items:
            type: object
            required:
              - line
              - column
              - length
              - contextBefore
              - contextAfter
            properties:
              line:
                type: integer
              column:
                type: integer
              length:
                type: integer
              contextBefore:
                type: string
              contextAfter:
                type: string
        truncated:
          type: boolean
    ReviewDetailResponse:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
        - documentRevision
      properties:
        reviewId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        generation:
          type: integer
        unresolvedChunks:
          type: integer
        packetCount:
          type: integer
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    ReviewDiffResponse:
      type: object
      required:
        - reviewId
        - documentId
        - patch
        - generation
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        patch:
          type: string
        generation:
          type: integer
    ReviewChunksResponse:
      type: object
      required:
        - reviewId
        - documentId
        - generation
        - chunks
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        generation:
          type: integer
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingChunk'
    ReviewPacketsResponse:
      type: object
      required:
        - reviewId
        - documentId
        - packets
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        packets:
          type: array
          items:
            $ref: '#/components/schemas/ProposalPacket'
    ClearReviewResponse:
      type: object
      required:
        - reviewId
        - documentId
        - state
        - documentRevision
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    RetractProposalResponse:
      type: object
      required:
        - retracted
        - packetId
        - reviewId
        - documentId
        - reviewGeneration
        - unresolvedChunks
        - documentRevision
      properties:
        retracted:
          type: boolean
          const: true
        packetId:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    OutstandingChunk:
      type: object
      required:
        - chunkId
        - referenceRange
        - workingRange
        - referenceText
        - workingText
        - packetIds
        - descriptions
        - patch
      properties:
        chunkId:
          type: string
          description: >-
            Content-addressed identity: stable while the chunk's own text is
            untouched, so deciding one chunk does not invalidate the ids of
            the others. A decision against an id whose region has since
            changed fails with CHUNK_NOT_FOUND.
        referenceRange:
          description: >-
            1-based, half-open: the chunk covers lines [fromLine, toLine).
            fromLine equal to toLine marks an empty side (a pure insertion
            has an empty reference range; a pure deletion an empty working
            range). Ranges of distinct chunks never overlap.
          type: object
          required:
            - fromLine
            - toLine
          properties:
            fromLine:
              type: integer
            toLine:
              type: integer
        workingRange:
          type: object
          required:
            - fromLine
            - toLine
          properties:
            fromLine:
              type: integer
            toLine:
              type: integer
        referenceText:
          type: string
          description: The reference-side lines, newline-joined; empty for a pure insertion.
        workingText:
          type: string
          description: The working-side lines, newline-joined; empty for a pure deletion.
        packetIds:
          type: array
          items:
            type: string
          description: >-
            The packets whose edits produced this chunk, in application
            order — every packet whose recorded edit spans still touch the
            chunk's reference range. Overlapping claims attribute together;
            a chunk the user tweaked keeps the attribution of the claim it
            grew from; a chunk only the user's own edits created carries
            none.
        descriptions:
          type: array
          items:
            type: string
          description: >-
            Those packets' descriptions, in the same order, packets without
            one omitted.
        patch:
          type: string
          description: Focused zero-context unified diff of exactly this chunk.
    ChunkDecisionResponse:
      type: object
      required:
        - ok
        - reviewId
        - documentId
        - chunkId
        - decision
        - reviewGeneration
        - unresolvedChunks
        - state
        - documentRevision
      properties:
        ok:
          type: boolean
          const: true
        reviewId:
          type: string
        documentId:
          type: string
        chunkId:
          type: string
        decision:
          type: string
          enum:
            - accept
            - reject
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          $ref: '#/components/schemas/ReviewState'
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    ProposalPacket:
      type: object
      required:
        - packetId
        - reviewId
        - clientRequestId
        - appliedAt
        - patchFormat
        - patch
        - applicationGeneration
      properties:
        packetId:
          type: string
        reviewId:
          type: string
        clientRequestId:
          type: string
        description:
          type: string
        appliedAt:
          type: string
        patchFormat:
          type: string
        patch:
          type: string
        applicationGeneration:
          type: integer
          description: The review generation this packet's application produced.
    PingResponse:
      type: object
      required:
        - protocolVersion
        - instanceId
        - pid
      properties:
        protocolVersion:
          type: string
        instanceId:
          type: string
        pid:
          type: integer
    CapabilitiesResponse:
      type: object
      required:
        - protocolVersion
        - supportedPatchFormats
        - reviewSupport
        - retractionSupport
        - maxRequestSize
        - eventStreamSupport
        - eventReplayBufferSize
        - applicationVersion
        - instanceId
      properties:
        protocolVersion:
          type: string
        supportedPatchFormats:
          type: array
          items:
            type: string
            enum:
              - unified-diff
        reviewSupport:
          type: boolean
          const: true
        retractionSupport:
          type: boolean
          const: true
        maxRequestSize:
          type: integer
        eventStreamSupport:
          type: boolean
          const: true
        eventReplayBufferSize:
          type: integer
        applicationVersion:
          type: string
        instanceId:
          type: string
    DocumentListResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
    ReviewListEntry:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - type: object
          required:
            - documentId
          properties:
            documentId:
              type: string
    ReviewListResponse:
      type: object
      required:
        - reviews
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewListEntry'
security:
  - bearerToken: []
paths:
  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: Serve the OpenAPI specification
      security: []
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /openapi.json:
    get:
      operationId: getOpenApiSpecJson
      summary: Serve the OpenAPI specification as JSON
      description: >-
        The identical document, parsed from the YAML per request so the two
        encodings cannot disagree. Offered because schema importers are not
        uniformly willing to read YAML.
      security: []
      responses:
        '200':
          description: OpenAPI JSON document
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      operationId: health
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/ping:
    get:
      operationId: ping
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Supported features and limits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/context:
    get:
      operationId: getContext
      summary: Focused view, focused document, and all open documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorContext'
  /v1/documents:
    get:
      operationId: listDocuments
      summary: List open or loaded documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
            default: open
          description: Reserved document-state filter for clients. Only open is currently
            supported.
    post:
      operationId: openDocument
      summary: Open a server-local file URI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uri
              properties:
                uri:
                  type: string
      responses:
        '201':
          description: Document opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}:
    get:
      operationId: getDocument
      summary: Document metadata and review status
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/focus:
    post:
      operationId: focusDocument
      summary: Focus or create an editor view for the document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusDocumentResponse'
        '404':
          description: Document not found or outside configured workspace scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/content:
    get:
      operationId: readDocumentContent
      summary: Read live working or reference text by line slice
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum:
              - working
              - reference
            default: working
        - name: startLine
          in: query
          schema:
            type: integer
        - name: endLine
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadDocumentResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/search:
    post:
      operationId: searchDocument
      summary: Literal or regex search against the live buffer
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - literal
              properties:
                literal:
                  type: string
                  maxLength: 512
                context:
                  type: integer
                  default: 3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '400':
          description: Invalid, unparseable, or over-length search pattern
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '422':
          description: >-
            Pattern evaluation exceeded the server's time budget
            (SEARCH_TIMEOUT). The deadline is checked between per-line
            executions, so simplify the pattern rather than retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/documents/{documentId}/proposals:
    post:
      operationId: submitProposal
      summary: Submit an exact unified-diff proposal — one patch or an ordered claims batch
      description: >-
        Both request shapes bind to the one snapshot in the body. A claims
        batch applies sequentially and atomically server-side: every claim
        applies with zero fuzz to its predecessor's text or the whole batch
        is refused with nothing applied, and each claim becomes its own
        packet (packetIds maps them in claim order). The reviewer may edit a
        proposed chunk before accepting it, so diff your proposal against the
        final text if you care whether acceptance was verbatim.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProposalRequest'
      responses:
        '200':
          description: Proposal applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProposalResponse'
        '412':
          description: Stale revision (ETag mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '409':
          description: Review generation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
        '400':
          description: Invalid or non-applicable patch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews:
    get:
      operationId: listReviews
      summary: List all active reviews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
  /v1/reviews/{reviewId}:
    get:
      operationId: getReview
      summary: Inspect a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/diff:
    get:
      operationId: getReviewDiff
      summary: Retrieve the complete unresolved composite diff
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDiffResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/chunks:
    get:
      operationId: getReviewChunks
      summary: Inspect current unresolved chunks
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewChunksResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/chunks/{chunkId}/accept:
    post:
      operationId: acceptReviewChunk
      summary: Accept one chunk
      description: >-
        Moves the merge reference to agree with the working document on this
        chunk. The document itself does not change. The same decision path the
        editor's Accept button uses.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: chunkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkDecisionResponse'
        '404':
          description: >-
            Review not found, or no unresolved chunk carries this id at the
            current state — the region changed since the chunk list was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/chunks/{chunkId}/reject:
    post:
      operationId: rejectReviewChunk
      summary: Reject one chunk
      description: >-
        Restores this chunk of the working document to the merge reference.
        The document changes; the response carries the new revision. The same
        decision path the editor's Reject button uses.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: chunkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkDecisionResponse'
        '404':
          description: >-
            Review not found, or no unresolved chunk carries this id at the
            current state — the region changed since the chunk list was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/packets:
    get:
      operationId: getReviewPackets
      summary: Inspect the proposal-packet ledger
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPacketsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/reviews/{reviewId}/clear:
    post:
      operationId: clearReview
      summary: Discard unresolved suggestions while preserving accepted changes
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearReviewResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/proposals/{packetId}/retract:
    post:
      operationId: retractProposal
      summary: Retract an untouched, most-recent packet
      parameters:
        - name: packetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetractProposalResponse'
        '409':
          description: >-
            Packet not retractable. The error carries the owning reviewId and
            canClearUnresolved: true — clearing is the remaining way to drop
            the unresolved suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/events:
    get:
      operationId: subscribeEvents
      summary: Subscribe to focus, document, proposal, and review events via SSE
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            Cache-Control:
              description: SSE transport must not be cached by intermediaries.
              schema:
                type: string
              example: no-cache
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Resumes from the next server event after this id.
  /v1/reviews/{reviewId}/events:
    get:
      operationId: waitForReviewEvents
      summary: Long-poll review events and status after a generation advance
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: afterGeneration
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: waitSeconds
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
        - name: wait
          in: query
          deprecated: true
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
          description: Deprecated alias for waitSeconds.
      responses:
        '200':
          description: Review state and matching event history (or timed out)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEventsResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentErrorResponse'
  /v1/views:
    get:
