openapi: 3.1.0
info:
  title: Zettlr-Pandoc Editor Agent API
  version: 1.0.0
  description: 'HTTP REST API for the Zettlr-Pandoc editor agent. Provides live document
    reads, proposal submission, review inspection, and Server-Sent Events. The Electron
    main process owns all agent-visible state.

    '
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://127.0.0.1:27412
    description: Default loopback endpoint
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: >-
        The value of the ZETTLR_AGENT_API_TOKEN environment variable the
        editor was started with. When that variable is unset the server
        serves any loopback caller and this scheme is not enforced;
        publishing the port in that state exposes every open document.
  schemas:
    DocumentRevision:
      type: object
      required:
        - version
        - sha256
      properties:
        version:
          type: integer
        sha256:
          type: string
    ReviewSummary:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
      properties:
        reviewId:
          type: string
        state:
          type: string
          enum:
            - active
            - resolved-awaiting-save
            - completed
            - cleared
            - invalidated
        generation:
          type: integer
        unresolvedChunks:
          type: integer
        packetCount:
          type: integer
    DocumentSummary:
      type: object
      required:
        - documentId
        - uri
        - path
        - name
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            type: object
        review:
          $ref: '#/components/schemas/ReviewSummary'
    EditorContext:
      type: object
      properties:
        focusedView:
          $ref: '#/components/schemas/FocusedViewSummary'
        focusedDocument:
          $ref: '#/components/schemas/DocumentSummary'
        openDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
      required:
        - openDocuments
    ReadDocumentResponse:
      type: object
      required:
        - documentId
        - side
        - revision
        - range
        - content
        - truncated
      properties:
        documentId:
          type: string
        side:
          type: string
          enum:
            - working
            - reference
        snapshot:
          type: string
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        range:
          type: object
          required:
            - startLine
            - endLine
            - totalLines
          properties:
            startLine:
              type: integer
            endLine:
              type: integer
            totalLines:
              type: integer
        content:
          type: string
        truncated:
          type: boolean
    SubmitProposalRequest:
      type: object
      required:
        - clientRequestId
        - snapshot
        - patchFormat
        - patch
      properties:
        clientRequestId:
          type: string
          minLength: 1
          description: >-
            Client-chosen unique string. Replaying it returns the original
            packet rather than applying the patch twice; reusing it for a
            different request is refused as IDEMPOTENCY_CONFLICT.
        snapshot:
          type: string
        patchFormat:
          type: string
          enum:
            - unified-diff
        patch:
          type: string
        description:
          type: string
        expectedReviewGeneration:
          type: integer
    SubmitProposalResponse:
      type: object
      required:
        - packetId
        - reviewId
        - documentId
        - documentRevision
        - reviewGeneration
        - unresolvedChunks
        - state
      properties:
        packetId:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        state:
          type: string
    AgentError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - APP_NOT_RUNNING
            - PROTOCOL_MISMATCH
            - NO_FOCUSED_DOCUMENT
            - DOCUMENT_NOT_FOUND
            - DOCUMENT_CLOSED
            - REVISION_MISMATCH
            - REVIEW_GENERATION_MISMATCH
            - REVIEW_NOT_FOUND
            - REVIEW_INVALIDATED
            - PATCH_INVALID
            - PATCH_NOT_APPLICABLE
            - PACKET_NOT_RETRACTABLE
            - IDEMPOTENCY_CONFLICT
            - REQUEST_TOO_LARGE
            - METHOD_NOT_FOUND
            - INVALID_PARAMS
            - UNAUTHORIZED
            - INTERNAL_ERROR
        message:
          type: string
    AgentEvent:
      type: object
      required:
        - event
        - timestamp
      properties:
        event:
          type: string
        timestamp:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        id:
          type: string
          description: Server-generated event sequence identifier.
    ReviewEventsResponse:
      type: object
      required:
        - reviewId
        - status
      properties:
        reviewId:
          type: string
        status:
          type: object
          properties:
            reviewId:
              type: string
            state:
              type: string
            generation:
              type: integer
            unresolvedChunks:
              type: integer
            packetCount:
              type: integer
            documentRevision:
              $ref: '#/components/schemas/DocumentRevision'
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEvent'
        timedOut:
          type: boolean
          description: True if the request reached its timeout before a status change.
    FocusedViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - documentId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
        documentPath:
          type: string
        focusedAt:
          type: string
    ViewSummary:
      type: object
      required:
        - viewId
        - windowId
        - leafId
        - focused
        - active
      properties:
        viewId:
          type: string
        windowId:
          type: string
        leafId:
          type: string
        documentId:
          type: string
        focused:
          type: boolean
        active:
          type: boolean
        documents:
          type: array
          items:
            type: object
            required:
              - documentId
              - path
            properties:
              documentId:
                type: string
              path:
                type: string
    ViewsResponse:
      type: object
      required:
        - views
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewSummary'
    WorkspaceSummary:
      type: object
      required:
        - workspaceId
        - path
      properties:
        workspaceId:
          type: string
        path:
          type: string
    WorkspacesResponse:
      type: object
      required:
        - workspaces
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    LoadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
        - type
        - dirty
        - revision
        - lineCount
        - byteLength
        - views
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - true
        type:
          type: string
          enum:
            - markdown
            - code
        dirty:
          type: boolean
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        lineCount:
          type: integer
        byteLength:
          type: integer
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewSummary'
        review:
          $ref: '#/components/schemas/ReviewSummary'
    UnloadedWorkspaceDocumentSummary:
      type: object
      required:
        - documentId
        - workspaceId
        - uri
        - path
        - name
        - loaded
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
        uri:
          type: string
        path:
          type: string
        name:
          type: string
        loaded:
          type: boolean
          enum:
            - false
      additionalProperties: false
    WorkspaceDocumentSummary:
      oneOf:
        - $ref: '#/components/schemas/LoadedWorkspaceDocumentSummary'
        - $ref: '#/components/schemas/UnloadedWorkspaceDocumentSummary'
    WorkspaceOpenDocumentResponse:
      type: object
      required:
        - focused
        - documentId
      properties:
        focused:
          type: boolean
        documentId:
          type: string
    WorkspaceDocumentsResponse:
      type: object
      required:
        - workspaceId
        - documents
      properties:
        workspaceId:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDocumentSummary'
    SearchDocumentResponse:
      type: object
      required:
        - documentId
        - snapshot
        - revision
        - hits
        - truncated
      properties:
        documentId:
          type: string
        snapshot:
          type: string
        revision:
          $ref: '#/components/schemas/DocumentRevision'
        hits:
          type: array
          items:
            type: object
            required:
              - line
              - column
              - length
              - contextBefore
              - contextAfter
            properties:
              line:
                type: integer
              column:
                type: integer
              length:
                type: integer
              contextBefore:
                type: string
              contextAfter:
                type: string
        truncated:
          type: boolean
    ReviewDetailResponse:
      type: object
      required:
        - reviewId
        - state
        - generation
        - unresolvedChunks
        - packetCount
        - documentRevision
      properties:
        reviewId:
          type: string
        state:
          type: string
        generation:
          type: integer
        unresolvedChunks:
          type: integer
        packetCount:
          type: integer
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    ReviewDiffResponse:
      type: object
      required:
        - reviewId
        - documentId
        - patch
        - generation
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        patch:
          type: string
        generation:
          type: integer
    ReviewChunksResponse:
      type: object
      required:
        - reviewId
        - documentId
        - generation
        - chunks
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        generation:
          type: integer
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingChunk'
    ReviewPacketsResponse:
      type: object
      required:
        - reviewId
        - documentId
        - packets
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        packets:
          type: array
          items:
            $ref: '#/components/schemas/ProposalPacket'
    ClearReviewResponse:
      type: object
      required:
        - reviewId
        - documentId
        - state
        - documentRevision
      properties:
        reviewId:
          type: string
        documentId:
          type: string
        state:
          type: string
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    RetractProposalResponse:
      type: object
      required:
        - retracted
        - packetId
        - reviewId
        - documentId
        - reviewGeneration
        - unresolvedChunks
        - documentRevision
      properties:
        retracted:
          type: boolean
        packetId:
          type: string
        reviewId:
          type: string
        documentId:
          type: string
        reviewGeneration:
          type: integer
        unresolvedChunks:
          type: integer
        documentRevision:
          $ref: '#/components/schemas/DocumentRevision'
    OutstandingChunk:
      type: object
      required:
        - chunkId
        - generation
        - referenceRange
        - workingRange
        - patch
      properties:
        chunkId:
          type: string
        generation:
          type: integer
        referenceRange:
          type: object
          required:
            - fromLine
            - toLine
          properties:
            fromLine:
              type: integer
            toLine:
              type: integer
        workingRange:
          type: object
          required:
            - fromLine
            - toLine
          properties:
            fromLine:
              type: integer
            toLine:
              type: integer
        patch:
          type: string
    ProposalPacket:
      type: object
      required:
        - packetId
        - reviewId
        - clientRequestId
        - appliedAt
        - patchFormat
        - patch
      properties:
        packetId:
          type: string
        reviewId:
          type: string
        clientRequestId:
          type: string
        description:
          type: string
        appliedAt:
          type: string
        patchFormat:
          type: string
        patch:
          type: string
    PingResponse:
      type: object
      required:
        - protocolVersion
        - instanceId
        - pid
      properties:
        protocolVersion:
          type: string
        instanceId:
          type: string
        pid:
          type: integer
    CapabilitiesResponse:
      type: object
      required:
        - protocolVersion
        - supportedPatchFormats
        - reviewSupport
        - retractionSupport
        - maxRequestSize
        - eventStreamSupport
        - eventReplayBufferSize
        - applicationVersion
        - instanceId
      properties:
        protocolVersion:
          type: string
        supportedPatchFormats:
          type: array
          items:
            type: string
            enum:
              - unified-diff
        reviewSupport:
          type: boolean
          const: true
        retractionSupport:
          type: boolean
          const: true
        maxRequestSize:
          type: integer
        eventStreamSupport:
          type: boolean
          const: true
        eventReplayBufferSize:
          type: integer
        applicationVersion:
          type: string
        instanceId:
          type: string
security:
  - bearerToken: []
paths:
  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: Serve the OpenAPI specification
      security: []
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /health:
    get:
      operationId: health
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/ping:
    get:
      operationId: ping
      summary: Protocol version, instance ID, and PID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Supported features and limits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/context:
    get:
      operationId: getContext
      summary: Focused view, focused document, and all open documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorContext'
  /v1/documents:
    get:
      operationId: listDocuments
      summary: List open or loaded documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
            default: open
          description: Reserved document-state filter for clients. Only open is currently
            supported.
    post:
      operationId: openDocument
      summary: Open a server-local file URI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uri
              properties:
                uri:
                  type: string
      responses:
        '201':
          description: Document opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
        '404':
          description: File not found
  /v1/documents/{documentId}:
    get:
      operationId: getDocument
      summary: Document metadata and review status
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
        '404':
          description: Document not found
  /v1/documents/{documentId}/focus:
    post:
      operationId: focusDocument
      summary: Focus or create an editor view for the document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/documents/{documentId}/content:
    get:
      operationId: readDocumentContent
      summary: Read live working or reference text by line slice
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum:
              - working
              - reference
            default: working
        - name: startLine
          in: query
          schema:
            type: integer
        - name: endLine
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadDocumentResponse'
        '404':
          description: Document not found
  /v1/documents/{documentId}/search:
    post:
      operationId: searchDocument
      summary: Literal or regex search against the live buffer
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - literal
              properties:
                literal:
                  type: string
                context:
                  type: integer
                  default: 3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
  /v1/documents/{documentId}/proposals:
    post:
      operationId: submitProposal
      summary: Submit an exact unified-diff packet
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProposalRequest'
      responses:
        '200':
          description: Proposal applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProposalResponse'
        '412':
          description: Stale revision (ETag mismatch)
        '409':
          description: Review generation conflict
        '400':
          description: Invalid or non-applicable patch
  /v1/reviews:
    get:
      operationId: listReviews
      summary: List all active reviews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewSummary'
  /v1/reviews/{reviewId}:
    get:
      operationId: getReview
      summary: Inspect a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '404':
          description: Review not found
  /v1/reviews/{reviewId}/diff:
    get:
      operationId: getReviewDiff
      summary: Retrieve the complete unresolved composite diff
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDiffResponse'
        '404':
          description: Review not found
  /v1/reviews/{reviewId}/chunks:
    get:
      operationId: getReviewChunks
      summary: Inspect current unresolved chunks
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewChunksResponse'
        '404':
          description: Review not found
  /v1/reviews/{reviewId}/packets:
    get:
      operationId: getReviewPackets
      summary: Inspect the proposal-packet ledger
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPacketsResponse'
        '404':
          description: Review not found
  /v1/reviews/{reviewId}/clear:
    post:
      operationId: clearReview
      summary: Discard unresolved suggestions while preserving accepted changes
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearReviewResponse'
        '404':
          description: Review not found
  /v1/proposals/{packetId}/retract:
    post:
      operationId: retractProposal
      summary: Retract an untouched, most-recent packet
      parameters:
        - name: packetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetractProposalResponse'
        '409':
          description: Packet not retractable
  /v1/events:
    get:
      operationId: subscribeEvents
      summary: Subscribe to focus, document, proposal, and review events via SSE
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            Cache-Control:
              description: SSE transport must not be cached by intermediaries.
              schema:
                type: string
              example: no-cache
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Resumes from the next server event after this id.
  /v1/reviews/{reviewId}/events:
    get:
      operationId: waitForReviewEvents
      summary: Long-poll review events and status after a generation advance
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: afterGeneration
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: waitSeconds
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
        - name: wait
          in: query
          deprecated: true
          schema:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
          description: Deprecated alias for waitSeconds.
      responses:
        '200':
          description: Review state and matching event history (or timed out)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEventsResponse'
        '404':
          description: Review not found
  /v1/views:
    get:
      operationId: listViews
      summary: List active editor views
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewsResponse'
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List configured workspaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesResponse'
  /v1/workspaces/{workspaceId}/documents:
    get:
      operationId: listWorkspaceDocuments
      summary: List documents known to a workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: query
